<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Таксопарк «ДСТ-24»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=PT+Mono&display=swap">
<style>
/* Layout: manager game — header, HUD, city ticker, goals/quest, pixel scene, three department desks, tabbed management panel, end-of-day bar. Single dark "night shift" look. */
:root{
  --night:#1d1838; --panel:#2a2450; --panel-2:#352d63; --edge:#0e0b1c;
  --ink:#f3ecdc; --muted:#a8a0cc; --taxi:#f7c331;
  --d1:#4fc7b0; --d2:#ff8a4c; --d3:#e66fa8;
  --good:#86e06f; --bad:#ff6b6b;
  --f-display:"Press Start 2P", "PT Mono", monospace;
  --f-body:"Pixelify Sans", "PT Mono", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4}
.wrap{max-width:1140px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.px{border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px}
.checker{width:36px;height:24px;flex:none;background:conic-gradient(var(--edge) 25%,var(--taxi) 0 50%,var(--edge) 0 75%,var(--taxi) 0) 0 0/12px 12px;border:3px solid var(--edge)}
h1{font-size:clamp(14px,2.6vw,20px);color:var(--taxi);text-shadow:3px 3px 0 var(--edge)}
.head-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.date{font-family:var(--f-display);font-size:10px;background:var(--panel);padding:8px 10px}
.toggle{font-family:var(--f-display);font-size:9px;padding:8px 10px;background:var(--panel-2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.toggle.on{background:var(--taxi);color:var(--edge)}
.goal{font-size:15px;color:var(--muted)}
.goal b{color:var(--ink);font-weight:600}

.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel);padding:10px 12px;display:grid;gap:6px;min-width:0}
.stat .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat .val{font-family:var(--f-display);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--edge);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--taxi);transition:width .4s steps(8)}
.bar.green i{background:var(--good)}
.stat.money .val{color:var(--taxi)}
.flash-up{animation:fu .6s steps(3)}.flash-down{animation:fd .6s steps(3)}
@keyframes fu{50%{color:var(--good)}} @keyframes fd{50%{color:var(--bad)}}

.ticker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ticker .lab{font-family:var(--f-display);font-size:9px;color:var(--muted)}
.news{font-size:15px;background:var(--panel);border:3px solid var(--edge);padding:4px 8px}
.news.up{border-color:var(--good)}.news.down{border-color:var(--bad)}
.news small{color:var(--muted)}

.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.goalbox{background:var(--panel);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;min-width:0}
.goalbox .lvl{font-family:var(--f-display);font-size:9px;color:var(--edge);background:var(--taxi);padding:6px 8px;white-space:nowrap}
.goalbox.quest .lvl{background:var(--d1)}
.goalbox .gt{font-weight:600;min-width:0}
.goalbox .gr{font-size:15px;color:var(--good);grid-column:1/-1}
.goalbox .bar{grid-column:1/-1}

.scene-box{background:var(--edge);overflow:hidden}
#scene{width:100%;height:auto}

.desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.desk{background:var(--panel);min-width:0;position:relative}
.desk-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--dc);color:var(--edge);border-bottom:3px solid var(--edge)}
.desk-head h2{font-size:10px}
.desk-head .boss{margin-left:auto;display:flex;align-items:center;gap:8px;text-align:right;font-size:14px;font-weight:600;line-height:1.15;min-width:0}
.face{width:36px;height:36px;background:var(--panel-2);border:3px solid var(--edge);flex:none}
.face.big{width:60px;height:60px}
.desk-body{padding:14px;display:grid;gap:12px;min-width:0}
.desk h3{font-size:10px;line-height:1.6;color:var(--dc);padding-right:70px}
.ev-text{display:flex;gap:10px;align-items:flex-start}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.funny,.chainb{font-family:var(--f-display);font-size:8px;color:var(--edge);background:var(--taxi);padding:3px 5px}
.chainb{background:var(--d1)}
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel-2);padding:9px 12px;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);font-weight:600;font-size:16px}
.choice:hover{background:#41387a}
.choice:active,.buy:active,.tab:active,.toggle:active{transform:translate(3px,3px);box-shadow:none}
.tag{font-family:var(--f-display);font-size:9px;white-space:nowrap;padding:4px 5px;background:var(--edge);color:var(--taxi)}
.tag.plus{color:var(--good)}
.result{background:var(--edge);padding:10px 12px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-display);font-size:9px;padding:4px 6px;background:var(--panel-2)}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
.stamp{position:absolute;top:62px;right:10px;font-family:var(--f-display);font-size:9px;color:var(--good);border:3px solid var(--good);padding:5px 6px;transform:rotate(-8deg);background:var(--panel)}

.mgmt{background:var(--panel);display:grid;min-width:0}
.mtabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:3px solid var(--edge);background:var(--edge)}
.mtab{font-family:var(--f-display);font-size:9px;padding:12px 12px;background:var(--panel-2);border:0;border-right:3px solid var(--edge);color:var(--muted)}
.mtab.on{background:var(--taxi);color:var(--edge)}
.mbody{padding:14px;display:grid;gap:14px;min-width:0}
.sub{color:var(--muted);font-size:15px}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--f-display);font-size:9px;padding:8px 10px;background:var(--panel-2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.tab.on{background:var(--taxi);color:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card2{background:var(--panel-2);padding:12px;display:grid;gap:8px;align-content:start;min-width:0;border:3px solid var(--edge)}
.car-top{display:flex;align-items:center;gap:10px}
.mini{width:64px;height:36px;background:var(--panel);border:3px solid var(--edge);flex:none}
.card2 h3{font-size:10px;line-height:1.5}
.kind{font-size:14px;color:var(--muted)}
.cls{font-family:var(--f-display);font-size:8px;background:var(--edge);color:var(--taxi);padding:2px 4px;margin-right:4px;vertical-align:1px}
.specs{display:grid;gap:4px;font-size:15px}
.spec{display:flex;justify-content:space-between;gap:8px}
.spec b{font-family:var(--f-display);font-size:9px;font-weight:400;align-self:center;white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:8px;height:8px;background:var(--edge)}.pips i.on{background:var(--good)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.buy{flex:1;font-family:var(--f-display);font-size:9px;padding:9px 8px;background:var(--taxi);color:var(--edge);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);white-space:nowrap}
.buy.alt{background:var(--panel);color:var(--ink)}
.buy.sm{flex:0 0 auto;padding:7px 10px}
.buy:disabled{background:#4a4378;color:#2a2450;cursor:not-allowed}
.done-tag{font-family:var(--f-display);font-size:9px;color:var(--good)}

.tablewrap{overflow-x:auto;max-height:440px;overflow-y:auto;border:3px solid var(--edge)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums;min-width:560px}
th{font-family:var(--f-display);font-size:8px;color:var(--muted);text-align:left;padding:8px;background:var(--edge);position:sticky;top:0}
td{padding:6px 8px;border-bottom:2px solid var(--panel);background:var(--panel-2)}
td .bar{width:70px}
.st-ok{color:var(--good)}.st-bad{color:var(--bad)}

.dept3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dcard{background:var(--panel-2);border:3px solid var(--edge);display:grid;min-width:0}
.dcard .dh{background:var(--dc);color:var(--edge);padding:8px 10px;font-family:var(--f-display);font-size:9px;border-bottom:3px solid var(--edge)}
.dcard .db{padding:12px;display:grid;gap:10px}
.who{display:flex;gap:10px;align-items:center}
.who b{font-size:17px}
.perk{font-size:14px;color:var(--muted)}
.perk strong{color:var(--taxi);font-weight:600}
.namefield{display:flex;gap:6px}
input[type=text]{font:inherit;font-size:15px;background:var(--edge);color:var(--ink);border:3px solid var(--edge);padding:5px 8px;min-width:0;flex:1}
label.chk{display:flex;gap:6px;align-items:center;font-size:15px;cursor:pointer}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-family:var(--f-display);font-size:11px;min-width:3ch;text-align:center}
input[type=range]{width:100%;accent-color:var(--taxi)}

.achs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ach{background:var(--panel-2);border:3px solid var(--edge);padding:10px;display:grid;gap:4px;opacity:.5}
.ach.got{opacity:1;border-color:var(--taxi)}
.ach b{font-family:var(--f-display);font-size:9px;line-height:1.5}
.ach span{font-size:14px;color:var(--muted)}

.bottom{display:flex;flex-wrap:wrap;gap:16px;align-items:start}
.btn{font-family:var(--f-display);font-size:12px;padding:14px 18px;background:var(--taxi);color:var(--edge);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn:disabled{background:#5a5285;color:#2a2450;cursor:not-allowed}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.hint{color:var(--muted);font-size:15px}
.log{flex:1 1 300px;min-width:0;background:var(--panel);padding:12px 14px;max-height:200px;overflow:auto}
.log h3{font-size:10px;color:var(--muted);margin-bottom:8px}
.log ol{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.log li span{color:var(--muted);font-family:var(--f-display);font-size:9px;margin-right:6px}
.actions{display:flex;flex-direction:column;gap:12px}

.modal{position:fixed;inset:0;background:rgba(14,11,28,.84);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);width:min(560px,100%);padding:20px;display:grid;gap:14px;max-height:100%;overflow:auto}
.card h2{font-size:13px;color:var(--taxi);line-height:1.5}
.rows{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:2px dashed var(--panel-2);padding-bottom:5px}
.row b{font-family:var(--f-display);font-size:10px;white-space:nowrap;align-self:center}
.row.total b{color:var(--taxi)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{color:var(--muted);font-size:15px}
.modes,.cands{display:grid;gap:10px}
.mode{display:grid;gap:4px;text-align:left;background:var(--panel-2);padding:12px 14px;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.mode:hover{background:#41387a}
.mode b{font-family:var(--f-display);font-size:10px;font-weight:400;color:var(--taxi);line-height:1.5}
.mode span{color:var(--muted);font-size:15px}
.cand{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel-2);padding:10px 12px;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.cand:hover{background:#41387a}
.cand div{display:grid;gap:2px;min-width:0}
.cand b{font-size:17px}
.cand small{color:var(--muted);font-size:14px}
.step{font-family:var(--f-display);font-size:9px;color:var(--muted)}
.codebox{width:100%;min-height:110px;resize:vertical;font-family:"PT Mono",monospace;font-size:13px;line-height:1.35;background:var(--edge);color:var(--ink);border:3px solid var(--edge);padding:8px;word-break:break-all}
.codebox:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--taxi);color:var(--edge);font-family:var(--f-display);font-size:10px;line-height:1.6;padding:10px 14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* ---- читаемость: крупнее и контрастнее, стиль тот же ---- */
:root{--muted:#c6bfe4;--f-ui:"Pixelify Sans","PT Mono",monospace}
body{font-size:18px;line-height:1.5}
p{max-width:70ch}
h1{font-size:clamp(16px,2.8vw,22px)}
.desk-head h2{font-size:12px}
.desk h3{font-size:12px;line-height:1.7}
.card h2{font-size:15px;line-height:1.6}
.card2 h3{font-size:11px;line-height:1.6}
.stat .val{font-size:13px}
.stat .lbl{font-size:14px;font-weight:600}
.btn{font-size:13px}
.date,.toggle,.ticker .lab,.goalbox .lvl,.funny,.chainb,.tag,.chip,.stamp,.mtab,.tab,.cls,.spec b,.buy,.done-tag,th,.dcard .dh,.count,.ach b,.log li span,.step,.toast,.row b,.mode b,.log h3{
  font-family:var(--f-ui);font-weight:700;letter-spacing:.03em}
.date,.toggle{font-size:15px}
.ticker .lab,.log h3{font-size:15px}
.goalbox .lvl{font-size:14px}
.funny,.chainb{font-size:13px;padding:2px 7px}
.tag{font-size:15px;padding:2px 7px}
.chip{font-size:14px;padding:2px 8px}
.stamp{font-size:14px}
.mtab{font-size:16px;padding:10px 14px}
.tab{font-size:15px;padding:6px 12px}
.cls{font-size:12px;padding:1px 5px}
.spec b{font-size:15px}
.buy{font-size:15px;padding:7px 10px}
.buy.sm{padding:5px 10px}
.done-tag{font-size:15px}
th{font-size:13px}
.dcard .dh{font-size:15px}
.count{font-size:18px}
.ach b{font-size:15px;line-height:1.3}
.log li span{font-size:13px}
.step{font-size:14px}
.toast{font-size:16px;line-height:1.4}
.row b{font-size:16px}
.mode b{font-size:16px;line-height:1.3}
.choice{font-size:17px}
.kind,.perk,.ach span,.cand small,.news,.hint,.sub,.note,.goal{font-size:16px}
.log ol{font-size:16px}
.desk-head .boss{font-size:15px}
.stamp{top:66px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="logo"><div class="checker" aria-hidden="true"></div><h1>Таксопарк «ДСТ-24»</h1></div>
    <div class="head-right">
      <span class="date px" id="date"></span>
      <button class="toggle" id="musicBtn">♪ Музыка</button>
      <button class="toggle" id="sfxBtn">Звуки</button>
    </div>
  </header>
  <div class="goal" id="goalHead"></div>

  <section class="hud" id="hud" aria-label="Показатели парка"></section>
  <div class="ticker" id="ticker"></div>
  <section class="tasks" id="tasks"></section>

  <div class="scene-box px"><canvas id="scene" width="320" height="128" aria-label="Двор таксопарка"></canvas></div>

  <section class="desks" id="desks"></section>

  <section class="mgmt px">
    <div class="mtabs" id="mtabs" role="tablist"></div>
    <div class="mbody" id="mbody"></div>
  </section>

  <div class="bottom">
    <div class="actions">
      <button class="btn" id="endDay" disabled>Закончить день →</button>
      <span class="hint" id="hint"></span>
      <button class="btn ghost" id="saveBtn">Сохранение</button>
      <button class="btn ghost" id="restart">Новая игра</button>
    </div>
    <div class="log px"><h3>ЖУРНАЛ</h3><ol id="log"></ol></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="card px" id="modalCard"></div></div>
<div class="toast px" id="toast" hidden></div>

<script>
/* ================= ДАННЫЕ ================= */
const DAYS=30, GOAL_MONEY=350000, GOAL_CARS=15, OFFICE=2000, PARKING=500, HIRE_COST=8000, STAFF_PAY=900;
const START_DATE=new Date(2026,10,1);

/* порядок = от самых «слабых» к лучшим */
const MODELS={
  granta:{name:'Lada Granta',cls:'Эконом',kind:'б/у, 2018',km0:190000,price:45000,lease:0,mult:.9,fail:.06,repair:6000,resale:25000,body:'#f7c331',trim:'#c9951a'},
  vesta:{name:'Lada Vesta',cls:'Эконом',kind:'б/у, 2019',km0:150000,price:55000,lease:0,mult:.95,fail:.05,repair:6500,resale:32000,body:'#f3ecdc',trim:'#f7c331'},
  moskvich:{name:'Москвич 3',cls:'Эконом',kind:'новый, лизинг',km0:0,price:35000,lease:950,mult:1,fail:.03,repair:0,resale:50000,body:'#e9e4f2',trim:'#e66fa8',note:'Новый, но иногда капризничает'},
  solaris:{name:'Hyundai Solaris',cls:'Эконом',kind:'б/у, 2020',km0:110000,price:75000,lease:0,mult:1,fail:.035,repair:8000,resale:45000,body:'#ffd447',trim:'#d4a21c'},
  rio:{name:'Kia Rio',cls:'Эконом',kind:'б/у, 2021',km0:80000,price:80000,lease:0,mult:1,fail:.03,repair:7500,resale:48000,body:'#ffe27a',trim:'#4fc7b0'},
  solarisNew:{name:'Hyundai Solaris',cls:'Эконом',kind:'новый, лизинг',km0:0,price:40000,lease:1100,mult:1.05,fail:.01,repair:0,resale:60000,rep:1,body:'#fff0a0',trim:'#e0b830'},
  octavia:{name:'Skoda Octavia',cls:'Комфорт',kind:'б/у, 2019',km0:160000,price:110000,lease:0,mult:1.3,fail:.04,repair:10000,resale:65000,body:'#d9dde8',trim:'#4a4570'},
  tiggo:{name:'Chery Tiggo 4 Pro',cls:'Комфорт',kind:'новый кроссовер, лизинг',km0:0,price:50000,lease:1200,mult:1.15,fail:.02,repair:0,resale:70000,rep:1,body:'#ff8a4c',trim:'#c25a22',shape:'suv'},
  jolion:{name:'Haval Jolion',cls:'Комфорт',kind:'новый кроссовер, лизинг',km0:0,price:70000,lease:1500,mult:1.35,fail:.015,repair:0,resale:90000,rep:1,body:'#86c4e0',trim:'#3a7fa0',shape:'suv'},

const payroll=()=>S.heads.reduce((a,h,d)=>a+headDef(d).pay,0)+S.staff.reduce((a,n)=>a+n*STAFF_PAY,0);
const dateOf=day=>{const d=new Date(START_DATE);d.setDate(d.getDate()+day-1);return d};
const mmdd=d=>String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function season(d){const m=d.getMonth();
  if(m===11||m<=1)return{n:'Зима',fail:1.35,demand:1.05};
  if(m===10||m===2)return{n:m===10?'Поздняя осень':'Ранняя весна',fail:1.15,demand:1};
  if(m>=5&&m<=7)return{n:'Лето',fail:1,demand:1.1};
  return{n:m<=4?'Весна':'Осень',fail:1,demand:1}}
const newsDef=n=>NEWS.find(x=>x.id===n.id)||n;
const newsMod=k=>{const add=k==='leave'||k==='risk1';return S.news.reduce((a,n)=>{const N=newsDef(n);return add?a+(N[k]||0):a*(N[k]||1)},add?0:1)};

function addLog(t){S.log.unshift({d:S.day,t});S.log=S.log.slice(0,80)}

/* ---- модификаторы отделов ---- */
function load01(d){const need=d===0?S.drivers/6:carsN()/6, cap=S.staff[d]+1;return Math.min(.4,Math.max(0,need/cap-1)*.15)}
function rm(d){
  const h=headDef(d);let r=1-.07*S.staff[d]-.1*S.train[d]-.08*h.skill+load01(d);
  if(h.key==='gena')r+=.15; if(h.key==='irina')r-=.15;
  if(d===0&&S.upg.call)r-=.12;
  if(d===1)r+=newsMod('risk1');
  return Math.max(.25,Math.min(1.5,r));
}
const repairMult=()=>(hasHead('petrovich')?.7:1)*(S.upg.tire?.65:1)*newsMod('repair');
const failMult=()=>(hasHead('sanya')?.65:1)*(S.upg.diag?.7:1)*season(dateOf(S.day)).fail*newsMod('fail');
const repairCap=()=>2+2*S.staff[2]+(hasHead('olga')?3:0)+(S.upg.lift?2:0);
const carFail=c=>MODELS[c.m].fail*(1+Math.max(0,c.km-MODELS[c.m].km0)/150000);
const carValue=c=>{const M=MODELS[c.m];if(c.lease>0)return 0;return Math.round(M.resale*Math.max(.25,1-Math.max(0,c.km-M.km0)/300000)/500)*500};

function goalAt(i){
  if(i<GOALS.length)return GOALS[i];
  const k=i-GOALS.length,L=k>>2;
  switch(k%4){
    case 0:{const n=30+10*L;return{t:`Довести парк до ${n} машин`,v:()=>carsN(),n,rw:{money:120000+30000*L}}}
    case 1:{const n=800000+400000*L;return{t:`Накопить ${rub(n)} в кассе`,v:()=>S.money,n,rw:{rep:4}}}
    case 2:{const n=4+3*L;return{t:`Собрать ${n} Камри`,v:()=>countM('camry'),n,rw:{money:80000+20000*L}}}
    default:{const n=25+8*L;return{t:`Вывести на линию ${n} экипажей`,v:activeN,n,rw:{money:100000+30000*L,rep:2}}}
  }
}
const rwText=rw=>[rw.money?'+'+rub(rw.money):'',rw.rep?'+'+rw.rep+' к репутации':''].filter(Boolean).join(', ');
function checkGoals(){
  if(S.mode!=='endless'||S.over||S.preview)return;
  let g=goalAt(S.goal);
  while(g.v()>=g.n){
    S.money+=g.rw.money||0;S.rep=Math.min(100,S.rep+(g.rw.rep||0));
    addLog(`Цель ${S.goal+1} выполнена: ${g.t}. Награда: ${rwText(g.rw)}.`);
    toast(`Цель ${S.goal+1} выполнена! ${rwText(g.rw)}`);sfx('win');
    S.goal++;g=goalAt(S.goal);save();
  }
}
function checkAch(){
  if(S.preview)return;
  ACH.forEach(([id,name,,test])=>{if(!S.ach[id]&&test(S)){S.ach[id]=S.day;G.ach[id]=true;saveG();addLog(`Достижение: «${name}»`);toast(`★ Достижение: ${name}`);sfx('win')}});
}

    rent:3200,heads:[0,1,2].map(d=>({key:HEADS[d][0].key,name:HEADS[d][0].name})),staff:[1,1,1],train:[0,0,0],upg:{},spots:12,loans:[],news:[],
    rival:{name:'Жёлтый ветер',cars:10},nextRival:rand(6,9),nextInspect:rand(3,6),quest:null,nextQuest:3,queue:[],hist:[[],[],[]],cnt:{},ach:{},morning:[]};
}

function addCar(m,kmv){const M=MODELS[m];S.fleet.push({m,b:0,id:++S.seq,km:kmv!=null?kmv:(M.km0?M.km0+rand(-15000,15000):rand(0,40)),lease:M.lease?LEASE_DAYS:0})}
function removeCar(){for(const k of MODEL_KEYS){const i=S.fleet.findIndex(c=>c.m===k&&!(c.lease>0));if(i>-1){S.fleet.splice(i,1);return}}if(S.fleet.length)S.fleet.shift()}
function breakCars(n){shuffle(S.fleet.filter(c=>!c.b)).slice(0,n).forEach(c=>c.b=1)}

/* ================= СОБЫТИЯ ДНЯ ================= */
const getEv=(d,ref)=>typeof ref==='string'?CHAINS[ref].ev:EVENTS[d][ref];
function nextEvent(d){
  const qi=S.queue.findIndex(q=>q.d===d&&q.at<=S.day);
  if(qi>-1){const q=S.queue.splice(qi,1)[0];return q.id}
  const funnyP=d===1?(hasHead('gena')?.7:.45):0;
  for(let tries=0;tries<40;tries++){
    if(!S.decks[d].length)S.decks[d]=shuffle(EVENTS[d].map((_,i)=>i));
    const i=S.decks[d].pop(),ev=EVENTS[d][i];
    if(ev.need&&!ev.need(S))continue;
    if(funnyP&&!ev.f&&Math.random()<funnyP*.5&&S.decks[d].some(j=>EVENTS[d][j].f)){S.decks[d].unshift(i);continue}
    return i;
  }
  return 0;
}
function snap(){return{money:S.money,rep:S.rep,drivers:S.drivers,cars:carsN(),broken:brokenN()}}
function apply(fx={},d){
  fx=Object.assign({},fx);
  if(d===0&&hasHead('lena')&&fx.rep<0)fx.rep=Math.ceil(fx.rep/2);
  if(d===2&&hasHead('olga')&&fx.broken>0){let b=0;for(let i=0;i<fx.broken;i++)if(Math.random()<.5)b++;fx.broken=b}
  S.money+=fx.money||0;
  S.rep=Math.max(0,Math.min(100,S.rep+(fx.rep||0)));
  S.drivers=Math.max(0,S.drivers+(fx.drivers||0));
  if(fx.cars>0)for(let i=0;i<fx.cars;i++)addCar('solaris');
  if(fx.cars<0)for(let i=0;i<-fx.cars;i++)removeCar();
  if(fx.broken>0)breakCars(fx.broken);
  if(fx.upg){S.upg[fx.upg]=true;if(fx.upg==='office')S.rep=Math.min(100,S.rep+5)}
  if(fx.cnt)S.cnt[fx.cnt]=(S.cnt[fx.cnt]||0)+1;
}
const evCost=(c,d)=>{let v=typeof c.cost==='function'?c.cost(S):(c.cost||0);if(d===1&&hasHead('timur'))v=Math.round(v*.8/50)*50;return v};
function choose(d,i){
  if(S.done[d]||S.over||S.preview)return;
  const ev=getEv(d,S.today[d]),c=ev.c[i],before=snap();
  S.money-=evCost(c,d);apply(c.fx,d);
  let msg=c.m,bad=isBad(c.fx);
  if(c.r){const rb=isBad(c.r.fx);let p=rb?c.r.p*rm(d):Math.min(.95,c.r.p/rm(d));
    if(d===0&&hasHead('artur')&&!rb)p=Math.min(.95,p*1.3);
    if(Math.random()<p){apply(c.r.fx,d);msg=c.r.m;bad=rb}
    else if(c.bonus&&Math.random()<c.bonus.p){apply(c.bonus.fx,d)}}
  if(c.chain)S.queue.push({d:CHAINS[c.chain].d,id:c.chain,at:S.day+rand(2,4)});
  S.hist[d].push(bad?-1:1);S.hist[d]=S.hist[d].slice(-8);
  const a=snap(),delta={};for(const k in a)delta[k]=a[k]-before[k];
  S.done[d]={choice:i,msg,delta};
  addLog(DEPTS[d].name+': '+msg);sfx(bad?'bad':delta.money>0?'coin':'click');
  save();render(before);
}

/* ================= АВТОСАЛОН, ПАРК, НАЙМ ================= */
function buy(m){
  const M=MODELS[m];if(S.over)return;
  if(carsN()>=S.spots){toast('Стоянка заполнена. Расширьте её во вкладке «База»');sfx('bad');return}
  if(S.money<M.price){toast('Не хватает денег в кассе');sfx('bad');return}
  const before=snap();S.money-=M.price;addCar(m);if(M.rep)S.rep=Math.min(100,S.rep+M.rep);S.cnt.bought=(S.cnt.bought||0)+1;
  addLog(`Автосалон: ${M.name} (${M.kind}) за ${rub(M.price)}${M.lease?`, лизинг ${rub(M.lease)}/день на ${LEASE_DAYS} дн.`:''}.`);
  toast(`${M.name} в парке! Машин: ${carsN()}`);sfx('coin');save();render(before);
}
function sellCar(id){
  const i=S.fleet.findIndex(c=>c.id===id);if(i<0||S.over)return;
  const c=S.fleet[i],M=MODELS[c.m],before=snap(),v=carValue(c);

}

  addLog('Вакансия: '+msg);toast(msg);sfx(n?'coin':'bad');save();render(before);
}

const lotPrice=()=>30000+12000*((S.spots-12)/8);
function buyLot(){if(S.over)return;const p=lotPrice();if(S.money<p){toast('Не хватает денег в кассе');sfx('bad');return}

function staffChange(d,delta){const n=S.staff[d]+delta;if(n<0||n>8||S.over)return;S.staff[d]=n;addLog(`${DEPTS[d].name}: ${delta>0?'нанят сотрудник':'сотрудник уволен'}. Теперь ${n}.`);sfx('click');save();render()}
const trainPrice=d=>15000*(S.train[d]+1);
function train(d){if(S.train[d]>=3||S.over)return;const p=trainPrice(d);if(S.money<p){toast('Не хватает денег в кассе');sfx('bad');return}

function changeHead(d,key,free){

}
function renameHead(d){const v=($('nm'+d).value||'').trim().slice(0,40);if(!v)return;S.heads[d].name=v;if(G.pins[d]&&G.pins[d].key===S.heads[d].key){G.pins[d].name=v;saveG()}toast('Имя сохранено');save();render()}
function pinHead(d,on){G.pins[d]=on?{key:S.heads[d].key,name:S.heads[d].name}:null;saveG();toast(on?'Начальник закреплён для новых игр':'Закрепление снято');render()}
function saveFounders(){G.founders=[0,1,2].map(i=>(($('fn'+i).value||'').trim().slice(0,40))||FOUNDERS[i].name);saveG();toast('Имена учредителей сохранены');render()}
function rentInfo(){const r=S.rent;
  if(r>3200)return `<span class="neg">Водители уходят чаще: примерно ${(((r-3200)/1000*.06+.003)*100).toFixed(1)}% в день каждый</span>`;
  if(r<3200)return `<span class="pos">К вам охотнее идут: шанс нового водителя ${Math.round((3200-r)/600*60)}% в день</span>`;
  return 'Рыночная ставка: водители не уходят и не приходят из-за цены';}
function takeLoan(i){const L=LOANS[i];if(S.loans.length>=2||S.over){toast('Банк не даст больше двух кредитов');return}
  const before=snap();S.money+=L.amount;S.loans.push({amount:L.amount,pay:Math.round(L.amount*L.rate/L.days/10)*10,left:L.days});

/* ================= КОНЕЦ ДНЯ ================= */
const premiumN=()=>S.fleet.filter(c=>MODELS[c.m].cls!=='Эконом').length;
function endDay(){
  const date=dateOf(S.day),sea=season(date),hol=HOLIDAYS[mmdd(date)];
  const working=S.fleet.filter(c=>!c.b).sort((a,b)=>MODELS[b.m].mult-MODELS[a.m].mult);
  const active=Math.min(S.drivers,working.length), factor=0.5+S.rep/100;
  const moods=[[1,null],[1,null],[1,null],[1.15,'Дождь весь вечер: спрос вырос.'],[.9,'Пробки по всему городу: выручка ниже.']];
  const [mood,moodNote]=moods[Math.random()*moods.length|0];
  const demand=mood*sea.demand*newsMod('demand')*(hol?hol[0]:1);
  const base=working.slice(0,active).reduce((a,c)=>a+S.rent*MODELS[c.m].mult,0);
  const revenue=Math.round(base*factor*demand/100)*100;
  const parking=carsN()*PARKING, lease=leaseSum(), pay=payroll(), loans=loanSum();
  const notes=[];
  if(hol){notes.push(`Праздник: ${hol[1]}! Спрос ×${hol[0]}.`);if(hol[1]==='Новогодняя ночь'&&active>0)S.cnt.nye=1}
  if(moodNote)notes.push(moodNote);
  working.slice(0,active).forEach(c=>c.km+=rand(300,450));
  // ремонт: мощность сервиса
  let cap=repairCap();S.fleet.filter(c=>c.b).forEach(c=>{if(cap>0){c.b=0;cap--}});
  const stuck=brokenN();if(stuck)notes.push(`Сервис не успел починить ${stuck} маш. — очередь. Нужно больше механиков.`);
  // ночные поломки
  let repair=0,breaks=0;const fm=failMult(),rmul=repairMult(),names={};
  S.fleet.forEach(c=>{if(!c.b&&Math.random()<carFail(c)*fm){c.b=1;breaks++;repair+=MODELS[c.m].repair*rmul;names[MODELS[c.m].name]=(names[MODELS[c.m].name]||0)+1}});
  repair=Math.round(repair/100)*100;
  const bn=Object.entries(names);
  if(bn.length)notes.push('Ночью сломались: '+bn.map(([n,k])=>k>1?`${n} ×${k}`:n).join(', ')+'.');
  S.fleet.forEach(c=>{if(c.lease>0){c.lease--;if(c.lease===0)notes.push(`Лизинг за ${MODELS[c.m].name} выплачен — машина ваша.`)}});
  S.loans.forEach(l=>l.left--);const paidOff=S.loans.filter(l=>l.left<=0);if(paidOff.length){S.cnt.loanPaid=(S.cnt.loanPaid||0)+paidOff.length;notes.push('Кредит полностью выплачен.')}
  S.loans=S.loans.filter(l=>l.left>0);
  // водители
  const leaveMul=(hasHead('marina')?.6:1)*(S.upg.call?.8:1)*(1+load01(0));
  const leaveP=(.003+Math.max(0,S.rent-3200)/1000*.06+newsMod('leave'))*leaveMul;
  let gone=0;for(let i=0;i<S.drivers;i++)if(Math.random()<leaveP)gone++;
  const idle=Math.max(0,S.drivers-gone-carsN());let idleGone=0;for(let i=0;i<idle;i++)if(Math.random()<.35*leaveMul)idleGone++;
  if(gone)notes.push(`${gone} вод. ушли: ${S.rent>3200?'аренда слишком высокая':'нашли другую работу'}.`);
  if(idleGone)notes.push(`${idleGone} вод. ушли: простаивали без машины.`);
  S.drivers-=gone+idleGone;
  if(S.rep<30&&S.drivers>0&&Math.random()<.4*leaveMul){S.drivers--;notes.push('Водитель ушёл: у парка плохая репутация.')}
  if(S.drivers<carsN()+1&&S.rent<3200&&Math.random()<(3200-S.rent)/600*.6){S.drivers++;notes.push('Пришёл водитель: у вас выгодная аренда.')}
  if(S.drivers<carsN()&&S.rep>=75&&Math.random()<.35){S.drivers++;notes.push('Сам пришёл водитель: слышал, что у вас хорошо.')}
  if(S.upg.wash&&S.day%3===0)S.rep=Math.min(100,S.rep+1);
  // задание агрегатора
  if(S.quest){const q=S.quest;q.days--;
    if(q.type==='shifts')q.prog+=active;
    if(q.type==='nobreak')q.prog+=breaks;
    if(q.type==='premium')q.prog=premiumN();
    if(q.type==='rep'&&S.rep<q.target)q.failed=true;
    if(q.type==='nobreak'&&q.prog>q.target)q.failed=true;
    const ok=(q.type==='shifts'&&q.prog>=q.target)||(q.type==='premium'&&q.prog>=q.target)||((q.type==='rep'||q.type==='nobreak')&&q.days<=0&&!q.failed);
    if(ok){S.money+=q.reward;S.news.push({id:'prio',t:'Приоритет от агрегатора',d:'выручка +10%',demand:1.1,days:5});S.cnt.quests=(S.cnt.quests||0)+1;notes.push(`Задание агрегатора выполнено! +${rub(q.reward)} и приоритет на 5 дней.`);S.quest=null;S.nextQuest=S.day+3}
    else if(q.failed||q.days<=0){notes.push('Задание агрегатора провалено. −2 к репутации.');S.rep=Math.max(0,S.rep-2);S.quest=null;S.nextQuest=S.day+4}}
  // новости
  S.news.forEach(n=>n.days--);S.news=S.news.filter(n=>n.days>0);
  if(S.news.length<2&&Math.random()<.3){const pool=NEWS.filter(n=>!S.news.some(x=>x.id===n.id));const n=pool[Math.random()*pool.length|0];if(n){S.news.push({id:n.id,days:n.days});notes.push(`Новости города: ${n.t} (${n.d}).`)}}
  // конкурент
  if(Math.random()<.5)S.rival.cars++;if(S.rep<40&&Math.random()<.4)S.rival.cars++;
  const net=revenue-OFFICE-pay-parking-lease-loans-repair;
  S.money+=net;
  const lines=[['Экипажей на линии',active],[`Аренда (реп. ×${factor.toFixed(2)}, спрос ×${demand.toFixed(2)})`,rub(revenue)],['Офис',rub(-OFFICE)],['Зарплаты начальников и команд',rub(-pay)],['Стоянка и страховка',rub(-parking)]];
  if(lease)lines.push(['Лизинг',rub(-lease)]);
  if(loans)lines.push(['Кредиты',rub(-loans)]);
  if(repair)lines.push(['Ремонт ночных поломок',rub(-repair)]);
  addLog(`Итог дня: ${net>=0?'+':''}${rub(net)}.`);
  const finished=S.mode!=='endless'&&S.day>=DAYS;S.day++;
  if(S.mode==='endless'){const R=G.rec;R.days=Math.max(R.days,S.day-1);R.cars=Math.max(R.cars,carsN());R.money=Math.max(R.money,S.money);R.goals=Math.max(R.goals,S.goal);saveG()}
  save();
  const lose=S.money<0||S.rep<=0||S.drivers===0;
  sfx(net>=0?'coin':'bad');
  showModal(`<h2>Итоги дня ${S.day-1}</h2>
    <div class="rows">${lines.map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join('')}
    <div class="row total"><span>Чистыми за день</span><b class="${net>=0?'pos':'neg'}">${net>=0?'+':''}${rub(net)}</b></div></div>
    ${notes.map(n=>`<p class="note">${n}</p>`).join('')}
    <button class="btn" id="next">${lose?'Чем всё кончилось':finished?'Подвести итоги':'Начать день '+S.day}</button>`);
  $('next').onclick=()=>{hideModal();if(lose)gameOver();else if(finished)finale();else startDay()};
  $('next').focus();
}

/* ================= УТРО: проверки, конкурент, задания ================= */
function startDay(){
  S.done=[null,null,null];S.hired=false;
  S.today=[0,1,2].map(nextEvent);
  const m=[];
  if(S.day>=S.nextInspect)m.push('inspect');
  if(S.day>=S.nextRival)m.push('rival');
  if(!S.quest&&S.day>=S.nextQuest)m.push('quest');
  S.morning=m;save();render();runMorning();
}
function runMorning(){
  if(!S.morning.length||S.over){save();render();return}
  const k=S.morning.shift();save();
  if(k==='inspect')inspection();else if(k==='rival')rivalEvent();else if(k==='quest')newQuest();
}
const fName=i=>G.founders[i]||FOUNDERS[i].name;

function inspectResult(fi,d,show){

function newQuest(){

  if(type==='nobreak')q={type,target:Math.max(1,Math.round(carsN()/6)),t:'Ночных поломок за 7 дней — не больше'};

function chooseHeads(mode){
  const heads=[null,null,null];
  const step=d=>{
    if(d>2){hideModal();newGame(mode,heads);return}
    const p=G.pins[d];
    if(p&&HEADS[d].some(h=>h.key===p.key)){heads[d]={key:p.key,name:p.name};step(d+1);return}
    pickHead(d,key=>{heads[d]={key,name:HEADS[d].find(h=>h.key===key).name};step(d+1)},true);
  };
  step(0);
}

function chips(dl){
  const out=[];
  if(dl.money)out.push([dl.money>0,(dl.money>0?'+':'')+rub(dl.money)]);
  if(dl.rep)out.push([dl.rep>0,'реп '+(dl.rep>0?'+':'−')+Math.abs(dl.rep)]);
  if(dl.drivers)out.push([dl.drivers>0,(dl.drivers>0?'+':'−')+Math.abs(dl.drivers)+' вод.']);
  if(dl.cars)out.push([dl.cars>0,(dl.cars>0?'+':'−')+Math.abs(dl.cars)+' маш.']);
  if(dl.broken>0)out.push([false,dl.broken+' в ремонте']);
  return out.length?out.map(([up,t])=>`<span class="chip ${up?'up':'down'}">${t}</span>`).join(''):'<span class="chip">без изменений</span>';
}

/* ================= КОД СОХРАНЕНИЯ ================= */
const b64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s)};
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function pipe(bytes,stream){const r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer())}
async function makeCode(){
  const st=Object.assign({},S,{log:S.log.slice(0,15)});
  const json=JSON.stringify({v:1,s:st,g:{pins:G.pins,founders:G.founders}});
  const raw=new TextEncoder().encode(json);
  if(window.CompressionStream){try{return 'DST24Z.'+b64(await pipe(raw,new CompressionStream('deflate-raw')))}catch(e){}}
  return 'DST24B.'+b64(raw);
}
async function readCode(code){
  code=(code||'').replace(/\s+/g,'');
  const m=code.match(/^DST24([ZB])\.(.+)$/);if(!m)throw new Error('format');
  let bytes=unb64(m[2]);
  if(m[1]==='Z'){if(!window.DecompressionStream)throw new Error('browser');bytes=await pipe(bytes,new DecompressionStream('deflate-raw'))}
  const data=JSON.parse(new TextDecoder().decode(bytes));
  const st=data&&data.s;
  if(!st||!Array.isArray(st.fleet)||!Array.isArray(st.heads)||st.heads.length!==3||typeof st.money!=='number')throw new Error('data');
  st.fleet=st.fleet.filter(c=>c&&MODELS[c.m]);
  st.heads=st.heads.map((h,d)=>HEADS[d].some(x=>x.key===(h&&h.key))?{key:h.key,name:String(h.name||'').slice(0,40)||HEADS[d].find(x=>x.key===h.key).name}:{key:HEADS[d][0].key,name:HEADS[d][0].name});
  st.today=(st.today||[]).map((r,d)=>typeof r==='string'?(CHAINS[r]?r:0):(EVENTS[d][r]?r:0));
  return {s:Object.assign(blankState(st.mode==='campaign'?'campaign':'endless'),st,{preview:false}),g:data.g||{}};
}
function openSaveModal(){

    <h2 style="margin-top:6px">Загрузить игру</h2>
    <textarea class="codebox" id="codeIn" placeholder="Вставьте сюда код, который начинается с DST24" aria-label="Код для загрузки"></textarea>
    <p class="note" id="codeMsg"></p>
    <div class="btns"><button class="buy" id="loadCode">Загрузить</button><button class="buy alt" id="closeSave">Закрыть</button></div>`);
  if(canExport)makeCode().then(c=>{$('codeOut').value=c}).catch(()=>{$('codeOut').value='Не получилось создать код. Попробуйте ещё раз.'});
  if($('copyCode'))$('copyCode').onclick=()=>{const t=$('codeOut');const done=()=>{toast('Код скопирован');sfx('coin')};

  let armed=false;
  $('loadCode').onclick=async()=>{

    try{res=await readCode($('codeIn').value)}catch(e){
      msg.className='neg';msg.textContent=e.message==='browser'?'Этот браузер не умеет распаковывать код. Откройте игру в свежем Chrome, Safari или Firefox.':'Код не подошёл. Проверьте, что он скопирован целиком, от «DST24» до последнего символа.';sfx('bad');return}
    if(canExport&&!S.over&&!armed){armed=true;msg.className='neg';msg.textContent=`Текущая игра (день ${S.day}) заменится игрой из кода: день ${res.s.day}, ${rub(res.s.money)}. Нажмите «Загрузить» ещё раз, чтобы подтвердить.`;$('loadCode').textContent='Да, загрузить';return}
    S=res.s;
    if(Array.isArray(res.g.pins)&&res.g.pins.length===3)G.pins=res.g.pins.map((p,d)=>p&&HEADS[d].some(x=>x.key===p.key)?{key:p.key,name:String(p.name||'').slice(0,40)}:null);
    if(Array.isArray(res.g.founders)&&res.g.founders.length===3)G.founders=res.g.founders.map((n,i)=>String(n||'').slice(0,40)||FOUNDERS[i].name);
    saveG();addLog('Игра загружена из кода сохранения.');movers=[];save();hideModal();render();toast(`Игра загружена: день ${S.day}`);sfx('win');
    if(S.over){S.mode!=='endless'&&S.day>DAYS?finale():gameOver()}else if(S.morning&&S.morning.length)runMorning();
  };

}

let AC=null,musicTimer=null,nextNote=0,step16=0;
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(G.music&&!musicTimer)startMusic()}catch(e){}}
function tone(f,dur,type='square',vol=.06,when=0,slide){if(!AC)return;const t0=AC.currentTime+Math.max(0,when),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.02)}
function sfx(k){if(!G.sfx||!AC)return;
  if(k==='click')tone(660,.04,'square',.03);
  if(k==='coin'){tone(988,.07,'square',.05);tone(1319,.14,'square',.05,.07)}
  if(k==='bad')tone(330,.25,'square',.05,0,110);
  if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.1,'square',.05,i*.08))}
  if(k==='alert'){tone(880,.08,'square',.05);tone(880,.08,'square',.05,.14)}}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const MEL=[72,0,76,79,77,0,76,74,72,0,74,76,74,0,71,0, 72,0,76,79,81,0,79,77,76,0,74,72,74,0,0,0];
const BAS=[48,48,55,55,53,53,55,55,48,48,55,55,50,50,55,55];
function startMusic(){if(!AC||musicTimer)return;nextNote=AC.currentTime+.05;musicTimer=setInterval(()=>{
  while(nextNote<AC.currentTime+.25){const st=.2,i=step16%32,w=nextNote-AC.currentTime;
    if(MEL[i])tone(NOTE(MEL[i]),st*.9,'square',.025,w);
    if(i%2===0)tone(NOTE(BAS[(i>>1)%16]),st*1.8,'triangle',.05,w);
    if(i%4===2)tone(2000,.03,'square',.008,w);
    nextNote+=st;step16++}},90)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}

const VAN=["......tt........","kkkkkkkkkkkkk...","kwwkwwkwwkwwwk..","kwwkwwkwwkwwwwk.","kyyyyyyyyyyyyyk.","kyyyyyyyyyyyyyyh","kdkbkbkyyyyyyyyk","kkkookkkkkkookkk","...oo......oo..."];
const shapeOf=m=>({suv:SUV,van:VAN}[(MODELS[m]||{}).shape]||TAXI);

const carPal=m=>{const M=MODELS[m]||MODELS.solaris;return{y:M.body,d:M.trim,k:['camry','mercedes','monjaro'].includes(m)?'#0b0914':'#1a1530'}};
function spr(g,s,x,y,flip,pal){for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){const ch=s[r][c];if(ch==='.')continue;
  g.fillStyle=(pal&&pal[ch])||PAL[ch];g.fillRect(x+(flip?s[r].length-1-c:c),y+r,1,1)}}
function drawMini(el){const g=el.getContext('2d');g.clearRect(0,0,20,11);
  if(el.dataset.m==='person'){spr(g,PERSON,4,3,false,{b:'#f0c8a0',k:'#4fc7b0'});spr(g,PERSON,10,3,false,{b:'#f0c8a0',k:'#e66fa8'});return}
  spr(g,shapeOf(el.dataset.m),2,1,false,carPal(el.dataset.m))}
function face(g,p){g.clearRect(0,0,12,12);if(!p)return;const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  if(p.cat){R(3,1,1,2,'#e8883a');R(8,1,1,2,'#e8883a');R(2,3,8,6,'#e8883a');R(3,9,6,2,'#e8883a');R(4,5,1,1,'#3a8a3a');R(7,5,1,1,'#3a8a3a');R(5,6,2,1,'#e66fa8');R(2,4,1,1,'#b8602a');R(9,4,1,1,'#b8602a');R(5,3,2,1,'#b8602a');R(1,6,2,1,'#f3ecdc');R(9,6,2,1,'#f3ecdc');return}
  if(p.goat){R(2,1,1,2,'#c8c0b0');R(9,1,1,2,'#c8c0b0');R(3,2,6,7,'#f3ecdc');R(4,9,4,2,'#f3ecdc');R(4,5,1,1,'#1a1530');R(7,5,1,1,'#1a1530');R(5,8,2,1,'#e66fa8');R(5,10,2,2,'#c8c0b0');R(1,4,2,1,'#f3ecdc');R(9,4,2,1,'#f3ecdc');return}
  const hair=p.hair,sk=p.skin;
  R(2,10,8,2,p.shirt||'#4a4570');R(5,9,2,1,sk);R(3,3,6,6,sk);
  R(4,5,1,1,'#1a1530');R(7,5,1,1,'#1a1530');R(5,7,2,1,'#9a4a4a');
  if(p.style===0){R(3,2,6,1,hair);R(3,3,1,1,hair);R(8,3,1,1,hair)}
  if(p.style===1){R(3,2,6,1,hair);R(2,3,1,6,hair);R(9,3,1,6,hair);R(3,3,1,1,hair);R(8,3,1,1,hair)}
  if(p.style===2){R(3,4,1,1,hair);R(8,4,1,1,hair)}
  if(p.style===3){R(5,0,2,2,hair);R(3,2,6,1,hair);R(3,3,1,2,hair);R(8,3,1,2,hair)}
  if(p.acc==='glasses'){R(3,5,3,1,'#1a1530');R(6,5,3,1,'#1a1530');R(4,5,1,1,'#9fd3ff');R(7,5,1,1,'#9fd3ff')}
  if(p.acc==='mustache')R(4,6,4,1,hair==='#9a9a9a'||hair==='#8a8a8a'?'#d0d0d0':hair);
  if(p.acc==='beard'){R(3,7,6,2,hair);R(5,7,2,1,'#9a4a4a')}
  if(p.acc==='cap'){R(2,1,8,2,p.cap||'#ff8a4c');R(8,3,3,1,p.cap||'#ff8a4c')}
}
function faceParams(key){const [t,a,b]=key.split(':');
  if(t==='head')return headDef(+a).face;
  if(t==='cand')return(HEADS[+a].find(h=>h.key===b)||{}).face;
  if(t==='founder')return FOUNDERS[+a].face;
  if(t==='char')return CHARS[a]||CHARS.mech;}
function drawFaces(){document.querySelectorAll('canvas.face').forEach(el=>{try{face(el.getContext('2d'),faceParams(el.dataset.face))}catch(e){}})}

/* ---- сцена ---- */
const cv=$('scene'),cx=cv.getContext('2d'),W=320,H=128;
let seed=7;const srnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=Array.from({length:50},()=>[srnd()*W|0,srnd()*34|0,srnd()]);
const sky=[];let sx=0;while(sx<W){const w=8+(srnd()*16|0),h=12+(srnd()*26|0),win=[];for(let i=0;i<w*h/40;i++)win.push([srnd()*(w-2)+1|0,srnd()*(h-3)+2|0]);sky.push({x:sx,w,h,win});sx+=w+1}
const SKIES={night:['#141030','#1b1540','#231c47','#2c2253','#3a2a60'],dawn:['#3a2a60','#6a3f72','#b0607a','#e89a7a','#f5c98a'],day:['#4a88c8','#5c98d4','#70a8dc','#88bce4','#a4d0ec'],dusk:['#2c2253','#4d3268','#8a4a6e','#d06e6a','#f0a070']};
const CYCLE=['night','dawn','day','day','dusk','night'];
const DARKV={night:1,dawn:.5,day:0,dusk:.5};
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lerp=(a,b,f)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*f).toString(16).padStart(2,'0')).join('')};
let movers=[],t=0;
function syncMovers(){
  const working=S.fleet.filter(c=>!c.b).sort((a,b)=>MODELS[b.m].mult-MODELS[a.m].mult);
  const onRoad=working.slice(0,Math.min(S.drivers,working.length,10)).map(c=>c.id);
  movers=movers.filter(m=>onRoad.includes(m.id));
  onRoad.forEach((id,i)=>{if(!movers.find(m=>m.id===id)){const lane=i%2;movers.push({id,m:S.fleet.find(c=>c.id===id).m,x:srnd()*W,lane,v:(lane?-1:1)*(.35+srnd()*.35)})}});
}
function draw(){
  if(!S||!S.fleet||!S.heads)return;syncMovers();
  const L=600,pos=(t%(L*(CYCLE.length-1)))/L,ph=Math.floor(pos),f=pos-ph;
  const a=SKIES[CYCLE[ph]],b=SKIES[CYCLE[ph+1]];
  const dark=DARKV[CYCLE[ph]]*(1-f)+DARKV[CYCLE[ph+1]]*f;
  for(let i=0;i<5;i++){cx.fillStyle=lerp(a[i],b[i],f);cx.fillRect(0,i*10,W,10)}
  cx.fillStyle=lerp(a[4],b[4],f);cx.fillRect(0,50,W,16);
  if(dark>.4)stars.forEach(([x,y,p])=>{if(Math.sin(t/20+p*40)>-.3){cx.fillStyle=p>.7?'#fff6a8':'#a8a0cc';cx.fillRect(x,y,1,1)}});
  if(dark>.5){cx.fillStyle='#f3ecdc';cx.fillRect(280,6,8,8);cx.fillStyle=lerp(a[0],b[0],f);cx.fillRect(283,6,5,5)}
  else{cx.fillStyle='#ffe27a';cx.fillRect(282,6,10,10);cx.fillStyle='#fff6a8';cx.fillRect(284,8,6,6)}
  const bld=lerp('#4a4a7a','#211b3d',dark);
  sky.forEach(s=>{cx.fillStyle=bld;cx.fillRect(s.x,66-s.h,s.w,s.h);if(dark>.3)s.win.forEach(([wx,wy],i)=>{if((i+(t/60|0))%7){cx.fillStyle='#f7c33188';cx.fillRect(s.x+wx,66-s.h+wy,1,1)}})});
  // здание ДСТ-24
  cx.fillStyle='#3b3470';cx.fillRect(4,34,176,46);cx.fillStyle='#0e0b1c';cx.fillRect(4,33,176,2);cx.fillRect(4,34,1,46);cx.fillRect(179,34,1,46);
  cx.fillStyle='#f7c331';cx.fillRect(56,20,72,12);cx.fillStyle='#0e0b1c';cx.fillRect(56,19,72,1);cx.fillRect(56,32,72,1);cx.fillRect(55,20,1,12);cx.fillRect(128,20,1,12);
  cx.fillStyle='#0e0b1c';cx.font='8px "Press Start 2P", monospace';cx.textBaseline='top';cx.fillText('ДСТ-24',62,22);
  if(S.upg.office){cx.fillStyle='#86e06f';cx.fillRect(130,22,4,8)}
  DEPTS.forEach((D,d)=>{
    const x=10+d*57;
    cx.fillStyle=D.hex;cx.fillRect(x,40,48,5);for(let i=0;i<12;i++){cx.fillStyle=i%2?D.hex:'#f3ecdc';cx.fillRect(x+i*4,45,4,2)}
    cx.fillStyle=dark>.4?'#fff6a8':'#9fd3ff';cx.fillRect(x+3,49,16,11);cx.fillStyle='#6fa3d0';cx.fillRect(x+3,54,16,1);cx.fillRect(x+11,49,1,11);
    if(d===2){cx.fillStyle='#211b3d';cx.fillRect(x+24,49,22,31);cx.fillStyle='#4a4570';for(let r=0;r<7;r++)cx.fillRect(x+24,51+r*4,22,1)}
    else{cx.fillStyle='#211b3d';cx.fillRect(x+27,49,15,31);cx.fillStyle=D.hex;cx.fillRect(x+39,63,2,2)}
    if(!S.done[d]&&!S.over&&!S.preview){const bob=Math.round(Math.sin(t/6+d)*1.5);cx.fillStyle='#0e0b1c';cx.fillRect(x+18,25+bob,11,12);cx.fillStyle='#f3ecdc';cx.fillRect(x+19,26+bob,9,10);cx.fillStyle='#ff6b6b';cx.fillRect(x+23,28+bob,2,5);cx.fillRect(x+23,34+bob,2,1)}
    else if(S.done[d]){cx.fillStyle='#86e06f';cx.fillRect(x+20,32,2,2);cx.fillRect(x+22,34,2,2);cx.fillRect(x+24,30,2,4);cx.fillRect(x+26,28,2,2)}
  });
  if(S.cnt.cat){const px=144,py=31;cx.fillStyle='#e8883a';cx.fillRect(px,py,6,3);cx.fillRect(px+5,py-2,3,3);cx.fillRect(px+5,py-3,1,1);cx.fillRect(px+7,py-3,1,1);cx.fillRect(px-2,py-1+Math.round(Math.sin(t/8)),2,1)}
  if(getEv(1,S.today[1]).t==='Гуси на стоянке'){for(let i=0;i<3;i++){const gx=150+i*9+Math.round(Math.sin(t/5+i)*2);cx.fillStyle='#f3ecdc';cx.fillRect(gx,74,5,3);cx.fillRect(gx+4,71,1,3);cx.fillStyle='#ff8a4c';cx.fillRect(gx+5,71,1,1);cx.fillRect(gx+1,77,1,1);cx.fillRect(gx+3,77,1,1)}}
  const idle=Math.max(0,S.drivers-(carsN()-brokenN()));
  for(let i=0;i<Math.min(idle,5);i++)spr(cx,PERSON,170-i*5,74,false,{b:'#f0c8a0',k:['#4fc7b0','#e66fa8','#ff8a4c'][i%3]});
  // стоянка растёт вместе с числом мест
  const cols=10,rowsAll=Math.ceil(S.spots/cols),rows=Math.min(6,rowsAll),lotY=80-rows*8-2;
  cx.fillStyle='#2b2842';cx.fillRect(186,lotY,132,rows*8+2);cx.fillStyle='#0e0b1c';cx.fillRect(186,lotY-1,132,1);
  const roadIds=movers.map(m=>m.id),parked=S.fleet.filter(c=>!roadIds.includes(c.id)).sort((p,q)=>q.b-p.b);
  for(let s=0;s<Math.min(S.spots,rows*cols);s++){const r=s/cols|0,c=s%cols,px=188+c*13,py=lotY+2+r*8;
    cx.fillStyle='#4a4570';cx.fillRect(px-1,py,1,6);
    const car=parked[s];if(car){const brk=car.b,M=MODELS[car.m];
      cx.fillStyle=brk?'#7a6e58':M.body;cx.fillRect(px+1,py+1,10,5);cx.fillStyle=brk?'#5a4e38':M.trim;cx.fillRect(px+3,py+2,5,3);cx.fillStyle='#9fd3ff';cx.fillRect(px+8,py+2,1,3);
      if(brk&&((t>>3)+s)%2){cx.fillStyle='#ff6b6b';cx.fillRect(px+5,py,1,1)}}}
  const hidden=parked.length-rows*cols;if(hidden>0){cx.fillStyle='#f3ecdc';cx.font='6px monospace';cx.fillText(`+${hidden}`,296,lotY-8)}
  // дорога
  cx.fillStyle='#8a83b0';cx.fillRect(0,80,W,3);cx.fillStyle='#2a2740';cx.fillRect(0,83,W,35);
  cx.fillStyle='#f7c331';for(let x=-(t%16);x<W;x+=16)cx.fillRect(x,100,8,1);
  cx.fillStyle='#5a5285';cx.fillRect(0,118,W,10);
  for(let x=20;x<W;x+=60){cx.fillStyle='#8a83b0';cx.fillRect(x,108,1,10);cx.fillRect(x,107,4,1);if(dark>.4){cx.fillStyle='#fff6a833';cx.fillRect(x-2,108,10,10);cx.fillStyle='#fff6a8';cx.fillRect(x+3,108,1,1)}}
  movers.forEach(m=>{m.x+=m.v;if(m.x>W+4)m.x=-20;if(m.x<-20)m.x=W+4;spr(cx,shapeOf(m.m),Math.round(m.x),m.lane?104:87,m.lane===1,carPal(m.m));
    if(dark>.4){cx.fillStyle='#fff6a833';if(m.lane===0)cx.fillRect(Math.round(m.x)+16,91,8,4);else cx.fillRect(Math.round(m.x)-8,108,8,4)}});
  t++;
}
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=0;function loop(ts){if(ts-last>70){draw();last=ts}requestAnimationFrame(loop)}

/* ================= СТАРТ ================= */
S=load();
if(!S){S=blankState('campaign');S.preview=true;START_FLEET.forEach(([m,k])=>addCar(m,k));S.today=[0,1,2].map(nextEvent);render();pickMode()}
else{render();if(S.over){S.mode!=='endless'&&S.day>DAYS?finale():gameOver()}else if(S.morning&&S.morning.length)runMorning()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
draw();if(!still)requestAnimationFrame(loop);else setInterval(draw,1000);
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});
</script>
