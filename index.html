 {t:'Воровство при сборе аренды',f:1,x:'Двое сотрудников отдела при сборе аренды «забывали» сдавать часть денег в кассу. Их поймали по камерам: недостача 40 000 ₽.',c:[
  {l:'Уволить и написать заявление',cost:8000,fx:{staff:-1,money:20000,rep:1},m:'Юрист вернул половину денег по суду. Остальные сотрудники всё поняли.',e:{p:.4,in:[3,6],fx:{rep:-3},m:'Уволенные рассказали журналистам про «бардак в парке». Статья вышла неприятная.'}},
  {l:'Уволить по-тихому',fx:{staff:-1},m:'Ушли без скандала. Денег не вернули.'},
  {l:'Оставить, но вычитать из зарплаты',fx:{money:10000},m:'Вычитаем по частям. Сотрудники обещают исправиться.',r:{p:.45,fx:{money:-25000},m:'Через месяц украли снова. Уже больше.'}}]},
 {t:'Права оказались недействительными',f:1,x:'Водителя подключили неделю назад, а сегодня агрегатор сообщил: его права лишены ещё в прошлом году.',c:[
  {l:'Срочно отключить и проверить всех',cost:3000,fx:{drivers:-1,rep:1},m:'Отключили. Проверка остальных водителей прошла без сюрпризов.'},
  {l:'Отключить и наказать менеджера',fx:{drivers:-1,staff:-1},m:'Менеджер, который не проверил права, уволен.'},
  {l:'Сделать вид, что не знали',m:'Пронесло.',r:{p:.6,fx:{drivers:-1,money:-50000,rep:-6},m:'Водитель попал в ДТП. Огромный штраф парку.'}}]},
 {t:'Кандидат на самокате',f:1,x:'Кандидат приехал на собеседование на самокате. На вопрос о правах ответил: «А на такси нужны?»',c:[
  {l:'Вежливо отказать',m:'Кандидат уехал на самокате в закат.'},
  {l:'Отправить в автошколу за счёт парка',cost:15000,m:'Через три месяца вернётся с правами. Наверное.',chain:'scooter2'}]},
 {t:'Драка за Камри',f:1,x:'Два водителя подрались прямо на стоянке: оба хотят ездить на новой Камри.',need:s=>s.fleet.some(c=>c.m==='camry'),c:[
  {l:'Отдать тому, у кого рейтинг выше',fx:{loy:-3},m:'Решение по-честному. Проигравший дуется.'},
  {l:'Посменно: день один, ночь другой',fx:{loy:2,rep:1},m:'Оба довольны, Камри работает круглосуточно.'},
  {l:'Обоих оштрафовать',fx:{money:4000,loy:-6},m:'Драться перестали. Любить парк тоже.'}]},
 {t:'Отпуск в сезон',x:'Лучший водитель парка просит отпуск на три недели прямо в декабре, когда заказов больше всего.',c:[
  {l:'Отпустить',fx:{loy:3},m:'Водитель уехал на море и прислал фото.',r:{p:.3,fx:{drivers:-1},m:'Ему так понравилось на море, что он не вернулся.'}},
  {l:'Предложить двойную оплату за декабрь',cost:12000,fx:{rep:1},m:'Водитель остался и работает за двоих.'},
  {l:'Отказать',fx:{loy:-5},m:'Водитель остался, но обиделся.'}]},
 {t:'Пассажир забыл кота',f:1,x:'Пассажир забыл в такси переноску с котом. Кот орёт, водитель в панике, пассажир не берёт трубку.',c:[
  {l:'Отвезти кота хозяину',cost:800,fx:{rep:4},m:'Кот дома. Хозяин в слезах благодарности.'},
  {l:'Оставить кота в офисе до вечера',fx:{rep:1},m:'Кот провёл день в офисе и съел чей-то обед.'}]},
 {t:'Оплата картошкой',f:1,x:'Ночью пассажир с дачи предложил вместо денег мешок картошки. Водитель согласился и спрашивает, что теперь с ней делать.',c:[
  {l:'Картошку — в столовую офиса',fx:{rep:1,loy:2},m:'Неделю весь офис ест драники. Боевой дух вырос.'},
  {l:'Удержать стоимость поездки с водителя',fx:{money:600,loy:-4},m:'Водитель расстроился. Картошку унёс домой.'}]},
 {t:'Навигатор на китайском',f:1,x:'Водитель случайно переключил навигатор на китайский и уже час ездит по кругу у ТТК.',c:[
  {l:'Оператор переключит удалённо',m:'Переключили. Водитель выучил три иероглифа.'},
  {l:'Пусть едет по памяти',m:'Доехал по памяти. Пассажир доволен.',r:{p:.4,fx:{rep:-2},m:'Пассажир опоздал и написал отзыв на китайском. Из вредности.'}}]},
 {t:'Шансон на полную',x:'Пассажиры жалуются: водитель слушает шансон на полной громкости и подпевает.',c:[
  {l:'Ввести правило «музыка по желанию пассажира»',fx:{rep:2,loy:-3},m:'Теперь пассажир выбирает музыку. Водитель грустит молча.'},
  {l:'Пусть поёт',m:'Половине пассажиров даже понравилось.',r:{p:.5,fx:{rep:-3},m:'Отзыв «ехала как на концерте, которого не заказывала» набрал сотни лайков.'}}]},
 {t:'Агрегатор поднял комиссию',x:'Агрегатор поднял комиссию на 2%. Водители недовольны и смотрят в сторону других парков.',c:[
  {l:'Взять разницу на себя на месяц',cost:s=>s.drivers*1000,fx:{loy:10,rep:1},m:'Водители оценили. Лояльность выросла.'},
  {l:'Ничего не менять',fx:{loy:-8},m:'Водители ворчат в общем чате.'}]},
 {t:'Студенты на выходные',x:'Студенты автодорожного колледжа хотят подрабатывать по выходным. Опыта мало, энтузиазма много.',c:[
  {l:'Взять двоих',fx:{drivers:2},m:'Двое студентов на линии. Пока аккуратно.',r:{p:.3,fx:{rep:-3},m:'Один студент перепутал газ и тормоз на парковке ТЦ.'}},
  {l:'Только после стажировки',cost:4000,fx:{drivers:1,rep:1},m:'Взяли лучшего после стажировки.'},
  {l:'Отказать',m:'Студенты ушли в доставку.'}]},
 {t:'Анкета для водителей',x:'Отдел предлагает анонимный опрос: что водителям не нравится в парке.',c:[
  {l:'Провести и исправить главное',cost:6000,fx:{loy:8},m:'Главная жалоба — нет нормального кофе. Купили кофемашину.'},
  {l:'Не надо, и так всё ясно',m:'Водители продолжают ворчать в курилке.'}]},
 {t:'Потерянный телефон водителя',x:'Водитель потерял телефон с приложением агрегатора и не может выйти на линию.',c:[
  {l:'Выдать служебный телефон',cost:7000,fx:{loy:4},m:'Водитель на линии через час.'},
  {l:'Пусть покупает сам',fx:{loy:-3},m:'Водитель пропустил два дня, пока покупал новый.'}]},
 {t:'Роды в такси',f:1,x:'Пассажирка родила прямо в машине по дороге в роддом. Водитель помогал по видеосвязи со скорой. Все живы и здоровы.',c:[
  {l:'Премия водителю и химчистка',cost:6000,fx:{rep:6,loy:5},m:'Об истории написали все городские паблики. Водителя зовут крёстным.'},
  {l:'Только химчистка',cost:3000,fx:{rep:3},m:'Машина чистая, история хорошая.'}]},
 {t:'Война в чате водителей',x:'В общем чате водителей ругань: спорят, кто лучше — «Солярис» или «Гранта». Уже 400 сообщений.',c:[
  {l:'Назначить модератора',cost:2000,fx:{loy:3},m:'Чат успокоился. Спор перенесли в курилку.'},
  {l:'Закрыть чат',fx:{loy:-5},m:'Водители создали свой чат. Без вас.'}]},
 {t:'Только аэропорт',x:'Опытный водитель хочет брать только заказы в аэропорт: дорого, но долго ждать в очереди.',c:[
  {l:'Разрешить',fx:{money:3000,loy:3},m:'Аэропортные заказы приносят больше.',r:{p:.3,fx:{money:-4000},m:'Неделя без рейсов из-за погоды. Водитель простаивал.'}},
  {l:'Работать со всеми заказами',fx:{loy:-3},m:'Водитель недоволен, но работает.'}]},
 {t:'Бывший раллист',x:'Кандидат — бывший раллист, 20 лет за рулём. Признаётся, что любит «прохватить».',c:[
  {l:'Взять',fx:{drivers:1},m:'Пассажиры доезжают быстро. И бледные.',r:{p:.45,fx:{money:-8000,rep:-2},m:'Штрафы за скорость пошли пачкой.'}},
  {l:'Отказать',m:'Раллист ушёл в каршеринг.'}]},
 {t:'Мама водителя',f:1,x:'Выяснилось, что водитель каждый день бесплатно катает свою маму по магазинам на машине парка.',c:[
  {l:'Пусть катает, но за свой бензин',fx:{loy:4},m:'Мама передала парку пирожки.'},
  {l:'Запретить',fx:{loy:-4},m:'Мама обиделась. Водитель тоже.'},
  {l:'Брать с мамы по тарифу',fx:{money:1500,loy:-2},m:'Мама платит. Но пирожков больше не будет.'}]},
 {t:'Бабушка Зина',who:'zina',x:'Бабушка Зина каждую среду ездит на рынок и просит только водителя Олега. Сегодня Олег на больничном, а бабушка ждёт у подъезда.',need:s=>!s.cnt.zina,c:[
  {l:'Отправить лучшего водителя и предупредить',fx:{rep:2,cnt:'zina'},m:'Бабушка осталась довольна новым водителем. Сказала, что «вежливый, как Олег».',chain:'zina2'},
  {l:'Отправить того, кто свободен',fx:{cnt:'zina'},m:'Доехали без приключений.',r:{p:.5,fx:{rep:-2},m:'Бабушка обиделась: водитель не помог донести сумки.'}}]},
 {t:'Студент Вася',f:1,who:'vasya',x:'Студент Вася опять опаздывает на экзамен и умоляет ехать «очень-очень быстро».',need:s=>!s.cnt.vasya,c:[
  {l:'Довезти быстро, но по правилам',fx:{rep:1,cnt:'vasya'},m:'Вася успел за минуту до начала. Обещал стать постоянным клиентом.',chain:'vasya2'},
  {l:'Скорость — не наш стиль',fx:{cnt:'vasya'},m:'Вася опоздал и уехал на метро.'}]},
 {t:'Пётр Аркадьевич',who:'boss',x:'Бизнесмен Пётр Аркадьевич ездит каждый день и хорошо платит. Сегодня он недоволен: в машине пахло шаурмой.',need:s=>!s.cnt.boss,c:[
  {l:'Извиниться и закрепить за ним лучшую машину',cost:3000,fx:{rep:2,cnt:'boss'},m:'Пётр Аркадьевич смягчился и пообещал «подумать о сотрудничестве».',chain:'boss2'},
  {l:'Шаурма — это вкусно',fx:{rep:-2,cnt:'boss'},m:'Пётр Аркадьевич ушёл к конкурентам.'}]},
 {t:'Уснувший пассажир',f:1,x:'Пассажир уснул на заднем сиденье и не просыпается на конечной. Водитель звонит в поддержку.',c:[
  {l:'Довезти до дома за счёт парка',cost:600,fx:{rep:3},m:'Довезли. Утром пассажир прислал торт.'},
  {l:'Разбудить музыкой',m:'Сработало. Пассажир подпевал.',r:{p:.3,fx:{rep:-3},m:'Пассажир проснулся злым и написал отзыв капслоком.'}}]},
 // ---- ДИЛЕММЫ (обновление 6) ----
 {t:'Лучший водитель проехал на красный',dl:1,x:'Камера агрегатора сняла, как Руслан — ваш самый прибыльный водитель — проехал на красный с пассажирами. Агрегатор спрашивает: блокировать его или это ошибка?',c:[
  {l:'Признать нарушение',fx:{drivers:-1,rep:3,loy:-4},m:'Руслана заблокировали на месяц. Агрегатор отметил вашу честность, а водители решили, что парк своих не защищает.'},
  {l:'Сказать, что за рулём был сменщик',fx:{loy:4},m:'Агрегатор поверил. Руслан на линии и теперь вам обязан.',r:{p:.35,fx:{rep:-9,money:-25000},m:'Агрегатор сверил селфи-контроль: ложь вскрылась. Штраф и пятно на репутации.'},chain:'ruslan2'},
  {l:'Отстранить на неделю без огласки',fx:{drivers:-1},m:'Руслан неделю сидит дома и злится.',e:{p:.6,in:[6,8],fx:{drivers:1,loy:2},m:'Руслан вернулся после отстранения и ездит аккуратно. Даже пристёгивается.',else:{fx:{rival:1},m:'Руслан так и не вернулся: ушёл к конкурентам и забрал постоянных клиентов.'}}}]},
 {t:'Ультиматум водителей',dl:1,x:'Водители в общем чате договорились: если аренду не снизят на 10%, завтра никто не выйдет на линию. Зачинщик — уважаемый ветеран.',c:[
  {l:'Снизить аренду на 7%',fx:{rent:-7,loy:8},m:'Водители победили и празднуют. Касса будет получать меньше каждый день.',chain:'strike2'},
  {l:'Отказать и перетерпеть',fx:{news:'strike',loy:-6},m:'Два дня половина парка стоит. Вы держите позицию.',e:{p:.5,in:[4,7],fx:{drivers:-2},m:'Зачинщики забастовки ушли в другой парк и увели с собой ещё одного.'}},
  {l:'Договориться с ветераном лично',cost:15000,fx:{loy:2},m:'Ветеран получил «премию» и уговорил всех выйти.',r:{p:.4,fx:{loy:-10,rep:-2},m:'Переписку слили в чат: «нас продали». Доверие к парку рухнуло.'}}]},
 {t:'Пассажир против водителя',dl:1,x:'Пассажир пишет, что водитель Тимофей ему угрожал. Тимофей клянётся, что пассажир был пьян и хамил. Регистратор в тот день не работал.',c:[
  {l:'Отключить Тимофея',fx:{drivers:-1,rep:2,loy:-5},m:'Пассажир доволен. Водители шепчутся: «нас сдают без разбирательств».'},
  {l:'Поверить водителю',fx:{loy:4},m:'Тимофей благодарен. Пассажиру вежливо отказали.',r:{p:.4,fx:{rep:-8},m:'Пассажир выложил пост с подробностями. Тысячи репостов, агрегатор понизил приоритет.'}},
  {l:'Разбирательство с юристом',cost:8000,m:'Юрист опросил свидетелей: прав оказался Тимофей. Обе стороны приняли решение.',r:{p:.5,fx:{drivers:-1,rep:2},m:'Свидетели подтвердили угрозы. Тимофея отключили, пассажир доволен.'},bonus:{p:.6,fx:{rep:2,loy:2}}}]},
 {t:'Звезда конкурента',dl:1,x:'Лучший водитель «Шашечки» готов перейти к вам с тремя друзьями. Условие: аренда на 20% ниже, чем у ваших водителей.',c:[
  {l:'Взять на особых условиях',fx:{drivers:4,loy:-5},m:'Четверо новичков на линии. Старички косятся.',e:{p:.55,in:[5,9],fx:{loy:-6,drivers:-2},m:'Ваши водители узнали про льготы новичков. Двое ушли со словами «мы тут не родные».'}},
  {l:'Только на общих условиях',fx:{rival:1},m:'Звезда отказалась и осталась у конкурента.',r:{p:.45,fx:{drivers:1},m:'Звезда отказалась, но один из друзей всё-таки пришёл.'}},
  {l:'Переманить только звезду, тайно',cost:10000,fx:{drivers:1},m:'Звезда у вас. Тайный договор лежит в сейфе.',r:{p:.35,fx:{loy:-8},m:'Звезда похвасталась условиями в общем чате. Скандал.'}}]},
 {t:'Эксклюзив с агрегатором',dl:1,x:'«Мигом» предлагает эксклюзив: работаете только с ними — получаете бонус и сниженную комиссию. Но если их приложение упадёт, переключиться будет некуда.',c:[
  {l:'Подписать эксклюзив',fx:{money:25000,news:'comm'},m:'Бонус в кассе, комиссия ниже.',e:{p:.55,in:[3,9],fx:{news:'outage',rep:-3},m:'Приложение «Мигом» упало на весь день. Переключиться нельзя по договору — парк простоял.'}},
  {l:'Работать со всеми',fx:{news:'lowprio'},m:'Оставили всё как есть. «Мигом» обиделся и понизил вам приоритет.'},
  {l:'Торговаться',m:'«Мигом» обещал подумать.',r:{p:.5,fx:{money:15000,news:'comm'},m:'Выторговали бонус без эксклюзива! Менеджер «Мигом» впечатлён.'},e:{p:.45,in:[2,4],fx:{news:'lowprio'},m:'Переговоры затянулись, и «Мигом» в отместку урезал приоритет.'}}]},
 {t:'Дядя Миша и медкомиссия',dl:1,x:'Дяде Мише 67, за рулём 40 лет, лучшие отзывы в парке. Но медкомиссия отметила замедленную реакцию. Формально работать можно.',c:[
  {l:'Отстранить от линии',fx:{drivers:-1,loy:-4},m:'Дядя Миша молча сдал ключи. Весь парк это видел.'},
  {l:'Оставить, только днём',m:'Дядя Миша работает в дневные смены.',r:{p:.3,fx:{rep:-6,money:-25000,broken:1},m:'Не успел затормозить у перехода. Обошлось без пострадавших, но ДТП и шум в пабликах.'}},
  {l:'Сделать наставником новичков',cost:12000,fx:{drivers:-1,loy:3},m:'Дядя Миша учит новичков на площадке.',e:{p:.85,in:[5,8],fx:{drivers:2,rep:1},m:'Ученики дяди Миши вышли на линию. Ездят аккуратно и говорят его фразами.'}}]},
 {t:'База конкурента за деньги',dl:1,x:'Сотрудник поддержки шепчет: у него есть выгрузка телефонов всех водителей «Шашечки». Просит 10 000 ₽.',c:[
  {l:'Купить и обзвонить',cost:10000,fx:{drivers:3},m:'Трое водителей конкурента перешли к вам.',r:{p:.35,fx:{money:-60000,rep:-10},m:'«Шашечка» узнала, откуда звонки, и подала в суд за утечку данных.'}},
  {l:'Отказаться и уволить сотрудника',fx:{staff:-1},m:'Сотрудник уволен. Отдел работает с меньшим составом.'},
  {l:'Предупредить конкурента',fx:{staff:-1,rep:2},m:'Конкурент удивлён и благодарен.',e:{p:.65,in:[4,8],fx:{money:20000},m:'Владелец «Шашечки» в благодарность передал вам корпоративного клиента.',else:{fx:{drivers:-1},m:'Конкурент поблагодарил — и тут же переманил вашего водителя. Бизнес есть бизнес.'}}}]},
 {t:'Долг за аренду',dl:1,x:'Водитель Сафар не платит аренду пятый день: долг 15 000 ₽. Говорит, жена в больнице, просит подождать. Остальные водители следят, чем кончится.',c:[
  {l:'Забрать машину',fx:{drivers:-1,loy:-5},m:'Машину забрали. Долг так и висит. Водители запомнили.'},
  {l:'Дать отсрочку',fx:{loy:3},m:'Сафар благодарит и работает.',r:{p:.4,fx:{money:-15000,drivers:-1},m:'Сафар пропал на два дня, потом вернул машину — без денег и без извинений.'}},
  {l:'Простить долг',cost:15000,fx:{loy:7,rep:1},m:'Сафар плакал. Весь парк узнал о вашем поступке.',e:{p:.45,in:[5,9],fx:{money:-12000,loy:-3},m:'Пошёл слух, что долги прощают. Ещё трое «забыли» заплатить аренду.'}}]},
 {t:'Работает по 20 часов',dl:1,x:'Водитель Азамат выплачивает кредит за квартиру и не вылезает из машины по 20 часов. Он приносит больше всех. Агрегатор пока не заметил.',c:[
  {l:'Ограничить смену 12 часами',fx:{loy:-2,rep:1},m:'Азамат недоволен: «мне платить нечем».',r:{p:.35,fx:{drivers:-1},m:'Азамат ушёл в парк, где на часы не смотрят.'}},
  {l:'Не вмешиваться',fx:{money:6000},m:'Азамат возит, касса довольна.',r:{p:.3,fx:{rep:-8,money:-30000,broken:1},m:'Азамат уснул за рулём и въехал в отбойник. Пассажир цел, но история попала в новости.'}},
  {l:'Дать беспроцентный заём',cost:30000,fx:{loy:5},m:'Азамат закрыл самый дорогой кредит и ездит нормальные смены.',e:{p:.8,in:[10,15],fx:{money:33000},m:'Азамат вернул заём досрочно и принёс торт.',else:{fx:{drivers:-1},m:'Азамат уехал на родину. Заём так и не вернул.'}}}]},
 {t:'Блогер-провокатор',dl:1,x:'Блогер катается на такси и выводит водителей из себя на камеру. Ваш водитель сорвался и накричал. Ролик смонтирован так, будто он напал первым.',c:[
  {l:'Извиниться и уволить водителя',fx:{drivers:-1,rep:2,loy:-6},m:'Публика довольна. Водители в шоке: «нас продают за лайки».'},
  {l:'Выложить полную запись',fx:{rep:4},m:'Полная запись показала провокацию. Блогера высмеяли.',r:{p:.45,fx:{rep:-9},m:'На полной записи водитель тоже хорош: ругался последними словами. Стало только хуже.'}},
  {l:'Промолчать',fx:{rep:-3},m:'Шум постепенно стихает.',e:{p:.5,in:[3,6],fx:{rep:-4},m:'Блогер выпустил вторую часть: «Такси, которое молчит». Снова в трендах.'}}]},
 {t:'Агрегатор и отмены',dl:1,x:'Ваши водители отменяют дешёвые заказы. Агрегатор грозит понизить приоритет всему парку.',c:[
  {l:'Штрафовать за отмены',fx:{rep:3,loy:-7},m:'Отмен стало меньше. Злости в курилке — больше.',r:{p:.3,fx:{drivers:-1},m:'Один водитель ушёл: «за копейки возить не буду».'}},
  {l:'Доплачивать за дешёвые заказы',cost:s=>s.drivers*900,fx:{rep:2,loy:3},m:'Водители берут всё подряд. Касса платит разницу.'},
  {l:'Пусть понижают',fx:{news:'lowprio',loy:2},m:'Водители рады, что их не трогают. Заказов стало меньше.'}]},
 {t:'Ночной контракт с барами',dl:1,x:'Сеть баров предлагает контракт: каждую ночь развозить гостей. Деньги отличные, но гости… весёлые.',c:[
  {l:'Взять контракт',fx:{money:20000},m:'Первая выплата в кассе.',e:{p:.6,in:[2,5],fx:{broken:1,loy:-4,rep:-2},m:'Гость бара испортил салон и подрался с водителем. Водители не хотят ночных смен.'}},
  {l:'Взять, но с доплатой водителям',fx:{money:9000,loy:3},m:'Водители берут ночные смены охотно.',e:{p:.35,in:[2,5],fx:{broken:1},m:'Салон после ночной смены пришлось отмывать два дня.'}},
  {l:'Отказаться',fx:{rival:1},m:'Контракт забрал конкурент. Его машины теперь стоят у каждого бара.'}]},
],
[ // АВТОПАРК
 {t:'Истекает ОСАГО',x:'У трёх машин полис ОСАГО заканчивается послезавтра.',c:[
  {l:'Продлить все три',cost:27000,m:'Все машины застрахованы.'},
  {l:'Продлить одну',cost:9000,m:'Пока пронесло.',r:{p:.35,fx:{money:-16000,rep:-3,broken:1},m:'Машину без полиса остановили: штраф и штрафстоянка.'}},
  {l:'Ездить так',m:'Повезло, рейдов не было.',r:{p:.6,fx:{money:-30000,rep:-6,broken:2},m:'Две машины без полиса попали на рейд.'}}]},
 {t:'ДТП во дворе',x:'Водитель Денис задел столб при парковке. Нужно оформить и решить, кто платит.',c:[
  {l:'За счёт парка',cost:14000,fx:{broken:1,rep:1},m:'Машина день в ремонте, Денис благодарен.'},
  {l:'Удержать с водителя',fx:{broken:1},m:'Денис согласился платить частями.',r:{p:.4,fx:{drivers:-1},m:'Денис не согласился и уволился.'}},
  {l:'Оформить по КАСКО',cost:3000,fx:{broken:1},m:'Страховая оплатила ремонт, франшиза 3 000 ₽.'}]},
 {t:'Эвакуатор',x:'Машину увезли на штрафстоянку: водитель встал под знак.',c:[
  {l:'Забрать сразу',cost:5500,m:'Машина вернулась на линию к обеду.'},
  {l:'Забрать, удержать с водителя',m:'Водитель признал вину и заплатил.',r:{p:.3,fx:{drivers:-1},m:'Водитель хлопнул дверью и ушёл.'}},
  {l:'Забрать завтра',cost:3000,fx:{broken:1},m:'Машина простояла сутки.'}]},
 {t:'Штрафы с камер',x:'Пришло 7 штрафов за превышение скорости, всего 3 500 ₽.',c:[
  {l:'Оплатить со скидкой 50%',cost:1750,m:'Оплатили в первые 20 дней со скидкой.'},
  {l:'Переадресовать водителям',m:'Водители оплатили сами.',r:{p:.2,fx:{drivers:-1},m:'Один водитель возмутился и ушёл.'}}]},
 {t:'Старая Гранта',x:'Одна Гранта совсем устала. Нашёлся покупатель на запчасти.',need:s=>s.fleet.some(c=>c.m==='granta'),c:[
  {l:'Продать',fx:{money:30000,cars:-1},m:'Продали за 30 000 ₽.'},
  {l:'Оставить',m:'Старушка держится.',r:{p:.4,fx:{money:-12000,broken:1},m:'Старушка сломалась прямо на линии.'}}]},
 {t:'Брендирование',x:'Агрегатор предлагает наклейки и шашки со скидкой. Пассажиры охотнее садятся в брендированные машины.',c:[
  {l:'Брендировать парк',cost:s=>s.fleet.length*2000,fx:{rep:5},m:'Парк в фирменных цветах «ДСТ-24». Отзывы стали лучше.'},
  {l:'Отказаться',m:'Машины остались без наклеек.'}]},
 {t:'Гена и дизель',f:1,who:'gena',x:'Гена из автопарка «сэкономил» и залил в бензиновую машину дизель. Говорит, дизель же дешевле.',c:[
  {l:'Слить топливо в сервисе',cost:6000,fx:{broken:1},m:'Слили, промыли, к вечеру машина завелась. Гена обиделся.'},
  {l:'Отправить Гену на курсы',cost:2000,fx:{broken:1},m:'Гена уехал учиться. Машина день стояла.',chain:'gena2'}]},
 {t:'Где машина?',f:1,x:'По документам в парке на одну машину больше, чем на стоянке. Автопарк ищет её полдня.',c:[
  {l:'Поставить GPS-трекеры',cost:s=>s.fleet.length*1500,fx:{rep:1},m:'Машина нашлась у тёщи водителя на даче. Больше не потеряется.'},
  {l:'Обзвонить водителей',m:'Нашли во дворе соседнего дома. Просто забыли.',r:{p:.3,fx:{money:-10000,broken:1},m:'Нашли на штрафстоянке. Уже третий день.'}}]},
 {t:'Ключи в машине',f:1,who:'vitaly',x:'Виталик из автопарка захлопнул ключи в машине. Запасные ключи тоже лежат в этой машине. Для надёжности.',c:[
  {l:'Вызвать вскрытие',cost:3000,m:'Мастер открыл за 40 секунд и долго смеялся.'},
  {l:'Пусть Виталик разбирается',m:'Виталик открыл дверь линейкой. Где он этому научился, не говорит.',r:{p:.5,fx:{money:-7000,broken:1},m:'Виталик разбил форточку. Ключи достал, машина в ремонте.'},chain:'vit2'}]},
 {t:'Красивые номера',f:1,x:'Сотрудник автопарка заклеил госномера наклейками «ДСТ-24». Говорит, так солиднее.',c:[
  {l:'Срочно отклеить',m:'Отклеили. Сотрудник расстроен, дизайн был хороший.'},
  {l:'Ну красиво же',fx:{rep:1},m:'Пассажиры фотографируют. ГИБДД пока не заметила.',r:{p:.65,fx:{money:-15000,rep:-3},m:'ГИБДД не оценила дизайн. Штраф 15 000 ₽.'}}]},
 {t:'ОСАГО в Paint',f:1,x:'Автопарк прислал таблицу сроков ОСАГО. Это скриншот из Paint, даты закрашены, потому что «так понятнее».',c:[
  {l:'Купить нормальный учёт',cost:10000,fx:{rep:1},m:'Теперь сроки полисов видно, напоминания приходят сами.'},
  {l:'Разобраться вручную',m:'Восстановили даты по бумажным полисам.',r:{p:.4,fx:{money:-15000,broken:1},m:'Один полис уже истёк. Машину остановили.'}}]},
 {t:'Гуси на стоянке',f:1,who:'gena',x:'На стоянку пришли гуси и не пускают водителей к машинам. Гена говорит, что справится.',c:[
  {l:'Вызвать специалиста',cost:2500,fx:{cnt:'geese'},m:'Гусей вежливо выпроводили.'},
  {l:'Пусть Гена справится',fx:{cnt:'geese'},m:'Гена победил гусей. Ходит гордый.',r:{p:.6,fx:{broken:1,rep:-1},m:'Гена проиграл гусям. Одна смена так и не выехала.'}},
  {l:'Покормить и подружиться',cost:300,fx:{rep:2,cnt:'geese'},m:'Гуси теперь охраняют парк. Водители в восторге.'}]},
 {t:'500 ёлочек',f:1,x:'Закупщик автопарка заказал 500 ароматизаторов «Морской бриз» вместо 50. Склад пахнет морем.',c:[
  {l:'Продать водителям',fx:{money:2000},m:'Водители раскупили. Весь парк пахнет морем.'},
  {l:'Дарить пассажирам',fx:{rep:3},m:'Пассажиры уносят ёлочки на память. Рейтинг растёт.'}]},
 {t:'Не ту на разборку',f:1,x:'Автопарк должен был сдать на разборку убитый кузов. Уехала живая рабочая машина. Кузов стоит на месте.',c:[
  {l:'Выкупить обратно',cost:25000,m:'Машину вернули, но без зеркал. Зеркала тоже выкупили.'},
  {l:'Махнуть рукой',fx:{cars:-1},m:'Одной машиной меньше. Сотрудник получил выговор.'},
  {l:'Пусть сотрудник выкупает сам',fx:{staff:-1,rel:-2},m:'Сотрудник выкупил машину на свои деньги и уволился. Начальник отдела ворчит: «людей и так нет».',r:{p:.4,fx:{cars:-1},m:'Сотрудник не успел: машину уже распилили. И сам уволился.'}}]},
 {t:'Европротокол',f:1,x:'Мелкое ДТП. Сотрудник автопарка расписался в графе «виновник» за другого водителя.',c:[
  {l:'Переоформить у юриста',cost:4000,m:'Переоформили. Сотрудник обещал больше не помогать.'},
  {l:'Оставить как есть',m:'Второй участник не стал спорить. Повезло.',r:{p:.5,fx:{money:-18000},m:'Страховая отказала. Ремонт чужой машины за ваш счёт.'}}]},
 {t:'Принтер сломался',f:1,x:'В автопарке сломался принтер, путевые листы не печатаются. Сотрудник предлагает писать их от руки «красивым почерком».',c:[
  {l:'Купить новый принтер',cost:8000,m:'Новый принтер печатает. Старый унесли на память.'},
  {l:'Писать от руки',m:'Почерк правда красивый. Никто не придрался.',r:{p:.4,fx:{money:-5000,broken:1},m:'ГИБДД не приняла рукописный путевой лист. Штраф и простой.'}}]},
 {t:'Диагностические карты',x:'У четырёх машин заканчиваются диагностические карты. Без них нельзя работать в такси.',c:[
  {l:'Пройти техосмотр',cost:4000,m:'Все четыре машины прошли техосмотр.'},
  {l:'Отложить',m:'Пока никто не проверял.',r:{p:.45,fx:{money:-12000,broken:2},m:'Две машины сняли с линии на проверке. Штраф.'}}]},
 {t:'Разрешение такси',x:'На новые машины ещё не оформлено разрешение на перевозку пассажиров.',c:[
  {l:'Оформить разрешения',cost:s=>Math.max(1,Math.ceil(s.fleet.length/5))*2500,m:'Все машины в реестре такси.'},
  {l:'Работать так',m:'Повезло, не проверяли.',r:{p:.5,fx:{money:-25000,rep:-3},m:'Рейд: машины без разрешения. Крупный штраф.'}}]},
 {t:'Стажёр перепутал машины',f:1,x:'Стажёр автопарка перепутал записи в базе: водители уехали на чужих машинах, а штрафы пришли не тем.',c:[
  {l:'Остановить всех и пересадить',cost:3000,m:'Пересадили за час. Стажёр составил таблицу. Неправильно.'},
  {l:'Разобраться вечером',m:'Вечером всё распутали.',r:{p:.4,fx:{rep:-3,drivers:-1},m:'Водителю пришёл чужой штраф на 30 000 ₽. Он ушёл, хлопнув дверью.'}}]},
 {t:'Ключ от сейфа',f:1,who:'gena',x:'Гена ушёл в отпуск и увёз с собой ключ от сейфа с документами на машины. Гена на рыбалке, связи нет.',c:[
  {l:'Вызвать мастера по сейфам',cost:5000,m:'Сейф вскрыли. Внутри документы и бутерброд Гены.'},
  {l:'Ехать к Гене на рыбалку',cost:1500,fx:{broken:1},m:'Гену нашли на озере. Ключ был в кармане удочки. Машина день стояла без документов.'}]},
 {t:'Попытка угона',x:'Ночью машину пытались угнать. Сработала сигнализация, вор убежал.',c:[
  {l:'Поставить противоугонки на все машины',cost:s=>s.fleet.length*1000,fx:{rep:1},m:'Весь парк под защитой.'},
  {l:'Обойдёмся',m:'Больше не пытались.',r:{p:.25,fx:{cars:-1},m:'Через неделю машину всё-таки угнали. Не нашли.'}}]},
 {t:'ДТП попало в соцсети',x:'Видео аварии с такси «ДСТ-24» разлетелось по пабликам. Виноват другой водитель, но комментаторы ругают парк.',c:[
  {l:'Опубликовать запись регистратора',fx:{rep:3},m:'Запись всё объяснила. Комментаторы извинились.',r:{p:.3,fx:{rep:-6},m:'На записи заметили, что ваш водитель говорил по телефону. Комментаторы переключились на него.'}},
  {l:'Промолчать',fx:{rep:-2},m:'Обсуждение утихло, но осадок остался.'}]},
 {t:'Отчёт для бухгалтерии',f:1,x:'Бухгалтерия просит отчёт по штрафам за месяц. Автопарк сдал фотографию доски с маркерными записями.',c:[
  {l:'Внедрить учёт штрафов',cost:9000,fx:{rep:1},m:'Штрафы теперь подгружаются сами и вовремя оплачиваются со скидкой.'},
  {l:'Принять фото доски',m:'Бухгалтер вздохнула и перепечатала.',r:{p:.4,fx:{money:-8000},m:'Половину штрафов пропустили. Пришли с удвоенной суммой.'}}]},
 {t:'Реагенты съели пороги',x:'Зимние реагенты разъели пороги у нескольких машин. Появилась ржавчина.',c:[
  {l:'Антикоррозийная обработка',cost:s=>s.fleet.length*800,m:'Кузова защищены до весны.'},
  {l:'Ничего не делать',m:'Ржавчина пока небольшая.',r:{p:.3,fx:{rep:-2,money:-6000},m:'Пассажир порвал брюки о ржавый порог. Скандал и компенсация.'}}]},
 {t:'Узкое место у бизнес-центра',x:'Минивэн нужно поставить задом в узкое место у бизнес-центра, иначе охрана выпишет штраф.',c:[
  {l:'Парковать самому (мини-игра)',game:'park',win:{fx:{rep:2,money:3000},m:'Встал идеально. Охрана аплодирует, клиент доволен.'},lose:{fx:{money:-5000},m:'Поцарапали бампер о столбик. Ремонт за счёт парка.'}},
  {l:'Встать подальше',fx:{rep:-1},m:'Пассажиры шли пешком под дождём.'}]},
 {t:'ОСАГО не на ту машину',f:1,x:'Сотрудник оформил полис ОСАГО на машину, которую парк продал два месяца назад. А нужная машина ездит без полиса.',c:[
  {l:'Срочно переоформить',cost:9000,m:'Переоформили. Сотрудник получил выговор и календарь.'},
  {l:'Пусть сотрудник платит сам',fx:{staff:-1},m:'Сотрудник уволился, но полис оплатил.',r:{p:.3,fx:{money:-15000},m:'Пока разбирались, машину остановили без полиса.'}}]},
 {t:'Двойник машины',x:'Камеры фиксируют машину парка одновременно в Москве и в Туле. Кто-то сделал клон номеров.',c:[
  {l:'Заявление в полицию и замена номеров',cost:5000,fx:{broken:1},m:'Номера заменили. Двойнику больше не повезёт.'},
  {l:'Оспаривать штрафы по одному',m:'Штрафы отменяют, но медленно.',r:{p:.5,fx:{money:-12000},m:'Часть штрафов пришлось оплатить.'}}]},
 {t:'Аренда стоянки дорожает',x:'Хозяин стоянки поднимает плату на 20% со следующего месяца.',c:[
  {l:'Договориться о скидке за долгий договор',cost:10000,fx:{rep:0},m:'Подписали договор на год со старой ценой.'},
  {l:'Платить новую цену',fx:{money:-8000},m:'Платим больше. Эта стоянка нам нужна.'}]},
 {t:'Телематика в машины',x:'Поставщик предлагает GPS-трекеры с контролем стиля вождения. Видно, кто гоняет.',c:[
  {l:'Поставить на все машины',cost:s=>s.fleet.length*1800,fx:{rep:2,loy:-3},m:'Гонщиков стало меньше. Водители ворчат про «слежку».'},
  {l:'Не нужно',m:'Обходимся без трекеров.'}]},
 {t:'Эвакуатор у офиса',f:1,x:'Эвакуатор увёз машину прямо от офиса автопарка. Её поставил начальник автопарка.',c:[
  {l:'Оплатить и забрать',cost:5500,m:'Забрали. Начальник автопарка делает вид, что это не он.'},
  {l:'Пусть начальник платит сам',fx:{rep:1,rel:-2},m:'Начальник заплатил и повесил себе табличку «не парковаться».'}]},
 {t:'Ночной таксист из автопарка',f:1,x:'Сотрудник автопарка по ночам брал служебную Камри и сам таксовал через своё приложение.',need:s=>s.fleet.some(c=>c.m==='camry'),c:[
  {l:'Уволить',fx:{staff:-1},m:'Уволен. Камри ночует на стоянке.'},
  {l:'Оформить водителем',fx:{drivers:1,rep:1},m:'Раз так любит водить — пусть возит официально.'},
  {l:'Забрать заработанное',fx:{money:12000,loy:-2},m:'Сотрудник отдал выручку за месяц. И больше так не делает.'}]},
 {t:'Страховая не платит',x:'Страховая третий месяц не выплачивает по ДТП, где виноват другой водитель. 60 000 ₽ на кону.',c:[
  {l:'Нанять юриста',cost:10000,m:'Юрист выбил выплату.',bonus:{p:.55,fx:{money:60000}}},
  {l:'Ждать',m:'Страховая обещает «вот-вот».',r:{p:.45,fx:{money:30000},m:'Неожиданно заплатили сами. Половину.'}}]},
 {t:'Новые договоры аренды',x:'Изменились правила: договоры аренды с водителями нужно переоформить по новой форме.',c:[
  {l:'Переоформить всем',cost:s=>s.drivers*300,m:'Все договоры по новой форме.'},
  {l:'Оформлять только новым',m:'Старые договоры пока работают.',r:{p:.35,fx:{money:-20000},m:'Проверка нашла старые договоры. Штраф.'}}]},
 {t:'Двойная оплата штрафов',f:1,x:'Бухгалтер автопарка оплатил одни и те же штрафы дважды: за неделю — 18 000 ₽ лишних.',c:[
  {l:'Оформить возврат',cost:500,fx:{money:15000},m:'Вернули почти всё. Бухгалтер ставит галочки в таблице.'},
  {l:'Махнуть рукой',m:'Деньги не вернуть. Бухгалтер купил новый калькулятор.'}]},
 {t:'Собака съела документы',f:1,x:'Сотрудник автопарка взял домой документы на три машины. Говорит, их съела собака. Есть фото собаки.',c:[
  {l:'Восстановить документы',cost:6000,fx:{broken:1},m:'Документы восстановили, машина день стояла.'},
  {l:'Проверить, правда ли собака',fx:{staff:-1},m:'Собаки у сотрудника нет. Фото из интернета. Уволен.',r:{p:.4,fx:{broken:1,rel:-1},m:'Собака оказалась настоящей. Сотрудник оскорбился и уволился, документы всё равно пришлось восстанавливать.'}}]},
 {t:'Соседи жалуются на шум',x:'Жильцы дома рядом со стоянкой жалуются: машины прогревают моторы в 5 утра.',c:[
  {l:'Поставить шумозащитный забор',cost:15000,fx:{rep:2},m:'Соседи довольны и даже здороваются.'},
  {l:'Попросить водителей не газовать',m:'Стало тише.',r:{p:.4,fx:{money:-5000,rep:-2},m:'Соседи написали в управу. Штраф.'}}]},
 {t:'Субсидия от города',x:'Город выдаёт субсидию паркам, которые перекрасят машины в единый цвет такси.',c:[
  {l:'Перекрасить и подать документы',cost:2000,fx:{rep:2,broken:2},m:'Две машины два дня в покраске. Документы приняли.',bonus:{p:.65,fx:{money:30000}}},
  {l:'Лень возиться',m:'Субсидию получили другие.'}]},
 {t:'Без бампера и без слов',f:1,x:'Водитель вернул машину без переднего бампера и уверяет, что «так и было».',c:[
  {l:'Посмотреть видеорегистратор',cost:500,fx:{money:8000,loy:-4},m:'На записи видно, как бампер остался на сугробе. Водитель оплатил ремонт, но обиделся на проверку.',r:{p:.25,fx:{drivers:-1},m:'Водитель оплатил ремонт и уволился: «раз не доверяете».'}},
  {l:'Починить за счёт парка',cost:8000,fx:{broken:1},m:'Бампер новый. Тайна осталась тайной.'}]},
 {t:'Номер А666АА',f:1,x:'Новой машине выдали номер А666АА. Суеверные пассажиры отменяют заказы, увидев номер.',c:[
  {l:'Поменять номер',cost:4000,m:'Теперь номер скучный. Заказы не отменяют.'},
  {l:'Сделать из этого фишку',fx:{rep:2},m:'«Адское такси» стало мемом в городе. Заказывают специально.',r:{p:.4,fx:{rep:-3},m:'Мем не зашёл. Отмены продолжились.'}}]},
 {t:'Связка всех ключей',f:1,x:'Сотрудник автопарка потерял общую связку запасных ключей от всех машин.',c:[
  {l:'Заказать новые ключи',cost:s=>s.fleet.length*1500,m:'Новые ключи готовы. Связку теперь хранят на цепи.'},
  {l:'Искать всем отделом',m:'Нашли в кармане его же куртки.',r:{p:.4,fx:{broken:2},m:'Не нашли. Две машины без ключей простояли день.'}}]},
 {t:'Машины в залоге',x:'Проверка ПТС показала: две машины, купленные с рук, всё ещё в залоге у банка прошлого владельца.',need:s=>s.fleet.length>=8,c:[
  {l:'Нанять юриста и снять залог',cost:20000,m:'Залог снят. Машины чистые.'},
  {l:'Оставить как есть',m:'Банк пока молчит.',r:{p:.3,fx:{cars:-1},m:'Банк забрал одну машину в счёт долга прошлого владельца.'}}]},
 {t:'QR-код в каждую машину',x:'Агрегатор требует наклеить QR-код для отзывов в каждую машину до конца недели.',c:[
  {l:'Наклеить во всех',cost:s=>s.fleet.length*200,fx:{rep:1},m:'Готово. Отзывов стало больше.'},
  {l:'Не успеваем',fx:{news:'photo'},m:'Агрегатор временно понизил приоритет.'}]},
 {t:'Племянник учредителя',f:1,x:'В автопарк устроился племянник одного из учредителей. Он ничего не умеет, зато очень старается.',c:[
  {l:'Отправить учиться',cost:8000,m:'Племянник прошёл курсы и даже научился оформлять ОСАГО.'},
  {l:'Дать безопасную работу: мыть машины',fx:{rep:1},m:'Племянник моет машины до блеска. Учредитель доволен.'},
  {l:'Уволить',fx:{angry:1},m:'Уволен. На следующей проверке дядя-учредитель будет придираться.'}]},
 {t:'Мойка с люком',f:1,x:'Сотрудник отправил машину на автомойку с открытым люком. В салоне пена по колено.',c:[
  {l:'Химчистка',cost:4000,fx:{broken:1},m:'Салон вычистили. Пахнет вишней.'},
  {l:'Сушить феном',fx:{broken:1},m:'Сушили весь день всем автопарком.',r:{p:.4,fx:{rep:-2},m:'Не досушили. Пассажир сел в лужу.'}}]},
 // ---- ДИЛЕММЫ (обновление 6) ----
 {t:'Инспектор намекает',dl:1,x:'Инспектор нашёл пять машин без свежих диагностических карт. Намекает, что за 30 000 ₽ он «ничего не видел».',c:[
  {l:'Заплатить',cost:30000,fx:{tdebt:1},m:'Инспектор ушёл довольный. Машины работают.',r:{p:.2,fx:{money:-80000,rep:-12},m:'Инспектора задержали за взятки. В его телефоне — номер вашего парка.'}},
  {l:'Снять машины и пройти техосмотр',cost:10000,fx:{broken:3,rep:1},m:'Три машины день стояли на техосмотре. Зато всё чисто.'},
  {l:'Отказать и спорить',m:'Инспектор пожал плечами и не стал связываться.',r:{p:.6,fx:{money:-40000,broken:2},m:'Протокол, штраф 40 000 ₽ и две машины на штрафстоянке.'}}]},
 {t:'Договориться без ГИБДД',dl:1,x:'Ваш водитель виноват в ДТП. Второй участник предлагает не вызывать ГИБДД, если ему отдадут 40 000 ₽ наличными. Иначе — страховая и рост тарифа.',c:[
  {l:'Оформить через страховую',fx:{broken:1},m:'Всё по закону. Машина в ремонте.',e:{p:.9,in:[8,14],fx:{money:-18000},m:'Страховая пересчитала тариф ОСАГО для всего парка. Дороже.'}},
  {l:'Заплатить наличными',cost:40000,m:'Разошлись по-хорошему.',r:{p:.25,fx:{money:-35000},m:'Через неделю «пострадавший» всё-таки пошёл в ГИБДД — и деньги не вернул.'}},
  {l:'Заплатить из зарплаты водителя',fx:{loy:-5},m:'Водитель отдаёт долг частями.',r:{p:.5,fx:{drivers:-1,money:-40000},m:'Водитель отказался платить и уволился. Платить пришлось парку.'}}]},
 {t:'Три машины за полцены',dl:1,x:'Перекупщик отдаёт три «Соляриса» почти даром. Ходят слухи, что это утопленники после наводнения на юге.',need:s=>s.spots-s.fleet.length>=3,c:[
  {l:'Купить все три',cost:120000,fx:{cars:3},m:'Три машины на стоянке. Выглядят как новые.',e:{p:.65,in:[6,12],fx:{broken:3,money:-45000,rep:-2},m:'Электрика утопленников начала сыпаться. Три машины встали одновременно.'}},
  {l:'Купить одну на пробу',cost:40000,fx:{cars:1},m:'Одна машина в парке.',e:{p:.6,in:[6,12],fx:{broken:1,money:-15000},m:'Пробный «Солярис» оказался утопленником. Хорошо, что один.'}},
  {l:'Отказаться',fx:{rival:3},m:'Перекупщик продал машины конкуренту.'}]},
 {t:'Скрученный пробег',dl:1,x:'В двух купленных машинах пробег скручен на 200 000 км. Продавец предлагает 20 000 ₽, чтобы вы не шли в суд.',need:s=>s.fleet.length>=6,c:[
  {l:'Взять деньги и молчать',fx:{money:20000},m:'Деньги в кассе. Моторы уставшие.',e:{p:.55,in:[5,10],fx:{broken:1,money:-18000},m:'Мотор «скрученной» машины не выдержал реального пробега.'}},
  {l:'Подать в суд',cost:8000,m:'Иск подан. Суд будет долгим.',e:{p:.55,in:[8,14],fx:{money:70000,rep:1},m:'Суд выигран: продавец вернул деньги за обе машины.',else:{fx:{money:-5000},m:'Суд проигран: продавец доказал, что «так и было». Ещё и судебные расходы.'}}},
  {l:'Перепродать дальше',fx:{cars:-2,money:110000},m:'Машины проданы. Новый владелец пока счастлив.',r:{p:.3,fx:{rep:-8},m:'Покупатель докопался до пробега и снял ролик «Таксопарк продаёт скрутки». Позор.'}}]},
 {t:'Ремонт дороже машины',dl:1,x:'Старой машине нужен ремонт за 45 000 ₽, а сама она стоит 30 000 ₽. Водитель Ильяс ездит на ней пять лет и просит не списывать.',need:s=>s.fleet.length>=4,c:[
  {l:'Чинить',cost:45000,fx:{loy:3},m:'Машина как новая. Ильяс счастлив.'},
  {l:'Продать на запчасти',fx:{cars:-1,money:15000,loy:-3},m:'Машину увезли на разборку. Ильяс пересел на другую и грустит.'},
  {l:'Продать Ильясу в рассрочку',fx:{cars:-1,loy:6},m:'Ильяс выкупает машину по чуть-чуть и чинит сам.',e:{p:.7,in:[10,16],fx:{money:30000},m:'Ильяс полностью выкупил машину. Деньги в кассе.',else:{fx:{loy:-2},m:'Ильяс перестал платить рассрочку. Судиться с ним рука не поднимается.'}}}]},
 {t:'Эвакуаторная «крыша»',dl:1,x:'Владелец эвакуаторов предлагает: 12 000 ₽ — и ваши машины «случайно» не увозят. Отказ, намекает он, будет дорогим.',c:[
  {l:'Платить',cost:12000,m:'Эвакуаторы объезжают ваши машины стороной.',e:{p:.5,in:[10,15],fx:{money:-12000},m:'«Крыша» подняла цену. Платите снова.'}},
  {l:'Отказать',m:'Владелец эвакуаторов улыбнулся и ушёл.',e:{p:.65,in:[2,5],fx:{broken:2,money:-12000},m:'Эвакуаторы вдруг полюбили ваши машины: две увезли за день.'}},
  {l:'Заявить в полицию',fx:{rep:2},m:'Заявление принято.',e:{p:.5,in:[4,9],fx:{rep:4},m:'Схему накрыли. В новостях вас назвали смелым парком.',else:{fx:{broken:2,money:-15000},m:'Дело затянулось, а эвакуаторы мстят: две машины на штрафстоянке.'}}}]},
 {t:'ОСАГО как на личные',dl:1,x:'Страховой агент предлагает оформить ОСАГО на машины парка как на личные — втрое дешевле. «Все так делают».',c:[
  {l:'Оформить дёшево',fx:{money:25000,tdebt:2},m:'Сэкономили 25 000 ₽.',e:{p:.4,in:[6,15],fx:{money:-80000,rep:-5},m:'После ДТП страховая отказала: машина работала в такси без такси-полиса. Ремонт чужой машины за ваш счёт.'}},
  {l:'Платить по-честному',fx:{money:-5000},m:'Полисы правильные. Агент назвал вас «романтиками» и поднял цену.'},
  {l:'Дёшево только на старые машины',fx:{money:10000,tdebt:1},m:'Сэкономили на старичках.',e:{p:.2,in:[6,15],fx:{money:-40000,rep:-3},m:'Старая машина попала в ДТП. Страховая нашла подвох.'}}]},
 {t:'Гена и машина учредителя',f:1,dl:1,who:'gena',x:'Гена взял личную машину Бориса Ильича «помыть» и поцарапал дверь о шлагбаум. Учредитель приедет за ней вечером.',c:[
  {l:'Сказать правду',fx:{angry:1,rep:1},m:'Учредитель багровел минуту. Потом сказал: «Хорошо, что не врёте». Но на проверке это припомнит.'},
  {l:'Тайно перекрасить дверь',cost:25000,m:'Дверь как новая. Гена клянётся молчать.',r:{p:.3,fx:{angry:1,rep:-2},m:'Учредитель заметил, что дверь другого оттенка. Теперь он зол вдвойне.'}},
  {l:'Свалить на мойку',m:'Учредитель поехал ругаться на мойку.',r:{p:.5,fx:{angry:1,rep:-3},m:'На мойке есть камеры. На записи — Гена и шлагбаум.'}}]},
 {t:'Ветеран против учёта',dl:1,x:'Нина Петровна 25 лет ведёт документы парка в тетрадке. Электронный учёт всё ускорит, но Нина Петровна сказала: «Или я, или компьютер».',c:[
  {l:'Внедрить учёт без неё',cost:8000,fx:{staff:-1,tdebt:-2},m:'Учёт работает. Нина Петровна ушла, хлопнув дверью.',e:{p:.45,in:[3,7],fx:{money:-15000},m:'Без Нины Петровны никто не знал, где оригиналы ПТС. Восстановление стоило денег.'}},
  {l:'Оставить тетрадку',m:'Нина Петровна довольна. Документы в тетрадке.',e:{p:.4,in:[5,10],fx:{money:-12000,broken:1},m:'Тетрадка потерялась. Пропустили срок полиса, машину остановили.'}},
  {l:'Уговорить попробовать',cost:4000,m:'Нина Петровна согласилась на курсы и освоила учёт.',r:{p:.45,fx:{staff:-1},m:'После первого занятия Нина Петровна уволилась: «Мышка меня ненавидит».'},bonus:{p:.7,fx:{tdebt:-2}}}]},
 {t:'Камеры в салоне',dl:1,x:'После пары спорных поездок отдел предлагает поставить камеры в салон каждой машины. Водители против «слежки».',c:[
  {l:'Поставить во все машины',cost:s=>s.fleet.length*1500,fx:{rep:3,loy:-6},m:'Камеры стоят. Споры с пассажирами решаются за минуту.',e:{p:.5,in:[4,8],fx:{drivers:-1},m:'Один водитель ушёл: «Не хочу, чтобы на меня смотрели 12 часов».'}},
  {l:'Только по желанию водителя',cost:3000,fx:{rep:1},m:'Камеры поставили трое водителей.',e:{p:.25,in:[3,8],fx:{money:-10000},m:'Спорная поездка случилась именно в машине без камеры. Пришлось платить пассажиру.'}},
  {l:'Не ставить',fx:{loy:2},m:'Водители довольны.',e:{p:.4,in:[3,8],fx:{rep:-4,money:-15000},m:'Спорная поездка без записи: пассажир дошёл до суда, парк заплатил компенсацию.'}}]},
 {t:'Стоянку продают',dl:1,x:'Хозяин стоянки продаёт участок. Вам предлагают выкупить его за 180 000 ₽. Новый хозяин, скорее всего, поднимет плату.',need:s=>s.money>=150000&&!s.lotOwned,c:[
  {l:'Выкупить стоянку',cost:180000,fx:{lot:1},m:'Стоянка ваша. Плата за места снизилась навсегда.'},
  {l:'Не покупать',m:'Стоянку купила сеть автомоек.',e:{p:.8,in:[4,8],fx:{money:-30000},m:'Новый хозяин стоянки поднял плату и выставил счёт задним числом.'}},
  {l:'Купить вскладчину с конкурентом',cost:90000,fx:{lot:1},m:'Стоянка общая с «Шашечкой».',e:{p:.5,in:[5,12],fx:{rep:-2,money:-12000},m:'Совладелец-конкурент занимает лучшие места и «случайно» перекрывает выезд.'}}]},
 {t:'Машина — вещдок',dl:1,x:'Пассажир оставил в такси сумку с крадеными телефонами. Полиция забрала машину как вещественное доказательство «на пару недель».',c:[
  {l:'Ждать',fx:{hold:14},m:'Машина на полицейской стоянке.'},
  {l:'Нанять адвоката',cost:25000,fx:{hold:3},m:'Адвокат пообещал вернуть машину за три дня.'},
  {l:'Помочь следствию записями',fx:{hold:8,rep:3},m:'Записи регистратора помогли найти вора. Полиция поблагодарила парк в новостях.',r:{p:.3,fx:{broken:1,money:-6000},m:'Подельники вора узнали, кто помог полиции, и разбили машине стёкла.'}}]},
],
[ // СЕРВИС
 {t:'Плановое ТО',x:'Две машины прошли 15 000 км. Пора на техобслуживание.',c:[
  {l:'Сделать ТО',cost:12000,m:'Масло, фильтры, колодки. Всё в порядке.'},
  {l:'Отложить на месяц',m:'Машины пока бегают.',r:{p:.4,fx:{money:-25000,broken:1},m:'На линии сломалась коробка. Ремонт дорогой.'}}]},
 {t:'Сезонная резина',x:'По утрам заморозки. Пора переобуваться.',c:[
  {l:'Переобуть весь парк',cost:s=>s.fleet.length*(s.upg.tire?1200:2500),fx:{rep:1},m:'Весь парк на правильной резине.'},
  {l:'Только половину',cost:s=>Math.ceil(s.fleet.length/2)*(s.upg.tire?1200:2500),m:'Остальные успели до гололёда.',r:{p:.3,fx:{money:-20000,broken:1,rep:-3},m:'Машину на летней резине занесло. Мелкое ДТП.'}},
  {l:'Подождём',m:'Погода смилостивилась.',r:{p:.5,fx:{money:-35000,broken:2,rep:-5},m:'Гололёд. Два ДТП за утро.'}}]},
 {t:'Трещина на лобовом',x:'Камень на МКАДе. Трещина 20 см через всё стекло.',c:[
  {l:'Заменить стекло',cost:9000,m:'Новое стекло стоит.'},
  {l:'Ездить пока так',m:'Никто не заметил.',r:{p:.4,fx:{money:-5000,rep:-3},m:'Штраф за трещину и плохой отзыв пассажира.'}}]},
 {t:'Стучит подвеска',x:'Водитель жалуется: на кочках что-то стучит спереди справа.',c:[
  {l:'Поменять стойку',cost:7000,fx:{broken:1},m:'Стойку заменили, машина день в сервисе.'},
  {l:'Подтянуть и выпустить',cost:1000,m:'Стук пропал. Пока.',r:{p:.45,fx:{money:-15000,broken:1},m:'Стойка развалилась на ходу. Эвакуатор и ремонт.'}}]},
 {t:'Горит «Чек»',x:'У трёх машин горит лампа Check Engine. Диагностика стоит 1 500 ₽ за машину.',c:[
  {l:'Продиагностировать все',cost:4500,m:'Две ошибки по датчикам, одна по свечам. Всё поправили.'},
  {l:'Заклеить лампочку',m:'Лампочки не видно — проблемы нет.',r:{p:.5,fx:{money:-18000,broken:1},m:'Пропуски зажигания убили катализатор.'}}]},
 {t:'Неоригинальные запчасти',x:'Поставщик предлагает колодки и фильтры в два раза дешевле оригинала.',c:[
  {l:'Брать оригинал',cost:10000,m:'Склад сервиса пополнен оригиналом.'},
  {l:'Брать дешёвые',cost:5000,m:'Пока работают нормально.',r:{p:.4,fx:{money:-12000,broken:1,rep:-2},m:'Колодки стёрлись за неделю. Машина чуть не въехала в автобус.'}}]},
 {t:'Сели аккумуляторы',x:'Ночью был мороз. Утром четыре машины не завелись.',c:[
  {l:'Купить пусковое устройство',cost:6000,m:'Прикурили всех за 20 минут.'},
  {l:'Прикуривать от соседей',m:'Добрые соседи помогли.',r:{p:.5,fx:{broken:2},m:'Соседи кончились. Две машины не выехали.'}}]},
 {t:'Второй подъёмник',who:'mech',x:'Механики просят второй подъёмник: очередь в ремонт растёт.',need:s=>!s.upg.lift,c:[
  {l:'Купить подъёмник',cost:35000,fx:{rep:2,upg:'lift'},m:'Очереди нет, механики довольны.'},
  {l:'Работать как есть',m:'Механики вздохнули и продолжили.',r:{p:.35,fx:{broken:2},m:'Очередь в ремонт: две машины не успели выйти.'}}]},
 {t:'Кот в моторе',f:1,who:'cat',x:'Механик открыл капот, а там спит рыжий кот. Уходить отказывается.',need:s=>!s.cnt.cat,c:[
  {l:'Взять кота в сервис',cost:500,fx:{rep:3,cnt:'cat'},m:'Кот Карбюратор официально принят в штат.',chain:'cat2'},
  {l:'Аккуратно выселить',fx:{broken:1},m:'Кота выселяли до вечера. Машина простояла.'}]},
 {t:'Скрип тормозов',f:1,who:'mech',x:'Механик говорит, что скрипят колодки. Новенький механик говорит, что это поёт водитель.',c:[
  {l:'Проверить колодки',cost:3000,m:'Скрипели колодки. Водитель тоже пел, но это не лечится.'},
  {l:'Поверить новенькому',m:'Водитель действительно пел.',r:{p:.5,fx:{money:-9000,broken:1},m:'Скрипели колодки. Теперь ещё и диски менять.'}}]},
 {t:'Не то масло',f:1,who:'mech',x:'Новенький механик залил в мотор трансмиссионное масло. Говорит, «масло же, какая разница».',c:[
  {l:'Слить и промыть мотор',cost:5000,fx:{broken:1},m:'Мотор спасли. Механику показали, где какое масло.'},
  {l:'Пусть поездит, посмотрим',m:'Мотор подозрительно затих, но работает.',r:{p:.55,fx:{money:-30000,broken:1},m:'Мотор заклинило. Капитальный ремонт.'}}]},
 {t:'Не работает кондиционер',x:'В трёх машинах не работает кондиционер. Пассажиры жалуются на духоту.',c:[
  {l:'Заправить и починить',cost:9000,fx:{rep:1},m:'Кондиционеры дуют холодом.'},
  {l:'Открыть окна',m:'Пассажиры потерпели.',r:{p:.5,fx:{rep:-4},m:'Посыпались жалобы на духоту и низкие оценки.'}}]},
 {t:'Запчасти застряли',x:'Поставщик задерживает запчасти на неделю. На складе пусто.',c:[
  {l:'Купить у перекупа втридорога',cost:12000,m:'Запчасти есть, машины на ходу.'},
  {l:'Ждать поставщика',fx:{broken:2},m:'Две машины ждут запчастей.'}]},
 {t:'Кто главный механик?',f:1,who:'mech',x:'Два механика неделю спорят, кто из них старший. Ремонт стоит, потому что они спорят даже о ключах.',c:[
  {l:'Назначить старшего с прибавкой',cost:5000,m:'Старший назначен. Второй обиделся, но работает.'},
  {l:'Устроить соревнование: кто быстрее поменяет колесо',fx:{rep:1},m:'Соревнование собрало весь парк. Колёса меняли рекордно быстро.',r:{p:.3,fx:{broken:1},m:'Торопились и не дотянули гайки. Колесо уехало отдельно.'}}]},
 {t:'Дворники живут своей жизнью',f:1,who:'mech',x:'В одной машине дворники включаются сами, а магнитола переключается на шансон. Водитель уверен, что в машине призрак.',c:[
  {l:'Починить проводку',cost:4000,fx:{broken:1},m:'Нашли перетёртый провод. Призрак ушёл, шансон остался по желанию водителя.'},
  {l:'Позвать батюшку',cost:2000,m:'Освятили машину. Дворники успокоились. Механики в недоумении.',r:{p:.5,fx:{broken:1,money:-4000},m:'Не помогло. Пришлось менять блок предохранителей.'}}]},
 {t:'Сервисная кампания',x:'Производитель отзывает Solaris: бесплатная замена детали у дилера, но машины простоят день.',need:s=>s.fleet.some(c=>c.m==='solaris'||c.m==='solarisNew'),c:[
  {l:'Отправить все сразу',fx:{broken:2,rep:1},m:'Детали заменили бесплатно. Машины день стояли.'},
  {l:'По одной, без простоя',cost:2000,m:'Отправляли по одной вечером. Дольше, зато без простоев.'}]},
 {t:'Загнать на подъёмник',who:'mech',x:'Механики заболели, на месте только стажёр. Машину нужно аккуратно загнать на подъёмник.',c:[
  {l:'Загнать самому (мини-игра)',game:'park',win:{fx:{rep:1},m:'Ровно на лапы подъёмника. Стажёр в восхищении.'},lose:{fx:{broken:1,money:-4000},m:'Заехали криво, помяли порог. Ремонт.'}},
  {l:'Ждать механиков до завтра',fx:{broken:1},m:'Машина простояла день.'}]},
 {t:'Пробит радиатор',x:'Камень пробил радиатор, машина закипела на трассе.',c:[
  {l:'Новый радиатор',cost:8000,fx:{broken:1},m:'Радиатор заменён, машина день в сервисе.'},
  {l:'Запаять старый',cost:2000,m:'Держится.',r:{p:.45,fx:{money:-15000,broken:1},m:'Пайка лопнула, мотор перегрелся. Ремонт дорогой.'}}]},
 {t:'Сломался подъёмник',x:'Главный подъёмник в сервисе заклинило. Машины чинят «на коленке».',c:[
  {l:'Срочный ремонт подъёмника',cost:10000,m:'Подъёмник снова работает.'},
  {l:'Чинить на домкратах',fx:{broken:2},m:'Ремонт идёт вдвое медленнее. Очередь растёт.'}]},
 {t:'Масло в коробку',f:1,who:'mech',x:'Механики залили в автоматическую коробку моторное масло. Машина дёргается и пинается. Что с этим делать?',c:[
  {l:'Слить, промыть коробку, залить правильное',cost:9000,fx:{broken:1},m:'Коробку спасли. Механикам повесили таблицу «какое масло куда».'},
  {l:'Ездить, пока едет',m:'Пока едет. Дёргается, но едет.',r:{p:.6,fx:{money:-45000,broken:1},m:'Коробка умерла. Замена обошлась очень дорого.'}},
  {l:'Удержать стоимость с механиков',cost:9000,fx:{broken:1,money:6000},m:'Коробку промыли, механики оплатили часть из своей зарплаты.'}]},
 {t:'Донор для двух',f:1,who:'mech',x:'Чтобы отремонтировать две машины, сервис решил разобрать третью и снять с неё запчасти.',need:s=>s.fleet.length>=6,c:[
  {l:'Разрешить',fx:{broken:1},m:'Две машины на ходу, третья стоит раздетая. Зато без затрат на детали.'},
  {l:'Запретить и купить запчасти',cost:18000,m:'Все три машины целы, но склад опустел.'},
  {l:'Списать донора окончательно',fx:{cars:-1,money:12000},m:'Донор пошёл на запчасти полностью. Остатки продали на разборку.'}]},
 {t:'Механик уснул под машиной',f:1,who:'mech',x:'Механик уснул под машиной на подъёмнике прямо во время ремонта. Храп слышно на весь сервис.',c:[
  {l:'Разбудить и отправить домой',fx:{broken:1},m:'Выспался дома. Ремонт продолжили завтра.'},
  {l:'Поставить в сервис кофемашину',cost:12000,fx:{rep:1},m:'Механики бодры как никогда.'}]},
 {t:'Шиномонтаж «налево»',f:1,who:'mech',x:'Механики по вечерам переобувают соседям машины в вашем сервисе и берут деньги себе.',c:[
  {l:'Легализовать: пусть делятся',fx:{money:8000,loy:0},m:'Теперь у сервиса есть «вечерний шиномонтаж». Доход общий.'},
  {l:'Уволить зачинщика',fx:{staff:-1},m:'Зачинщик ушёл. Остальные стали работать тише.'},
  {l:'Сделать вид, что не видели',m:'Механики довольны.',r:{p:.4,fx:{rep:-2},m:'Сосед пожаловался, что колесо открутилось. На ваш сервис.'}}]},
 {t:'Взорвался компрессор',x:'В сервисе с грохотом лопнул компрессор. Никто не пострадал, но шины качать нечем.',c:[
  {l:'Купить новый',cost:15000,m:'Новый компрессор работает тише и лучше.'},
  {l:'Качать ручным насосом',fx:{broken:1},m:'Механики накачали за день руки. И шины.'}]},
 {t:'Восстановленные моторы',x:'Поставщик предлагает восстановленные двигатели втрое дешевле новых.',c:[
  {l:'Купить пару про запас',cost:20000,m:'Моторы лежат на складе. Пригодятся.'},
  {l:'Брать только новые',m:'Остаёмся на новых деталях.'}]},
 {t:'Перегрев в пробке',x:'Жара и пробки: у двух машин закипели моторы.',c:[
  {l:'Промыть радиаторы всем',cost:s=>s.fleet.length*600,m:'Охлаждение у всего парка как новое.'},
  {l:'Починить только эти две',cost:6000,fx:{broken:2},m:'Две машины день в сервисе.'}]},
 {t:'Курсы по электромобилям',x:'Механики просят отправить их на курсы по ремонту электромобилей.',c:[
  {l:'Отправить',cost:15000,fx:{rep:1},m:'Механики теперь не боятся высоковольтных батарей.'},
  {l:'Пока не нужно',m:'Электромобили будем чинить у дилера.'}]},
 {t:'Механик-вертолётчик',f:1,who:'mech',x:'Новый механик раньше чинил вертолёты. Он предлагает «немного улучшить» Гранту.',need:s=>s.fleet.some(c=>c.m==='granta'),c:[
  {l:'Разрешить эксперимент',m:'Гранта стала тише и экономичнее. Как — он не говорит.',r:{p:.4,fx:{broken:1,money:-6000},m:'Гранта пыталась взлететь. Не получилось.'}},
  {l:'Только по инструкции',m:'Механик вздохнул и работает по инструкции.'}]},
 {t:'Розовое такси',f:1,x:'Машину отправили перекрашивать в фирменный цвет, а в покрасочной перепутали краску. Машина стала ярко-розовой.',c:[
  {l:'Перекрасить заново',cost:15000,fx:{broken:1},m:'Перекрасили. Розовой больше нет. Немного жаль.'},
  {l:'Оставить: будет «розовое такси»',fx:{rep:3},m:'Розовое такси стало звездой соцсетей. Его заказывают на свидания.',r:{p:.35,fx:{rep:-5},m:'Бизнес-клиенты отменяют заказы, увидев розовую машину. Корпоративный клиент ушёл.'}}]},
 {t:'Антифриз в омывайке',f:1,who:'mech',x:'Стажёр залил антифриз в бачок омывателя. Стёкла в разводах, в салоне пахнет химией.',c:[
  {l:'Промыть систему',cost:2000,m:'Промыли. Стажёру выдали две разные канистры с картинками.'},
  {l:'Пусть выработается',m:'Выработалось.',r:{p:.4,fx:{rep:-2},m:'Пассажиры жаловались на запах весь день.'}}]},
 {t:'Течёт тормозная жидкость',x:'Под одной машиной лужица. Механик говорит: тормозная жидкость, дело серьёзное.',c:[
  {l:'Срочно чинить',cost:5000,fx:{broken:1},m:'Шланг заменили. Тормоза в порядке.'},
  {l:'Долить и выпустить',cost:300,m:'Доливаем каждое утро.',r:{p:.4,fx:{money:-30000,broken:1,rep:-5},m:'Тормоза отказали на светофоре. ДТП.'}}]},
 {t:'Глушитель отвалился',f:1,x:'У машины на ходу отвалился ржавый глушитель. Водитель привёз его в багажнике как трофей.',c:[
  {l:'Новый глушитель',cost:6000,fx:{broken:1},m:'Тихо и красиво.'},
  {l:'Приварить старый',cost:1500,m:'Держится. Звук — как у спорткара.',r:{p:.4,fx:{rep:-1},m:'Рычит как трактор. Пассажиры вздрагивают.'}}]},
 {t:'Магнитола посадила аккумуляторы',f:1,x:'Механики оставили на ночь магнитолу с музыкой в трёх машинах — «чтобы веселее стояли». Аккумуляторы сели.',c:[
  {l:'Зарядить и провести беседу',cost:1500,m:'Зарядили. Музыку теперь включают только днём.'},
  {l:'Прикуривать по очереди',fx:{broken:1},m:'К обеду завели всех. Одна машина опоздала на смену.'}]},
 {t:'Пожарная инспекция',x:'В сервис пришла пожарная инспекция: огнетушители просрочены, промасленная ветошь в углу.',c:[
  {l:'Всё исправить при инспекторе',cost:8000,m:'Новые огнетушители, ветошь в металлическом ящике. Без штрафа.'},
  {l:'Договориться',m:'Инспектор ушёл с предупреждением.',r:{p:.5,fx:{money:-30000},m:'Не договорились. Штраф 30 000 ₽.'}}]},
 {t:'Дорогой сканер',who:'mech',x:'Механики просят профессиональный диагностический сканер за 40 000 ₽. Обещают находить поломки заранее.',c:[
  {l:'Купить',cost:40000,fx:{rep:1},m:'Сканер нашёл три скрытые поломки в первый же день.'},
  {l:'Обойтись старым',m:'Старый тоже работает. Иногда.',e:{p:.5,in:[4,9],fx:{broken:2,money:-10000},m:'Старый сканер пропустил поломку. Две машины встали на линии.'}}]},
 {t:'Шумоизоляция для комфорта',x:'Пассажиры «Комфорта» жалуются на шум в салоне. Можно сделать шумоизоляцию.',need:s=>s.fleet.some(c=>MODELS[c.m].cls!=='Эконом'),c:[
  {l:'Сделать во всех премиальных',cost:s=>Math.max(1,s.fleet.filter(c=>MODELS[c.m].cls!=='Эконом').length)*3000,fx:{rep:3},m:'Тихо как в библиотеке. Оценки выросли.'},
  {l:'Не нужно',m:'Шумно, но едут.'}]},
 {t:'Запчасти уходят «налево»',f:1,who:'mech',x:'По складу не сходится: новые колодки и фильтры исчезают. Подозрение пало на одного механика.',c:[
  {l:'Поставить камеру на склад',cost:5000,fx:{staff:-1},m:'Камера поймала механика с сумкой колодок. Уволен, запчасти вернули.'},
  {l:'Устроить ревизию',cost:1000,m:'Ревизия напугала всех. Запчасти перестали исчезать.'},
  {l:'Не раздувать',m:'Ничего не делаем.',r:{p:.6,fx:{money:-12000},m:'Склад опустел ещё сильнее.'}}]},
 {t:'Двигатель-миллионник',f:1,who:'mech',x:'Механик клянётся, что мотор Гранты пройдёт миллион, если «правильно с ним разговаривать».',need:s=>s.fleet.some(c=>c.m==='granta'),c:[
  {l:'Разрешить разговаривать',fx:{rep:1},m:'Механик разговаривает с мотором каждое утро. Мотор пока работает.',r:{p:.3,fx:{broken:1,money:-8000},m:'Мотор обиделся. Капитальный ремонт.'}},
  {l:'Капремонт по науке',cost:15000,m:'Мотор как новый. Механик говорит, это он его уговорил.'}]},
 // ---- ДИЛЕММЫ (обновление 6) ----
 {t:'Акция завтра, машины сломаны',dl:1,who:'mech',x:'Завтра агрегатор запускает акцию с повышенным спросом. Несколько машин в ремонте. Механики могут собрать их за ночь «на скорую руку».',need:s=>s.fleet.filter(c=>c.b&&!c.h).length>=2,c:[
  {l:'Собрать за ночь',fx:{fix:3,money:10000,tdebt:2},m:'Все машины на линии, акция удалась.',e:{p:.55,in:[3,7],fx:{broken:2,money:-20000},m:'Ночной ремонт развалился: две машины встали прямо на линии.'}},
  {l:'Чинить как положено',fx:{tdebt:-1},m:'Машины выйдут через пару дней. Акция прошла без них.'},
  {l:'Отдать в чужой сервис на ночь',cost:25000,fx:{fix:3},m:'Чужой сервис справился. Дорого, но надёжно.',r:{p:.25,fx:{broken:1},m:'В чужом сервисе «потеряли» датчик. Одна машина вернулась хуже, чем была.'}}]},
 {t:'Заводской дефект',dl:1,who:'mech',x:'Механики нашли заводской дефект рулевых тяг у новых машин. Если рассказать публично, дилер может отменить вашу скидку.',c:[
  {l:'Рассказать публично',fx:{rep:4,broken:2},m:'Две машины на проверке. Пассажиры благодарят за честность.',e:{p:.6,in:[5,10],fx:{money:30000},m:'Производитель объявил отзыв и компенсировал простой.',else:{fx:{money:-20000},m:'Дилер отменил скидки. Следующие машины обойдутся дороже.'}}},
  {l:'Тихо заменить тяги за свой счёт',cost:s=>Math.max(2,s.fleet.length/2|0)*2000,m:'Тяги заменили. Никто ничего не узнал.'},
  {l:'Ничего не делать',fx:{tdebt:1},m:'Тяги держатся.',r:{p:.3,fx:{rep:-10,money:-40000,broken:1},m:'Тяга лопнула на ходу. Машина в отбойнике, история во всех новостях.'}}]},
 {t:'Старшего механика переманивают',dl:1,who:'mech',x:'Конкурент предложил вашему старшему механику на 40% больше. Он честно пришёл и спрашивает, что вы скажете.',c:[
  {l:'Перебить предложение',cost:30000,m:'Механик остался.',e:{p:.5,in:[5,10],fx:{money:-20000,rel:-1},m:'Остальные механики узнали о прибавке и требуют того же.'}},
  {l:'Отпустить',fx:{staff:-1,rival:2},m:'Механик ушёл к конкуренту. У того ремонт стал быстрее.'},
  {l:'Отпустить и повысить ученика',fx:{staff:-1,rel:1},m:'Ученик сияет от гордости.',r:{p:.4,fx:{broken:2},m:'Ученик пока не тянет: две машины застряли в ремонте.'}}]},
 {t:'Запчасти с разборки',dl:1,x:'Разборка предлагает детали вчетверо дешевле. Подозрительно много одинаковых фар — похоже, с угнанных машин.',c:[
  {l:'Брать',cost:4000,fx:{parts:5},m:'Склад полон дешёвых запчастей.',r:{p:.25,fx:{money:-40000,rep:-7,parts:-5},m:'Полиция изъяла краденые запчасти прямо со склада. Штраф и статья в газете.'}},
  {l:'Только новые у дилера',cost:15000,fx:{parts:5},m:'Склад пополнен. Дорого, но чисто.'},
  {l:'Сообщить в полицию',fx:{rep:2},m:'Разборку закрыли.',e:{p:.4,in:[3,7],fx:{broken:1,money:-6000},m:'Друзья разборщиков пришли ночью и разбили фары у машины на стоянке.'}}]},
 {t:'Гарантия или скорость',dl:1,x:'Новая машина сломалась по гарантии. Дилер починит бесплатно, но через 10 дней. Ваши механики — за день, но гарантия сгорит.',c:[
  {l:'Ждать дилера',fx:{hold:10},m:'Машина у дилера.'},
  {l:'Чинить самим',cost:20000,m:'Машина на линии завтра.',e:{p:.35,in:[8,15],fx:{money:-35000,broken:1},m:'Без гарантии сломалась коробка. Платите сами.'}},
  {l:'Скандалить с дилером',fx:{hold:4},m:'Дилер сдался и поставил машину вне очереди.',r:{p:.5,fx:{hold:8},m:'Дилер обиделся и «потерял» заявку. Ещё одна машина застряла у него на проверке.'}}]},
 {t:'Механик пришёл навеселе',dl:1,who:'mech',x:'Лучший механик пришёл на смену с запахом. Говорит, «вчера был день рождения тёщи». Срочный ремонт ждёт только его.',c:[
  {l:'Отправить домой',fx:{broken:2},m:'Механик ушёл спать. Ремонт стоит.'},
  {l:'Уволить',fx:{staff:-1,rel:-1},m:'Уволен. Остальные механики тихо работают.',e:{p:.5,in:[2,5],fx:{broken:1},m:'Без лучшего механика ремонт идёт медленнее.'}},
  {l:'Закрыть глаза',fx:{rel:1},m:'Механик доделал ремонт.',r:{p:.35,fx:{broken:2,money:-15000,rep:-3},m:'Перепутал болты на суппорте. Машина вернулась с линии на эвакуаторе.'}}]},
 {t:'Ночные смены',dl:1,who:'mech',x:'Очередь на ремонт растёт. Механики могут выйти в ночь, но они на пределе.',need:s=>s.fleet.filter(c=>c.b&&!c.h).length>=2,c:[
  {l:'Ночь за двойную оплату',cost:12000,fx:{fix:3},m:'Машины к утру на ходу.',r:{p:.3,fx:{staff:-1},m:'Один механик выгорел и уволился.'}},
  {l:'Ночь «за идею»',fx:{fix:2,rel:-2},m:'Механики вышли, но с каменными лицами.',r:{p:.45,fx:{staff:-1},m:'Утром на столе лежало заявление об уходе.'}},
  {l:'Не надо, пусть отдыхают',fx:{rel:2},m:'Механики благодарны. Очередь стоит.'}]},
 {t:'Тюнинг для блогера',dl:1,x:'Автоблогер с миллионом подписчиков предлагает бартер: вы бесплатно тюнингуете его машину, он снимает обзор вашего сервиса.',c:[
  {l:'Сделать бесплатно',cost:30000,m:'Машина блогера сияет.',e:{p:.6,in:[3,6],fx:{rep:5,news:'viral'},m:'Обзор вышел: два миллиона просмотров. Пассажиры спрашивают «то самое такси».',else:{fx:{rep:-1},m:'Блогер выложил обзор чужого сервиса. Про вас — одна фраза в конце.'}}},
  {l:'Сделать за полцены',cost:15000,m:'Блогер поморщился, но согласился. Обзор вышел нейтральный.',r:{p:.5,fx:{rep:-5},m:'Блогер снял ролик «Жадный сервис такси». Миллион просмотров.'},bonus:{p:.5,fx:{rep:2}}},
  {l:'Отказаться',fx:{rival:1},m:'Блогер ушёл к конкурентам и снял обзор у них.'}]},
 {t:'Отработанное масло',dl:1,who:'mech',x:'Сдать 400 литров отработанного масла на утилизацию стоит 10 000 ₽. Механики предлагают «как все» — в ливнёвку ночью.',c:[
  {l:'Сдать по правилам',cost:10000,m:'Масло утилизировано, документы в порядке.'},
  {l:'Слить в ливнёвку',fx:{tdebt:1},m:'Сэкономили. Механики довольны.',r:{p:.3,fx:{money:-60000,rep:-9},m:'Экологи нашли радужное пятно в пруду и дорожку до вашего сервиса.'}},
  {l:'Продать котельной',fx:{money:4000},m:'Котельная забрала масло и даже заплатила.',r:{p:.2,fx:{money:-20000},m:'Котельную закрыли, а вас оштрафовали как поставщика.'}}]},
 {t:'Предоплата поставщику',dl:1,x:'Поставщик запчастей даёт скидку 30%, если оплатить сразу запас на три месяца. Ходят слухи, что у него проблемы с деньгами.',c:[
  {l:'Оплатить весь запас',cost:32000,fx:{parts:15},m:'Склад забит запчастями по выгодной цене.',r:{p:.25,fx:{parts:-10},m:'Поставщик обанкротился: пришла только треть заказа.'}},
  {l:'Половину запаса',cost:17000,fx:{parts:7},m:'Взяли половину. Риск поменьше.',r:{p:.25,fx:{parts:-4},m:'Поставщик обанкротился. Пришла только часть заказа.'}},
  {l:'Покупать как обычно',m:'Оставили всё как есть.',e:{p:.5,in:[4,9],fx:{news:'parts'},m:'Запчасти подорожали по всему городу. Скидка была бы кстати.'}}]},
 {t:'Изобретение механика',dl:1,who:'mech',x:'Механик собрал прибор, который снижает расход топлива. Хочет запатентовать его на себя — или продать вам права за 50 000 ₽.',c:[
  {l:'Купить права',cost:50000,m:'Права у парка.',e:{p:.55,in:[5,12],fx:{money:70000,rep:2},m:'Другие парки покупают лицензию на прибор. Отбили вложения с запасом.',else:{fx:{rep:-1},m:'Прибор оказался капризным. Лицензию никто не купил.'}}},
  {l:'Пусть патентует на себя',fx:{rel:2},m:'Механик счастлив и работает с огоньком.',e:{p:.5,in:[10,18],fx:{staff:-1},m:'Механик открыл свою фирму и ушёл. Прощался тепло.'}},
  {l:'Запретить самоделки',fx:{rel:-2},m:'Механик спрятал прибор в шкафчик.',r:{p:.3,fx:{staff:-1},m:'Механик обиделся и ушёл к конкурентам вместе с прибором.'}}]},
 {t:'Свадьба на лучшей машине',dl:1,f:1,x:'Завтра свадьба: заказали вашу лучшую машину за 25 000 ₽. Она сломана, нужна редкая деталь. Деталь есть — в другой машине.',c:[
  {l:'Снять деталь с другой машины',fx:{broken:1,money:25000,rep:2,tdebt:1},m:'Свадебная машина сияет. Вторая стоит «раздетая».'},
  {l:'Арендовать похожую машину',cost:15000,fx:{money:25000},m:'Арендовали белую машину.',r:{p:.3,fx:{rep:-5,money:-25000},m:'Арендованная машина оказалась серебристой. Невеста в слезах, деньги вернули.'}},
  {l:'Отменить заказ',fx:{rep:-4},m:'Жених кричал в трубку десять минут.'}]},
]];

/* ---- обновление 6: острые дилеммы ---- */
const SHARP=[[
 {t:'Водитель-кормилец',dl:1,x:'У Азамата четвёртый штраф за месяц — по правилам агрегатора пора отключать. У него трое детей, и он лучший в парке по выручке.',c:[
  {l:'Отключить по правилам',fx:{drivers:-1,rep:2,loy:-5},m:'Правила соблюдены. Азамат молча забрал вещи из машины. В курилке тихо.'},
  {l:'Оплатить штрафы, последний шанс',cost:12000,fx:{loy:4},m:'Азамат клянётся, что больше ни-ни. Водители видят: парк своих не бросает.',r:{p:.4,fx:{rep:-6,money:-20000},m:'Пятый штраф — уже с пассажиром в салоне. Агрегатор оштрафовал парк.'}},
  {l:'Перевести в ночь, где меньше камер',fx:{loy:1},m:'Азамат работает по ночам. Пока тихо.',e:{p:.5,in:[4,8],fx:{rep:-8,drivers:-1},m:'Журналисты узнали, что парк «прячет» нарушителей в ночных сменах. Азамата пришлось отключить — уже со скандалом.'}}]},
 {t:'Чистка отзывов',dl:1,x:'Знакомый предлагает удалить ваши плохие отзывы через «своего человека» в агрегаторе. Цена — 20 000 ₽. Отзывов правда много, и половина — справедливые.',c:[
  {l:'Заплатить',cost:20000,fx:{rep:6},m:'Отзывы исчезли за ночь. Рейтинг парка подскочил.',e:{p:.35,in:[5,10],fx:{rep:-15},m:'«Своего человека» поймали. В новостях список парков, покупавших чистку отзывов. Ваш — третий сверху.'}},
  {l:'Разобрать каждую жалобу честно',cost:6000,fx:{rep:2,loy:-3},m:'Ответили на все жалобы и устроили водителям разбор полётов. Медленно, но честно.'},
  {l:'Сообщить агрегатору о схеме',fx:{rep:1},m:'Агрегатор поблагодарил и начал проверку.',r:{p:.5,fx:{rival:2,loy:-2},m:'Знакомый оказался другом владельца «Шашечки». Теперь конкурент переманивает ваших водителей назло.'}}]},
 {t:'Слишком хороший новичок',dl:1,x:'Новичок за неделю набрал рейтинг 4,99 и выручку выше всех. Ветераны уверены, что он накручивает заказы через знакомых.',c:[
  {l:'Проверить его поездки',cost:5000,fx:{loy:-2},m:'Проверка ничего не нашла. Новичок обижен, ветераны недовольны.',r:{p:.5,fx:{drivers:-1,rep:3,loy:4},m:'Накрутка подтвердилась! Новичка отключили, ветераны торжествуют.'}},
  {l:'Победителей не судят',fx:{money:8000},m:'Новичок продолжает приносить деньги.',e:{p:.45,in:[4,8],fx:{rep:-8,money:-15000},m:'Агрегатор сам нашёл накрутку у вашего «звёздного» новичка. Штраф парку и понижение приоритета.'}},
  {l:'Поставить его в пример ветеранам',fx:{loy:-5,money:4000},m:'Ветераны обиделись: «Нас сравнивают с мальчишкой». Зато пара человек начала стараться.'}]},
 {t:'Сумка с наличными',dl:1,x:'Водитель нашёл в машине сумку: 300 000 ₽ наличными и ни одного документа. Пассажирка расплатилась картой, её номер не отвечает.',c:[
  {l:'Сразу сдать в полицию',fx:{rep:3},m:'Сумку оформили. Хозяйка нашлась через три дня и поблагодарила парк в местной газете.'},
  {l:'Сдать и премировать водителя',cost:10000,fx:{rep:3,loy:5},m:'Водитель получил премию за честность. Об этом говорит весь парк.'},
  {l:'Подождать неделю — вдруг не вспомнит',fx:{loy:-2},m:'Сумка лежит в сейфе. Водитель смотрит странно.',e:{p:.5,in:[3,6],fx:{money:100000},m:'За сумкой так никто и не пришёл. Деньги оприходовали как находку.',else:{fx:{rep:-12,money:-20000},m:'Хозяйка нашлась — с адвокатом: «Парк неделю удерживал мои деньги». Компенсация и позор в пабликах.'}}}]},
 {t:'Переезд на другой агрегатор',dl:1,x:'«Пчёлка» зовёт весь парк к себе: комиссия на 3% ниже навсегда. Но водителям придётся заново проходить проверку — несколько дней половина машин будет стоять.',c:[
  {l:'Переходить',fx:{news:'strike'},m:'Половина парка стоит на проверке. Касса пустеет.',e:{p:.8,in:[5,8],fx:{money:35000,loy:3},m:'Переход окупился: комиссия ниже, водители довольны новым приложением.',else:{fx:{news:'outage',rep:-3},m:'«Пчёлка» не справилась с нагрузкой: приложение лежит, водители проклинают переезд.'}}},
  {l:'Остаться',fx:{loy:-2},m:'Остались. Стабильно, но водители ворчат: «могли бы платить меньше».'},
  {l:'Перевести только половину',fx:{news:'backup'},m:'Половина парка на двух агрегаторах. Сложно, но надёжно.',r:{p:.35,fx:{news:'lowprio'},m:'Основной агрегатор заметил двойную игру и понизил вам приоритет.'}}]},
 {t:'Пассажир на коляске',dl:1,x:'Пассажиру на инвалидной коляске трижды отказали ваши водители: «не влезет в багажник». Он записал видео и ждёт ответа парка.',c:[
  {l:'Извиниться и переоборудовать машину',cost:30000,fx:{rep:5,hold:3},m:'Одна машина три дня на переоборудовании. Пассажир стал постоянным клиентом.'},
  {l:'Извиниться и оштрафовать водителей',fx:{rep:2,loy:-5,money:3000},m:'Пассажир принял извинения. Водители считают, что их наказали за чужую проблему.'},
  {l:'Это решение водителей, не парка',fx:{loy:2},m:'Водители благодарны за поддержку.',r:{p:.6,fx:{rep:-10},m:'Видео посмотрел весь город. «ДСТ-24 — такси не для всех». Агрегатор понизил приоритет.'}}]}
],[
 {t:'Тормоза или праздничная смена',dl:1,x:'Сегодня праздник и повышенный коэффициент. Механик говорит: у нескольких машин колодки «на грани». Если менять сейчас — они простоят весь самый денежный день.',c:[
  {l:'Менять всё сейчас',fx:{broken:3,tdebt:-2},m:'Три машины стоят в ремонте в лучший день месяца. Зато механики спокойны.'},
  {l:'Выпустить, поменять завтра',fx:{money:20000,tdebt:2},m:'Машины весь день на линии. Касса довольна.',r:{p:.3,fx:{broken:2,rep:-6,money:-30000},m:'У одной машины отказали тормоза на светофоре. Мягкое ДТП, но видео уже в сети.'}},
  {l:'Выпустить самые свежие',fx:{broken:1,money:8000},m:'Компромисс: одна машина в ремонте, остальные работают.',r:{p:.15,fx:{broken:1,rep:-3},m:'«Свежая» машина тоже не выдержала. Пассажир успел испугаться.'}}]},
 {t:'Машины от друга',dl:1,need:s=>carsN()<s.spots-2,x:'Старый друг продаёт парку две машины на 30% дешевле рынка. Документы «почти в порядке», друг просит не тянуть.',c:[
  {l:'Купить обе',cost:70000,fx:{cars:2},m:'Две машины в парке. Друг доволен.',e:{p:.4,in:[4,9],fx:{cars:-1,money:-20000,rep:-3},m:'Одна из машин оказалась в залоге у банка. Её изъяли прямо с линии, с пассажиром.'}},
  {l:'Купить одну и проверить',cost:35000,fx:{cars:1},m:'Одна машина в парке. Друг обиделся: «Не доверяешь?»',r:{p:.2,fx:{money:-15000},m:'С документами всё-таки проблемы: пришлось переоформлять через юриста.'}},
  {l:'Отказать',m:'Друг больше не звонит. Зато спится спокойно.'}]},
 {t:'47 штрафов',dl:1,x:'За месяц пришло 47 штрафов с камер. Водители уверяют: половина — когда машины стояли в ремонте. Журнал выдачи машин вели «как попало».',c:[
  {l:'Оплатить всё молча',cost:30000,fx:{tdebt:1},m:'Оплатили. Водители поняли, что штрафы можно не замечать.'},

  {l:'Разобрать каждый',cost:8000,fx:{tdebt:-2},m:'Разбирались неделю. Отменили немного, но журнал наконец в порядке.',r:{p:.5,fx:{money:22000},m:'Половину штрафов отменили: машины действительно стояли на ремонте!'}}]},
 {t:'Седан после потопа',dl:1,need:s=>carsN()<s.spots,x:'На аукционе седан бизнес-класса втрое дешевле рынка. В описании мелким шрифтом: «после небольшого подтопления».',c:[
  {l:'Купить',cost:50000,fx:{cars:1},m:'Блестит как новый. Пассажиры довольны.',e:{p:.55,in:[4,10],fx:{cars:-1,money:-10000},m:'Электрика сгнила изнутри: машина умерла посреди смены. Её проще сдать на разбор.',else:{fx:{rep:2},m:'Седан после потопа ездит и ездит. Механики не верят своим глазам.'}}},
  {l:'Пропустить',m:'Седан купил конкурент. Посмотрим, кто был прав.',e:{p:.5,in:[3,6],fx:{rival:1},m:'Седан после потопа прекрасно ездит у конкурента. Обидно.'}}]},
 {t:'Просроченные полисы',dl:1,x:'Выяснилось, что ОСАГО на двух машинах закончилось четыре дня назад. Машины всё это время ездили. Никто пока не заметил.',c:[

  {l:'Оформить «задним числом» через знакомого',cost:6000,m:'Полисы готовы за час. Даты — как надо.',r:{p:.3,fx:{money:-40000,rep:-5},m:'Знакомого задержали за подделку полисов. Ваши полисы недействительны, штраф и проверка.'}},
  {l:'Оформить сегодня, машины работают',cost:12000,m:'Полисы будут вечером, машины на линии.',r:{p:.15,fx:{money:-25000},m:'За два часа до полиса одна машина попала в ДТП. Платите сами.'}}]},

function effChips(c){const fx=Object.assign({},c.fx||{}),out=[];
  if(fx.rep>0)out.push(['up',`+${fx.rep} реп`]);if(fx.rep<0)out.push(['down',`${fx.rep} реп`]);
  if(fx.drivers>0)out.push(['up',`+${fx.drivers} вод.`]);if(fx.drivers<0)out.push(['down',`${fx.drivers} вод.`]);
  if(fx.cars>0)out.push(['up',`+${fx.cars} маш.`]);if(fx.cars<0)out.push(['down',`${fx.cars} маш.`]);
  if(fx.broken>0)out.push(['down','машина в ремонт']);if(fx.loy>0)out.push(['up','водители довольны']);if(fx.loy<0)out.push(['down','водители недовольны']);
  if(fx.staff<0)out.push(['','−сотрудник']);
  if(c.r)out.push(isBad(c.r.fx)?['risk','риск']:['up','есть шанс']);
  if(fx.rel>0)out.push(['up','начальник доволен']);if(fx.rel<0)out.push(['down','начальник обидится']);
  if(fx.tdebt>0)out.push(['risk','копит проблемы']);if(fx.tdebt<0)out.push(['up','меньше проблем']);
  if(fx.rent)out.push([fx.rent<0?'down':'up',`аренда ${fx.rent>0?'+':''}${fx.rent}%`]);
  if(fx.rival)out.push(['down','конкурент сильнее']);if(fx.lot)out.push(['up','своя стоянка']);
  if(fx.parts>0)out.push(['up',`+${fx.parts} запч.`]);if(fx.fix)out.push(['up','машины из ремонта']);if(fx.hold)out.push(['down',`машина недоступна ${fx.hold} дн.`]);
  if(fx.angry)out.push(['down','учредитель запомнит']);if(fx.staff>0)out.push(['up','+сотрудник']);
  if(fx.news){const N=NEWS.find(n=>n.id===fx.news);if(N)out.push([(N.demand||1)>=1?'up':'down',N.t.toLowerCase()])}
  if(c.game)out.push(['game','мини-игра']);if(c.chain)out.push(['','будет продолжение']);if(c.e)out.push(['echo','аукнется позже']);
  return out.map(([k,t])=>`<i class="eff ${k}">${t}</i>`).join('')}

function distFactor(){const A=S.alloc,tot=Object.values(A).reduce((a,b)=>a+b,0)||1;let f=0;

function headPick(d,ev){if(!ev||!ev.c||ev.c.length<2||!S.heads)return -1;const b=headBias(d);let best=-1,bs=-1e18;
  ev.c.forEach((c,i)=>{if(c.game&&b!=='bold')return;const fx=c.fx||{},cost=evCost(c,d),gain=fx.money>0?fx.money:0;
    const rb=c.r&&isBad(c.r.fx)?c.r.p:0,rg=c.r&&!isBad(c.r.fx)?c.r.p:0;let v=0;
    if(b==='eco')v=-cost+gain-(fx.money<0?-fx.money:0)-rb*4000-(c.e?1500:0);
    if(b==='safe')v=-rb*100-(isBad(fx)?30:0)-(c.e?25:0)-(fx.tdebt>0?20:0)-cost/4000;
    if(b==='people')v=(fx.rep||0)*3+(fx.loy||0)*1.5+(fx.drivers||0)*6+(fx.rel||0)*2-((fx.staff||0)<0?4:0)-rb*6-cost/25000;

    if(v>bs){bs=v;best=i}});return best}

function tomorrowTease(){
  const chain=S.queue.find(q=>q.at<=S.day);if(chain)return`Завтра продолжится история «${CHAINS[chain.id].ev.t}».`;
  if(S.day>=S.nextMeeting)return'Завтра собрание учредителей: подведут итоги плана и поставят новый.';
  if(S.tdebt>=6)return'Отложенные проблемы копятся. Это добром не кончится…';
  if(featOpen('inspect')&&S.day>=S.nextInspect)return'Ходят слухи, что завтра нагрянет проверка от учредителей…';
  if(featOpen('raid')&&S.day>=S.nextRaid&&!S.raid)return'Знакомый гаишник шепнул: скоро рейды на такси.';
  if(S.mode!=='sandbox'&&S.mode!=='daily'&&taxDueIn()<=3)return`Через ${taxDueIn()+1} дн. квартальный налог: примерно ${rub(Math.round(S.taxAcc*TAX_RATE/1000)*1000)}.`;
  if(featOpen('rival')&&S.day>=S.nextRival)return'Конкуренты что-то затевают…';
  const w=WEATHER[S.weather[0]];if(w&&w!==WEATHER.clear)return`Синоптики обещают: ${w.n.toLowerCase()}.`;
  return'Завтра обычный день. Наверное.'}

const getEv=(d,ref)=>typeof ref==='string'?CHAINS[ref].ev:EVENTS[d][ref];
function nextEvent(d){
  const qi=S.queue.findIndex(q=>q.d===d&&q.at<=S.day);
  if(qi>-1){const q=S.queue.splice(qi,1)[0];return q.id}
  const funnyP=d===1?(hasHead('gena')?.7:.45):0;
  for(let tries=0;tries<40;tries++){
    if(!S.decks[d].length)S.decks[d]=shuffle(EVENTS[d].map((_,i)=>i));
    const i=S.decks[d].pop(),ev=EVENTS[d][i];
    if(ev.need&&!ev.need(S))continue;
    if(!ev.dl&&S.day>=3&&Math.random()<(S.day>=6?.45:.3)&&S.decks[d].some(j=>EVENTS[d][j].dl&&(!EVENTS[d][j].need||EVENTS[d][j].need(S)))){S.decks[d].unshift(i);continue}
    if(funnyP&&!ev.f&&Math.random()<funnyP*.5&&S.decks[d].some(j=>EVENTS[d][j].f)){S.decks[d].unshift(i);continue}
    return i;
  }
  return 0;
}
function snap(){return{money:S.money,rep:S.rep,drivers:S.drivers,cars:carsN(),broken:brokenN()}}
function apply(fx={},d){
  fx=Object.assign({},fx);
  if(d===0&&hasHead('lena')&&fx.rep<0)fx.rep=Math.ceil(fx.rep/2);
  if(d===2&&hasHead('olga')&&fx.broken>0){let b=0;for(let i=0;i<fx.broken;i++)if(Math.random()<.5)b++;fx.broken=b}
  S.money+=fx.money||0;
  if(fx.rep>0&&S.rep>50){const g=fx.rep*Math.max(.3,1-(S.rep-50)/70);fx.rep=Math.floor(g)+(Math.random()<g%1?1:0)}
  S.rep=Math.max(0,Math.min(100,S.rep+(fx.rep||0)));
  S.drivers=Math.max(0,S.drivers+(fx.drivers||0));
  if(fx.cars>0)for(let i=0;i<fx.cars;i++)addCar('solaris');
  if(fx.cars<0)for(let i=0;i<-fx.cars;i++)removeCar();
  if(fx.broken>0)breakCars(fx.broken);
  if(fx.upg){S.upg[fx.upg]=true;if(fx.upg==='office')S.rep=Math.min(100,S.rep+5)}
  if(fx.cnt)S.cnt[fx.cnt]=(S.cnt[fx.cnt]||0)+1;
  if(fx.staff&&d!=null)S.staff[d]=Math.max(0,S.staff[d]+fx.staff);
  if(fx.loy&&S.dlist)S.dlist.forEach(x=>x.loy=Math.max(0,Math.min(100,x.loy+fx.loy)));
  if(fx.angry)S.angry=1;
  if(fx.contract&&S.contracts.length<3)S.contracts.push(Object.assign({},fx.contract,{fails:0}));
  if(fx.rel&&d!=null&&S.heads)relAdd(d,fx.rel);
  if(fx.tdebt)S.tdebt=Math.max(0,(S.tdebt||0)+fx.tdebt);
  if(fx.rent)CLASSES.forEach(cl=>{if(S.rents[cl])S.rents[cl]=Math.round(S.rents[cl]*(1+fx.rent/100)/50)*50});
  if(fx.rival&&S.rivals&&S.rivals.length){const r=[...S.rivals].sort((a,b)=>b.cars-a.cars)[0];r.cars+=fx.rival}
  if(fx.lot)S.lotOwned=1;
  if(fx.parts)S.parts=Math.max(0,(S.parts||0)+fx.parts);
  if(fx.fix)S.fleet.filter(c=>c.b&&!c.h).slice(0,fx.fix).forEach(c=>c.b=0);
  if(fx.hold){const c=S.fleet.find(c=>!c.b);if(c){c.b=1;c.h=fx.hold}}
  if(fx.news){const N=NEWS.find(x=>x.id===fx.news);if(N){S.news=S.news.filter(n=>n.id!==N.id);S.news.push({id:N.id,days:N.days})}}
}
const evCost=(c,d)=>{let v=typeof c.cost==='function'?c.cost(S)*inf():(c.cost||0)*costScale();if(d===1&&hasHead('timur'))v*=.8;return Math.round(v/100)*100};
const scx=fx=>fx&&fx.money?Object.assign({},fx,{money:Math.round(fx.money*(fx.money<0?negScale():costScale())/100)*100}):fx;
function choose(d,i,gameRes){
  if(S.done[d]||S.over||S.preview)return;
  const ev=getEv(d,S.today[d]),c=ev.c[i];
  if(c.game&&gameRes===undefined){LINE_GAMES[c.game](ok=>choose(d,i,ok));return}
  const before=snap();
  const hp=headPick(d,ev);
  S.money-=evCost(c,d);apply(scx(c.fx),d);
  let msg=c.m,bad=isBad(c.fx);
  if(c.game){const o=gameRes?c.win:c.lose;apply(scx(o.fx),d);msg=o.m;bad=!gameRes;if(gameRes&&c.game==='race')S.cnt.vip=(S.cnt.vip||0)+1}
  if(c.r){const rb=isBad(c.r.fx);let p=rb?c.r.p*rm(d):Math.min(.95,c.r.p/rm(d));
    if(d===0&&hasHead('artur')&&!rb)p=Math.min(.95,p*1.3);

  mgRaf=mgRAF(frame);
