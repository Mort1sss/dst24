/* reach — выполнить до срока; keep — продержаться весь срок без нарушений */
const QMODE={shifts:'reach',revenue:'reach',premium:'reach',drivers:'reach',buynew:'reach',train:'reach',rep:'keep',nobreak:'keep',lineup:'keep',fair:'keep',noneg:'keep'};
const AGGS=['«Поехали»','«Мигом»','«Шашечка»'];
const trainSum=()=>S.train.reduce((a,b)=>a+b,0);
function questProg(){const q=S.quest;if(!q)return;
  if(q.type==='premium')q.prog=premiumN();
  if(q.type==='drivers')q.prog=S.drivers;
  if(q.type==='buynew')q.prog=(S.cnt.bought||0)-q.start;
  if(q.type==='train')q.prog=trainSum()-q.start;}
function questText(q){const T=q.target,f=q.type==='revenue'?rub(T):T;
  return {shifts:`Отработать ${T} смен за ${q.len} дней`,revenue:`Заработать ${f} выручки за ${q.len} дней`,premium:`Довести число машин «Комфорт» и выше до ${T}`,
    drivers:`Довести число водителей до ${T}`,buynew:`Купить ${T} машины в автосалоне`,train:`Повысить обучение любого отдела`,
    rep:`Держать репутацию не ниже ${T} все ${q.len} дней`,nobreak:`Не больше ${T} ночных поломок за ${q.len} дней`,lineup:`Каждый день держать на линии не меньше ${T} экипажей`,
    fair:'Не поднимать ставку «Эконом» выше рынка',noneg:`${q.len} дней без решений, роняющих репутацию`}[q.type]}
function newQuest(){
  const types=Object.keys(QMODE).filter(t=>t!==S.lastQuest),type=types[Math.random()*types.length|0];
  const act=Math.max(3,activeN());let target=0,len=7,start=0;
  if(type==='shifts')target=Math.round(act*7*1.05);
  if(type==='revenue'){const est=S.fleet.filter(c=>!c.b).sort((a,b)=>carRevM(b.m)-carRevM(a.m)).slice(0,activeN()).reduce((a,c)=>a+carRevM(c.m),0)*(.5+S.rep/100);target=Math.max(50000,Math.round(est*7*1.05/1000)*1000)}
  if(type==='premium')target=premiumN()+2;
  if(type==='drivers')target=S.drivers+3;
  if(type==='buynew'){target=2;start=S.cnt.bought||0}
  if(type==='train'){if(trainSum()>=9)return newQuest();target=1;start=trainSum()}
  if(type==='rep')target=Math.max(55,Math.min(90,S.rep));
  if(type==='nobreak')target=Math.max(1,Math.round(carsN()/6));
  if(type==='lineup'){target=Math.max(3,act-1);len=5}
  if(type==='fair')target=mk('Эконом');
  if(type==='noneg')len=5;
  const q={type,target,len,days:len,start,prog:0,agg:AGGS[rand(0,2)],reward:20000+carsN()*1500};
  q.t=questText(q);S.quest=q;S.lastQuest=type;questProg();save();
  showModal(`<span class="step">ЗАДАНИЕ ОТ АГРЕГАТОРА ${q.agg}</span><h2>${q.t}</h2><p>Срок — ${len} дней. Награда: ${rub(q.reward)} и приоритет в выдаче заказов на 5 дней. Провал — −2 к репутации.</p><button class="btn" id="qOk">Принять</button>`);
  sfx('alert');$('qOk').onclick=()=>{hideModal();runMorning()};render();
}

function gameOver(){
  if(!S.over)recordResult('банкрот');
  S.over=true;save();render();
  const why=S.money<0?'Касса ушла в минус. Парк закрыли за долги.':S.rep<=0?'Агрегатор отключил парк за низкий рейтинг.':'Все водители разошлись. Машины стоят во дворе.';
  showModal(`<h2>Парк закрыт</h2><p>${why}</p><p class="note">Продержались дней: ${S.day-1}. Машин было: ${carsN()}.${S.mode==='endless'?` Выполнено целей: ${S.goal}.`:''}</p><button class="btn" id="again">Попробовать снова</button>`);
  $('again').onclick=pickMode;
}
function finale(){
  if(S.mode==='story')return storyFinale();
  if(S.mode==='daily'){const sc=dailyScore(),first=!S.over;if(first){recordResult('испытание дня');if(!G.daily||G.daily.key!==S.dailyKey||sc>G.daily.best)G.daily={key:S.dailyKey,best:sc};saveG()}
    S.over=true;save();render();
    showModal(`<span class="step">ИСПЫТАНИЕ ДНЯ · ${S.dailyKey}</span><h2>${sc.toLocaleString('ru-RU')} очков</h2><p>«${DAILY_SC[S.dailyIdx].n}». Касса ${rub(S.money)}, машин ${totalCars()}, репутация ${S.rep}.</p>
      <p class="note">Лучший результат сегодня: ${G.daily.best.toLocaleString('ru-RU')}. Отправьте друзьям — у них сегодня такое же испытание.</p><button class="btn" id="again">В меню</button>`);
    $('again').onclick=pickMode;return}

  showModal(`<h2>${win?'Империя «ДСТ-24»!':'Месяц позади'}</h2>
    <div class="rows"><div class="row"><span>Касса (нужно ${rub(GOAL_MONEY)})</span><b class="${ok[0]?'pos':'neg'}">${rub(S.money)}</b></div>
    <div class="row"><span>Машин (нужно ${GOAL_CARS})</span><b class="${ok[1]?'pos':'neg'}">${carsN()}</b></div>
    <div class="row"><span>Репутация (нужно 50)</span><b class="${ok[2]?'pos':'neg'}">${S.rep}</b></div></div>
    <p>${win?'Вы выросли в большой парк: деньги есть, пассажиры довольны, Гена почти научился заправлять машины.':'Парк работает, но цель не достигнута. Попробуйте раньше вкладываться в машины и людей.'}</p>
    <button class="btn" id="again">Новая игра</button>`);
  $('again').onclick=pickMode;
}

function storyFinale(){
  const C=CHAPTERS[S.chapter],win=C.goal(S),first=!S.over;
  if(first)recordResult(win?'глава пройдена':'глава провалена');
  S.over=true;if(win&&first)G.story=Math.max(G.story||0,S.chapter+1);saveG();save();render();
  const next=win&&S.chapter+1<CHAPTERS.length;
  showModal(`<span class="step">СЮЖЕТ</span><h2 class="${win?'pos':'neg'}">${win?'Глава пройдена!':'Глава провалена'}</h2><p>${C.n}. Цель: ${C.goalTxt}.</p>
    <p>${win?(next?'Следующая глава открыта.':'Вы прошли весь сюжет «ДСТ-24»! Парк стал империей.'):'Попробуйте ещё раз: цель не выполнена в срок.'}</p>
    <div class="btns">${next?'<button class="btn" id="chNext">Следующая глава</button>':''}<button class="btn ghost" id="again">${win?'В меню':'Попробовать снова'}</button></div>`);
  if(next)$('chNext').onclick=()=>chooseHeads('story',{chapter:S.chapter+1});
  $('again').onclick=win?pickMode:()=>chooseHeads('story',{chapter:S.chapter});
}

function chooseHeads(mode,opts={}){
  const heads=[null,null,null];
  const step=d=>{
    if(d>2){hideModal();newGame(mode,heads,opts);return}
    const p=G.pins[d];
    if(p&&HEADS[d].some(h=>h.key===p.key)){heads[d]={key:p.key,name:p.name};step(d+1);return}
    pickHead(d,key=>{heads[d]={key,name:HEADS[d].find(h=>h.key===key).name};step(d+1)},true);
  };
  step(0);
}
/* setup=true — выбор при старте игры; иначе — замена по требованию учредителя */

/* ================= ОТРИСОВКА ИНТЕРФЕЙСА ================= */
function chips(dl){
  const out=[];
  if(dl.money)out.push([dl.money>0,(dl.money>0?'+':'')+rub(dl.money)]);
  if(dl.rep)out.push([dl.rep>0,'реп '+(dl.rep>0?'+':'−')+Math.abs(dl.rep)]);
  if(dl.drivers)out.push([dl.drivers>0,(dl.drivers>0?'+':'−')+Math.abs(dl.drivers)+' вод.']);
  if(dl.cars)out.push([dl.cars>0,(dl.cars>0?'+':'−')+Math.abs(dl.cars)+' маш.']);
  if(dl.broken>0)out.push([false,dl.broken+' в ремонте']);
  return out.length?out.map(([up,t])=>`<span class="chip ${up?'up':'down'}">${t}</span>`).join(''):'<span class="chip">без изменений</span>';
}
function checkRank(){if(S.preview||S.over)return;
  while((S.rank||0)<RANKS.length-1&&RANKS[(S.rank||0)+1].need()){S.rank=(S.rank||0)+1;const R=RANKS[S.rank];
    addLog(`Новое звание: «${R.n}»! Открыто: ${R.unlock}.`);toast(`★ Звание: ${R.n}. Открыто: ${R.unlock}`);sfx('win');save()}}
function renderHud(prev){
  const endless=!hasLimit(),cars=carsN(),broken=brokenN(),active=activeN(),now=snap();
  const date=dateOf(S.day),sea=season(date),hol=HOLIDAYS[mmdd(date)];
  $('date').innerHTML=`${WD[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}<span class="dsea"> · ${sea.n}</span>${hol?' · '+hol[1]:''}`;
  $('parkName').textContent=`Таксопарк «${parkName()}»`;
  $('goalHead').innerHTML=(S.mode==='sandbox'?'Песочница: деньги без счёта, проиграть нельзя.':S.mode==='daily'?`<b>Испытание дня «${DAILY_SC[S.dailyIdx||0].n}».</b> Очки сейчас: ${dailyScore().toLocaleString('ru-RU')}.`:S.mode==='story'?`<b>${CHAPTERS[S.chapter].n}.</b> Цель: ${CHAPTERS[S.chapter].goalTxt}.`:endless?'Бесконечный режим: цели одна за другой.':`Цель к ${DAYS}-му дню: <b>${GOAL_CARS} машин</b> · <b>${rub(GOAL_MONEY)}</b> · репутация <b>50+</b>`)+` <span class="sub">· ${dif().n}.${S.strategy&&S.day<S.strategy.until?` Стратегия: «${STRATS[S.strategy.id].n}» ещё ${S.strategy.until-S.day} дн.`:''}</span>`;
  $('rank').textContent='★ '+rankName(S.rank||0);
  const stats=[
    ['money','Касса',rub(S.money),null,'money'],
    ['day','День',endless?String(S.day):Math.min(S.day,dayLimit())+' / '+dayLimit(),endless?null:Math.min(S.day,dayLimit())/dayLimit()*100],
    ['drv','Водители',String(S.drivers)+(S.drivers<cars-broken?` <small class="neg">(−${cars-broken-S.drivers})</small>`:''),null],
    ['rep','Репутация',S.rep+' / 100',S.rep,'rep'],
    ['car','Машины на линии',`${active} из ${cars}`+(broken?` · ${broken} в рем.`:''),cars?active/cars*100:0,'cars']];
  $('hud').innerHTML=stats.map(([k,l,v,b,key])=>{
    let fl='';if(prev&&key&&prev[key]!==now[key])fl=now[key]>prev[key]?'flash-up':'flash-down';
    return `<div class="stat px ${k}"><span class="lbl">${l}</span><span class="val ${fl}"${k==='money'?' id="moneyVal"':''}>${v}</span>${b!=null?`<div class="bar"><i style="width:${Math.min(100,b)}%"></i></div>`:''}</div>`}).join('');
}
let freshDesks=false;
let shownMoney=null,moneyRaf=null;
function countMoney(){const el=$('moneyVal');if(!el||shownMoney===null||Math.abs(shownMoney-S.money)<1){shownMoney=S.money;return}
  const from=shownMoney,to=S.money,t0=performance.now();cancelAnimationFrame(moneyRaf);
  const st=ts=>{const p=Math.min(1,(ts-t0)/600),e=1-Math.pow(1-p,3);const v=from+(to-from)*e;const el2=$('moneyVal');if(el2)el2.textContent=rub(v);shownMoney=v;if(p<1)moneyRaf=requestAnimationFrame(st);else shownMoney=to};moneyRaf=requestAnimationFrame(st)}
function render(prev){
  if(!S)return;
  if(!S.weather||S.weather.length<3)S.weather=[0,1,2].map(i=>genWeather(S.day+i));if(!S.dmods)rollDistricts();
  syncDrivers();checkGoals();checkRank();checkAch();
  const mFrom=shownMoney;
  const endless=!hasLimit();
  renderHud(prev);
  if(mFrom!==null&&mFrom!==S.money&&!still){const el=$('moneyVal');if(el)el.textContent=rub(mFrom);shownMoney=mFrom;countMoney()}else shownMoney=S.money;
  const tick=S.news.filter(n=>n.id!=='raidgai').map(n=>{const N=newsDef(n);const up=(N.demand||1)>1;const down=(N.demand||1)<1||N.leave||N.fail||N.risk1||N.repair;
    return `<span class="news ${up?'up':down?'down':''}">${N.t} <small>· ${N.d} · ещё ${n.days} дн.</small></span>`});
  if(S.raid)tick.push(`<span class="news down">Рейды ГАИ <small>· ещё ${S.raid.days} дн. · подготовка ${Math.round(S.raid.prep*100)}%</small></span>`);

const b64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s)};
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function pipe(bytes,stream){const r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer())}
async function makeCode(){
  const st=Object.assign({},S,{log:S.log.slice(0,15)});
  const json=JSON.stringify({v:1,s:st,g:{pins:G.pins,founders:G.founders}});
  const raw=new TextEncoder().encode(json);
  if(window.CompressionStream){try{return 'DST24Z.'+b64(await pipe(raw,new CompressionStream('deflate-raw')))}catch(e){}}
  return 'DST24B.'+b64(raw);
}
async function readCode(code){
  code=(code||'').replace(/\s+/g,'');
  const m=code.match(/^DST24([ZB])\.(.+)$/);if(!m)throw new Error('format');
  let bytes=unb64(m[2]);
  if(m[1]==='Z'){if(!window.DecompressionStream)throw new Error('browser');bytes=await pipe(bytes,new DecompressionStream('deflate-raw'))}
  const data=JSON.parse(new TextDecoder().decode(bytes));
  const st=data&&data.s;
  if(!st||!Array.isArray(st.fleet)||!Array.isArray(st.heads)||st.heads.length!==3||typeof st.money!=='number')throw new Error('data');
  st.fleet=st.fleet.filter(c=>c&&MODELS[c.m]);
  st.heads=st.heads.map((h,d)=>HEADS[d].some(x=>x.key===(h&&h.key))?{key:h.key,name:String(h.name||'').slice(0,40)||HEADS[d].find(x=>x.key===h.key).name}:{key:HEADS[d][0].key,name:HEADS[d][0].name});
  st.today=(st.today||[]).map((r,d)=>typeof r==='string'?(CHAINS[r]?r:0):(EVENTS[d][r]?r:0));
  return {s:Object.assign(fixState(st),{preview:false}),g:data.g||{}};
}

  if(scn.type==='police'){const x=-40+ease(p)*(W+80);R(x,104,26,8,'#f3ecdc');R(x+6,100,13,4,'#f3ecdc');R(x+8,101,4,2,'#9fd3ff');R(x+13,101,4,2,'#9fd3ff');R(x,107,26,2,'#3a6ab8');
    R(x+3,112,5,3,'#0e0b1c');R(x+18,112,5,3,'#0e0b1c');const on=Math.floor(e/3)%2;light(x+12,99,24,on?'255,60,60':'60,90,255',1);R(x+9,98,3,2,on?'#ff4d4d':'#4d6dff');R(x+13,98,3,2,on?'#4d6dff':'#ff4d4d');
    cx.globalCompositeOperation='lighter';for(let k=1;k<4;k++){cx.fillStyle=`rgba(255,60,60,${(.12/k).toFixed(3)})`;cx.fillRect(x+10-k*2,98-k,2+k*2,2+k*2);cx.fillStyle=`rgba(60,90,255,${(.12/k).toFixed(3)})`;cx.fillRect(x+14-k*2,98-k,2+k*2,2+k*2)}cx.globalCompositeOperation='source-over'}
  if(scn.type==='party'){for(let i=0;i<40;i++){const x=(i*37+e*.7*(i%3+1))%180+4,y=((i*23)+e*(.6+(i%4)*.2))%70+20;R(x,y,2,1,['#f7c331','#e66fa8','#4fc7b0','#86e06f','#ff8a4c'][i%5])}
    if(Math.floor(e/8)%2){R(70,30,2,5,'#f3ecdc');R(72,30,3,1,'#f3ecdc');R(110,26,2,5,'#f3ecdc');R(112,26,3,1,'#f3ecdc')}}
  if(scn.type==='founder'){const arrive=Math.min(1,p*2.5),x=W+10-ease(arrive)*(W-60);spr(cx,LIMO,x,104,true,{y:'#1c1a24',l:'#3a3550',d:'#0b0914',t:'#1c1a24',k:'#0b0914',b:'#1c1a24',c:'#1c1a24',g:'#e8e2d0'});
    if(arrive>=1){const wp=Math.min(1,(p-.4)/.4);if(wp>0)spr(cx,PERSON,x+6-wp*20,92+0,true,{b:'#e8b890',k:'#2e2a40',H:'#8a8a8a'})}}
  if(scn.type==='newcar'){const x=-30+ease(Math.min(1,p*1.6))*190;drawCar(cx,'solarisNew',x,115,false,null,Math.floor(x/2));
    if(p>.5)for(let i=0;i<6;i++){const a=e/6+i;R(x+12+Math.cos(a)*16,108+Math.sin(a)*8,1,1,'#ffe27a')}}
}
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=0;function loop(ts){if(paused){last=0;requestAnimationFrame(loop);return}const dt=last?Math.min(100,ts-last):16;last=ts;SP=dt/70;draw();requestAnimationFrame(loop)}

/* ================= ЗАСТАВКА ================= */
function splash(){const el=$('splash');if(!el)return;const c=$('splC'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const W=200,H=112,R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)};
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const stars=Array.from({length:50},()=>[rnd()*W,rnd()*60,rnd()*6]);
  const blds=[];for(let x=0;x<W;){const w=8+Math.floor(rnd()*14),h=14+Math.floor(rnd()*30);blds.push([x,w,h,Array.from({length:40},()=>rnd()<.35)]);x+=w+1}
  let t0=null,raf=0,done=false;
  function frame(ts){if(done)return;if(t0===null)t0=ts;const e=(ts-t0)/16;
    R(0,0,W,H,'#120e26');R(0,40,W,30,'#1a1436');
    stars.forEach(([x,y,p])=>{if(Math.floor(e/20+p)%5)R(x,y,1,1,'#cfc6ff')});
    for(let yy=-5;yy<=5;yy++)for(let xx=-5;xx<=5;xx++){if(xx*xx+yy*yy<=25&&(xx-3)*(xx-3)+(yy+1)*(yy+1)>16)R(172+xx,16+yy,1,1,'#f3ecdc')}
    blds.forEach(([x,w,h,win])=>{R(x,86-h,w,h,'#231c45');let k=0;for(let yy=86-h+3;yy<84;yy+=4)for(let xx=x+2;xx<x+w-2;xx+=3){if(win[k++%40])R(xx,yy,1,2,'#f7c331')}});
    R(0,86,W,26,'#2a2540');for(let x=-(e*1.5%16);x<W;x+=16)R(x,98,8,1,'#f7c331');R(0,110,W,2,'#3a3458');
    const tx=((e*1.6)%(W+80))-40;
    g.globalCompositeOperation='lighter';for(let k=0;k<5;k++){g.fillStyle=`rgba(255,226,122,${(.1-k*.018).toFixed(3)})`;g.fillRect(Math.round(tx+24),Math.round(93-k),10+k*7,4+k*2)}g.globalCompositeOperation='source-over';
    try{spr(g,SEDAN,tx,90,false,carPal('solaris'))}catch(err){R(tx,92,24,8,'#f7c331')}
    if(!still)raf=requestAnimationFrame(frame)}
  raf=requestAnimationFrame(frame);
  const close=()=>{if(done)return;done=true;cancelAnimationFrame(raf);el.classList.add('out');setTimeout(()=>el.remove(),600)};
  el.addEventListener('pointerdown',()=>{ensureAudio();sfx('win');close()});
  el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ensureAudio();close()}});
  el.focus&&el.focus();
  setTimeout(close,still?1500:4500)}

/* ---- логотип студии SitromGames ---- */
function studioLogo(next){const el=$('studio');if(!el)return next();
  const g=$('studioC').getContext('2d'),P=(x,y,c)=>{g.fillStyle=c;g.fillRect(x,y,1,1)};
  // долька цитруса: кожура, белая прослойка, сочные сегменты, листик
  for(let y=0;y<24;y++)for(let x=0;x<24;x++){const dx=x-11.5,dy=y-13.5,d=Math.hypot(dx,dy);if(d>9.6)continue;
    let c=d>8.4?'#e8761c':d>7.4?'#fff1c9':'#ffc53a';
    if(d<=7.4){const a=(Math.atan2(dy,dx)+Math.PI)/(Math.PI/4);if(Math.abs(a-Math.round(a))<.11*(8/Math.max(d,1)))c='#fff1c9';else if((x+y)%5===0&&d>2)c='#ffde7a'}
    if(d<1.3)c='#fff1c9';if(d>8.4&&dx<-3&&dy<-3)c='#ff9a3c';P(x,y,c)}
  [[13,2],[14,2],[12,3],[13,3],[14,3],[15,3],[13,4],[14,4]].forEach(([x,y])=>P(x,y,'#4fc76a'));P(12,4,'#2f8f4a');P(11,5,'#2f8f4a');
  const name='Sitrom'.split('').map((ch,i)=>`<span class="a" style="animation-delay:${.45+i*.08}s">${ch}</span>`).join('')+'Games'.split('').map((ch,i)=>`<span class="b" style="animation-delay:${.93+i*.08}s">${ch}</span>`).join('');
  $('studioName').innerHTML=name;
  let done=false;const close=()=>{if(done)return;done=true;el.classList.add('out');setTimeout(()=>el.remove(),650);next()};
  el.addEventListener('pointerdown',ev=>{ev.stopPropagation();ensureAudio();close()});
  el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '||ev.key==='Escape')close()});
  el.focus&&el.focus();
  setTimeout(close,still?1200:2900)}

/* ================= СТАРТ ================= */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
studioLogo(splash);
S=load();
if(!S){S=blankState('campaign');S.preview=true;START_FLEET.forEach(([m,k])=>addCar(m,k));S.today=[0,1,2].map(nextEvent);render();pickMode()}
else{render();if(S.over){hasLimit()&&S.day>dayLimit()?finale():gameOver()}else if(S.morning&&S.morning.length)runMorning()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
fitScene();draw();if(!still)requestAnimationFrame(loop);else setInterval(()=>paused||draw(),1000);
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});
if(!(S&&S.preview))setTimeout(checkLogin,400);else checkLoginQuiet();
function checkLoginQuiet(){const k=todayKey();G.login=G.login||{};if(G.login.last===k)return;const y=new Date();y.setDate(y.getDate()-1);const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();const streak=G.login.last===yk?(G.login.streak||0)+1:1;G.login={last:k,streak};G.loginPending=5000*Math.min(streak,7)+(streak%7===0?20000:0);saveG()}
