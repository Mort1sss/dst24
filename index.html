<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d1838">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ДСТ-24">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Таксопарк «ДСТ-24»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap">
<link rel="stylesheet" href="css/game.css">

<div class="wrap">
  <header>
    <div class="logo"><canvas class="logo-c" id="logoC" width="8" height="8" aria-hidden="true"></canvas><canvas class="face" id="ownerC" width="16" height="16" aria-label="Владелец"></canvas><h1 id="parkName">Таксопарк «ДСТ-24»</h1></div>
    <div class="head-right">
      <span class="rankb px" id="rank"></span>
      <span class="date px" id="date"></span>
      <button class="toggle" id="pauseBtn" aria-label="Пауза" title="Пауза">❚❚</button>
      <button class="toggle" id="menuBtn" aria-haspopup="dialog">☰ Меню</button>
      <div hidden><button id="installBtn" hidden></button><button id="photoBtn"></button><button id="helpBtn"></button><button id="musicBtn"></button><button id="sfxBtn"></button><button id="saveBtn"></button><button id="restart"></button></div>
    </div>
  </header>
  <div class="goal" id="goalHead"></div>

  <section class="hud" id="hud" aria-label="Показатели парка"></section>
  <div class="ticker" id="ticker"></div>
  <section class="tasks" id="tasks"></section>

  <div class="scene-box px"><canvas id="scene" width="320" height="150" aria-label="Двор таксопарка"></canvas></div>

  <section class="advisor px" id="advisor"></section>
  <section class="desks" id="desks"></section>

  <section class="mgmt px">
    <div class="mtabs" id="mtabs" role="tablist"></div>
    <div class="mbody" id="mbody"></div>
  </section>

  <div class="bottom">
    <div class="actions">
      <button class="btn" id="endDay" disabled>Закончить день →</button>
      <span class="hint" id="hint"></span>
      <button class="btn ghost" id="autoBtn" hidden>Авто-решение</button>
    </div>
    <details class="log px"><summary>ЖУРНАЛ СОБЫТИЙ</summary><ol id="log"></ol></details>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="card px" id="modalCard"></div></div>
<div class="toast px" id="toast" hidden></div>
<div class="modal pause" id="pause" hidden role="dialog" aria-modal="true" aria-labelledby="pauseH"><div class="card px"><span class="step">ПАУЗА</span><h2 id="pauseH">Игра на паузе</h2><p>Таймеры, анимация и музыка остановлены. Продолжайте, когда будете готовы.</p><div class="btns"><button class="btn" id="pauseGo">Продолжить ▶</button></div></div></div>
<div class="coach px" id="coach" hidden role="dialog" aria-live="polite"></div>
<div class="studio" id="studio" role="img" aria-label="SitromGames представляет" tabindex="0"><div class="st-in"><canvas id="studioC" width="24" height="24"></canvas><div class="st-name" id="studioName"></div><div class="st-sub">представляет</div></div></div>
<div class="splash" id="splash" role="button" tabindex="0" aria-label="Таксопарк «ДСТ-24». Нажмите, чтобы начать">
  <canvas id="splC" width="200" height="112" aria-hidden="true"></canvas>
  <div class="spl-t"><div class="spl-chk"></div><div class="spl-logo">ДСТ-24</div><div class="spl-sub">ТАКСОПАРК</div><div class="spl-tap">нажмите, чтобы начать</div></div>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/day.js"></script>
<script src="js/minigames.js"></script>
<script src="js/ui.js"></script>
<script src="js/art.js"></script>
<script src="js/sim.js"></script>
<script src="js/online.js"></script>
<script src="js/main.js"></script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
