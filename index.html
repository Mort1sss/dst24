<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d1838">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ДСТ-24">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Таксопарк «ДСТ-24»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap">
<style>
/* Layout: manager game — header, HUD, city ticker, goals/quest, pixel scene, three department desks, tabbed management panel, end-of-day bar. Single dark "night shift" look. */
:root{
  --night:#1d1838; --panel:#2a2450; --panel-2:#352d63; --edge:#0e0b1c;
  --ink:#f3ecdc; --muted:#a8a0cc; --taxi:#f7c331;
  --d1:#4fc7b0; --d2:#ff8a4c; --d3:#e66fa8;
  --good:#86e06f; --bad:#ff6b6b;
  --f-display:"Press Start 2P", "PT Mono", monospace;
  --f-body:"PT Mono", "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4}
.wrap{max-width:1140px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.px{border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px}
.checker{width:36px;height:24px;flex:none;background:conic-gradient(var(--edge) 25%,var(--taxi) 0 50%,var(--edge) 0 75%,var(--taxi) 0) 0 0/12px 12px;border:3px solid var(--edge)}
h1{font-size:clamp(14px,2.6vw,20px);color:var(--taxi);text-shadow:3px 3px 0 var(--edge)}
.head-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.date{font-family:var(--f-display);font-size:10px;background:var(--panel);padding:8px 10px}
.toggle{font-family:var(--f-display);font-size:9px;padding:8px 10px;background:var(--panel-2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.toggle.on{background:var(--taxi);color:var(--edge)}
.goal{font-size:15px;color:var(--muted)}
.goal b{color:var(--ink);font-weight:600}

.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel);padding:10px 12px;display:grid;gap:6px;min-width:0}
.stat .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat .val{font-family:var(--f-display);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--edge);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--taxi);transition:width .4s steps(8)}
.bar.green i{background:var(--good)}
.stat.money .val{color:var(--taxi)}
.flash-up{animation:fu .6s steps(3)}.flash-down{animation:fd .6s steps(3)}
@keyframes fu{50%{color:var(--good)}} @keyframes fd{50%{color:var(--bad)}}

.ticker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ticker .lab{font-family:var(--f-display);font-size:9px;color:var(--muted)}
.news{font-size:15px;background:var(--panel);border:3px solid var(--edge);padding:4px 8px}
.news.up{border-color:var(--good)}.news.down{border-color:var(--bad)}
.news small{color:var(--muted)}

.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.goalbox{background:var(--panel);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;min-width:0}
.goalbox .lvl{font-family:var(--f-display);font-size:9px;color:var(--edge);background:var(--taxi);padding:6px 8px;white-space:nowrap}
.goalbox.quest .lvl{background:var(--d1)}
.goalbox .gt{font-weight:600;min-width:0}
.goalbox .gr{font-size:15px;color:var(--good);grid-column:1/-1}
.goalbox .bar{grid-column:1/-1}

.scene-box{background:var(--edge);overflow:hidden}
#scene,#sceneGL{margin:0 auto}

.desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.desk{background:var(--panel);min-width:0;position:relative}
.desk-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--dc);color:var(--edge);border-bottom:3px solid var(--edge)}
.desk-head h2{font-size:10px}
.desk-head .boss{margin-left:auto;display:flex;align-items:center;gap:8px;text-align:right;font-size:14px;font-weight:600;line-height:1.15;min-width:0}
.face{width:40px;height:40px;background:var(--panel-2);border:3px solid var(--edge);flex:none}
.face.big{width:64px;height:64px}
.desk-body{padding:14px;display:grid;gap:12px;min-width:0}
.desk h3{font-size:10px;line-height:1.6;color:var(--dc);padding-right:70px}
.ev-text{display:flex;gap:10px;align-items:flex-start}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.funny,.chainb{font-family:var(--f-display);font-size:8px;color:var(--edge);background:var(--taxi);padding:3px 5px}
.chainb{background:var(--d1)}
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel-2);padding:9px 12px;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);font-weight:600;font-size:16px}
.choice:hover{background:#41387a}
.choice:active,.buy:active,.tab:active,.toggle:active{transform:translate(3px,3px);box-shadow:none}
.tag{font-family:var(--f-display);font-size:9px;white-space:nowrap;padding:4px 5px;background:var(--edge);color:var(--taxi)}
.tag.plus{color:var(--good)}
.result{background:var(--edge);padding:10px 12px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-display);font-size:9px;padding:4px 6px;background:var(--panel-2)}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
.stamp{position:absolute;top:62px;right:10px;font-family:var(--f-display);font-size:9px;color:var(--good);border:3px solid var(--good);padding:5px 6px;transform:rotate(-8deg);background:var(--panel)}

.mgmt{background:var(--panel);display:grid;min-width:0}
.mtabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:3px solid var(--edge);background:var(--edge)}
.mtab{font-family:var(--f-display);font-size:9px;padding:12px 12px;background:var(--panel-2);border:0;border-right:3px solid var(--edge);color:var(--muted)}
.mtab.on{background:var(--taxi);color:var(--edge)}
.mbody{padding:14px;display:grid;gap:14px;min-width:0}
.sub{color:var(--muted);font-size:15px}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--f-display);font-size:9px;padding:8px 10px;background:var(--panel-2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.tab.on{background:var(--taxi);color:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card2{background:var(--panel-2);padding:12px;display:grid;gap:8px;align-content:start;min-width:0;border:3px solid var(--edge)}
.car-top{display:flex;align-items:center;gap:10px}
.mini{width:76px;height:34px;background:var(--panel);border:3px solid var(--edge);flex:none}
.card2 h3{font-size:10px;line-height:1.5}
.kind{font-size:14px;color:var(--muted)}
.cls{font-family:var(--f-display);font-size:8px;background:var(--edge);color:var(--taxi);padding:2px 4px;margin-right:4px;vertical-align:1px}
.specs{display:grid;gap:4px;font-size:15px}
.spec{display:flex;justify-content:space-between;gap:8px}
.spec b{font-family:var(--f-display);font-size:9px;font-weight:400;align-self:center;white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:8px;height:8px;background:var(--edge)}.pips i.on{background:var(--good)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.buy{flex:1;font-family:var(--f-display);font-size:9px;padding:9px 8px;background:var(--taxi);color:var(--edge);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);white-space:nowrap}
.buy.alt{background:var(--panel);color:var(--ink)}
.buy.sm{flex:0 0 auto;padding:7px 10px}
.buy:disabled{background:#4a4378;color:#2a2450;cursor:not-allowed}
.done-tag{font-family:var(--f-display);font-size:9px;color:var(--good)}

.tablewrap{overflow-x:auto;max-height:440px;overflow-y:auto;border:3px solid var(--edge)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums;min-width:560px}
th{font-family:var(--f-display);font-size:8px;color:var(--muted);text-align:left;padding:8px;background:var(--edge);position:sticky;top:0}
td{padding:6px 8px;border-bottom:2px solid var(--panel);background:var(--panel-2)}
td .bar{width:70px}
.st-ok{color:var(--good)}.st-bad{color:var(--bad)}

.dept3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dcard{background:var(--panel-2);border:3px solid var(--edge);display:grid;min-width:0}
.dcard .dh{background:var(--dc);color:var(--edge);padding:8px 10px;font-family:var(--f-display);font-size:9px;border-bottom:3px solid var(--edge)}
.dcard .db{padding:12px;display:grid;gap:10px}
.who{display:flex;gap:10px;align-items:center}
.who b{font-size:17px}
.perk{font-size:14px;color:var(--muted)}
.perk strong{color:var(--taxi);font-weight:600}
.namefield{display:flex;gap:6px}
input[type=text]{font:inherit;font-size:15px;background:var(--edge);color:var(--ink);border:3px solid var(--edge);padding:5px 8px;min-width:0;flex:1}
label.chk{display:flex;gap:6px;align-items:center;font-size:15px;cursor:pointer}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-family:var(--f-display);font-size:11px;min-width:3ch;text-align:center}
input[type=range]{width:100%;accent-color:var(--taxi)}

.achs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ach{background:var(--panel-2);border:3px solid var(--edge);padding:10px;display:grid;gap:4px;opacity:.5}
.ach.got{opacity:1;border-color:var(--taxi)}
.ach b{font-family:var(--f-display);font-size:9px;line-height:1.5}
.ach span{font-size:14px;color:var(--muted)}

.bottom{display:flex;flex-wrap:wrap;gap:16px;align-items:start}
.btn{font-family:var(--f-display);font-size:12px;padding:14px 18px;background:var(--taxi);color:var(--edge);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn:disabled{background:#5a5285;color:#2a2450;cursor:not-allowed}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.hint{color:var(--muted);font-size:15px}
.log{flex:1 1 300px;min-width:0;background:var(--panel);padding:12px 14px;max-height:200px;overflow:auto}
.log h3{font-size:10px;color:var(--muted);margin-bottom:8px}
.log ol{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.log li span{color:var(--muted);font-family:var(--f-display);font-size:9px;margin-right:6px}
.actions{display:flex;flex-direction:column;gap:12px}

[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(14,11,28,.84);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal.pause{z-index:40}
.card{background:var(--panel);width:min(560px,100%);padding:20px;display:grid;gap:14px;max-height:100%;overflow:auto}
.card h2{font-size:13px;color:var(--taxi);line-height:1.5}
.rows{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:2px dashed var(--panel-2);padding-bottom:5px}
.row b{font-family:var(--f-display);font-size:10px;white-space:nowrap;align-self:center}
.row.total b{color:var(--taxi)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{color:var(--muted);font-size:15px}
.modes,.cands{display:grid;gap:10px}
.mode{display:grid;gap:4px;text-align:left;background:var(--panel-2);padding:12px 14px;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.mode:hover{background:#41387a}
.mode b{font-family:var(--f-display);font-size:10px;font-weight:400;color:var(--taxi);line-height:1.5}
.mode span{color:var(--muted);font-size:15px}
.cand{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel-2);padding:10px 12px;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}
.cand:hover{background:#41387a}
.cand div{display:grid;gap:2px;min-width:0}
.cand b{font-size:17px}
.cand small{color:var(--muted);font-size:14px}
.step{font-family:var(--f-display);font-size:9px;color:var(--muted)}
.mg-q{font-size:20px;font-weight:600;color:var(--taxi)}
.mode.mg-ok,.mg-doc.mg-ok{border-color:var(--good);background:#2f5a3a}
.mode.mg-bad,.mg-doc.mg-bad{border-color:var(--bad);background:#5a2f3a}
.mg-docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mg-doc{display:grid;gap:2px;text-align:left;background:var(--panel-2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:8px 10px}
.mg-doc b{font-family:var(--f-ui);font-size:17px;letter-spacing:.05em}
.mg-doc span{font-size:15px;color:var(--muted)}
.mg-doc.on{border-color:var(--taxi);background:#4a4378}
.mg-timer{font-family:var(--f-ui);font-weight:700;font-size:18px;color:var(--taxi)}
.mg-bar{position:relative;height:34px;background:var(--edge);border:3px solid var(--edge);overflow:hidden}
.mg-zone{position:absolute;top:0;bottom:0;background:var(--good)}
.mg-mark{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--taxi);box-shadow:0 0 0 2px var(--edge)}
.rentrow{display:grid;gap:4px;background:var(--panel);border:3px solid var(--edge);padding:8px 10px}
.rankb{font-family:var(--f-ui);font-weight:700;font-size:15px;background:var(--taxi);color:var(--edge);padding:6px 10px}
.votes{display:flex;gap:6px;align-items:center;margin-top:4px}
.votes .face{width:30px;height:30px}
.dash{background:var(--edge);padding:10px 12px;display:grid;gap:6px;font-family:"PT Mono",monospace;font-size:15px;color:var(--good)}
.lg-canvas{width:min(100%,280px);height:auto;aspect-ratio:8/9;margin:0 auto;border:3px solid var(--edge);touch-action:manipulation}
.mg-gauge{display:block;width:min(100%,384px);height:auto;margin:0 auto;border:3px solid var(--edge)}
.mg-bar.park{background:repeating-linear-gradient(90deg,#2a2740 0 18px,#322e4c 18px 20px)}
.mode:disabled{cursor:not-allowed}
.logo-c{width:32px;height:32px;flex:none}
.logo-c.sm{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px}
#ownerC{width:40px;height:40px}
.mapc{width:100%;max-width:640px;height:auto;aspect-ratio:16/9;border:3px solid var(--edge);margin:0 auto}
.sw{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);margin-right:5px;vertical-align:-2px}
.chart{width:100%;height:auto;display:block}
.paper{background:#efe6cf;color:#2a2018;padding:16px 18px;border:3px solid var(--edge);display:grid;gap:8px;font-family:"PT Mono",monospace}
.paper h3{font-family:var(--f-display);font-size:11px;color:#2a2018;margin-top:4px;line-height:1.5}
.paper p{color:#3a3028;font-size:15px}
.paper-head{font-family:var(--f-display);font-size:15px;text-align:center;border-bottom:3px double #2a2018;padding-bottom:6px;letter-spacing:.05em}
.paper-sub{font-size:13px;text-align:center;color:#5a4a38}
.mode.lot{cursor:default}
/* мягче: внутренняя подсветка панелей и фон */
.px{box-shadow:4px 4px 0 var(--edge),inset 0 2px 0 rgba(255,255,255,.06)}
body{background:linear-gradient(180deg,#1f1a3c 0%,#18142f 100%) fixed}
.desk-head{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.choice{box-shadow:3px 3px 0 var(--edge),inset 0 2px 0 rgba(255,255,255,.05)}
.advisor{background:var(--panel);display:flex;gap:12px;align-items:center;padding:10px 14px;border-left:6px solid var(--taxi)}
.advisor .adv-t{display:grid;gap:2px;flex:1;min-width:0}
.advisor b{font-family:var(--f-display);font-weight:400;font-size:10px;color:var(--taxi)}
.advisor span{font-size:16px}
.choice .cl{display:grid;gap:4px;min-width:0}
.effs{display:flex;flex-wrap:wrap;gap:4px}
.eff{font-style:normal;font-size:13px;font-weight:400;padding:0 6px;background:var(--edge);color:var(--muted)}
.eff.up{color:var(--good)}.eff.down{color:var(--bad)}.eff.risk{color:#ffb04a}.eff.game{color:var(--d1)}
.newdot{display:inline-block;width:8px;height:8px;background:var(--bad);margin-left:6px;vertical-align:2px}
.mtab-more{align-self:center;padding:0 12px;color:var(--muted);font-size:14px}
.hintbox{background:var(--edge);border-left:4px solid var(--d1);padding:8px 12px;font-size:15px;color:var(--ink);max-width:none}
.bignet{font-family:var(--f-display);font-size:26px;text-align:center;padding:6px 0}
.more summary{cursor:pointer;color:var(--taxi);font-size:15px;padding:6px 0}
.more[open] summary{margin-bottom:8px}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes deskIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:4px 4px 0 var(--edge),0 0 0 0 rgba(247,195,49,.0)}50%{box-shadow:4px 4px 0 var(--edge),0 0 18px 2px rgba(247,195,49,.45)}}
@keyframes pulseR{0%,100%{opacity:1}50%{opacity:.55}}
.modal{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .18s ease-out}
.modal .card{animation:popIn .24s cubic-bezier(.2,.9,.3,1.2)}
.toast{animation:slideUp .28s cubic-bezier(.2,.9,.3,1.1)}
.desks.fresh .desk{animation:deskIn .45s cubic-bezier(.2,.9,.3,1) both}
.desks.fresh .desk:nth-child(2){animation-delay:.08s}.desks.fresh .desk:nth-child(3){animation-delay:.16s}
.result .chip{animation:chipIn .3s cubic-bezier(.2,.9,.3,1.4) both}
.result .chip:nth-child(2){animation-delay:.05s}.result .chip:nth-child(3){animation-delay:.1s}
.mbody.swap{animation:fadeIn .2s ease-out}
.choice,.buy,.mode,.tab,.mtab,.toggle,.btn{transition:transform .12s ease,box-shadow .12s ease,background-color .15s ease,filter .15s}
.choice:hover,.mode:hover,.buy:not(:disabled):hover{transform:translate(-1px,-1px);filter:brightness(1.08)}
.choice:hover{box-shadow:5px 5px 0 var(--edge)}
.btn.ready{animation:glow 1.6s ease-in-out infinite}
.bar i{transition:width .6s cubic-bezier(.2,.9,.3,1)}
.news.crisis{animation:pulseR 1.4s ease-in-out infinite;border-color:var(--bad)}
.streak{display:flex;gap:6px;justify-content:center}
.streak i{font-style:normal;width:32px;height:32px;display:grid;place-items:center;background:var(--edge);color:var(--muted);font-family:var(--f-display);font-size:11px}
.streak i.on{background:var(--taxi);color:var(--edge)}
